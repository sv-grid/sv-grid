# Adds a "Sponsor" button at the top of the repo. SvGrid is open core,
# not donation-driven, so the only entry is `custom:` pointing at the
# Enterprise pricing page - that's where commercial support actually
# happens. If GitHub Sponsors is ever set up for jQWidgets, add
# `github: jqwidgets` above the `custom:` line and both will surface.
# See: https://docs.github.com/en/repositories/managing-your-repositorys-settings-and-features/customizing-your-repository/displaying-a-sponsor-button-in-your-repository

custom: ["https://svgrid.com/pricing"]

name: Daily tweet

# Post one tweet per day to the @svgrid account. Each run picks the most timely
# thing to promote (a recent npm release, the blog post that went live today, a
# curated feature highlight, or an AI-generated original), renders a branded
# card, and posts it via the X API. See tools/twitter/README.md for the full
# design and the X developer-portal setup.
#
# Required repo secrets (posting):
#   X_API_KEY, X_API_SECRET, X_ACCESS_TOKEN, X_ACCESS_TOKEN_SECRET
# Optional repo secrets:
#   ANTHROPIC_API_KEY - enables AI-written hooks (templates are used without it).
#   WEBSITE_TOKEN     - PAT to read the private website for the blog check.
# Optional repo variables:
#   TWEET_MODEL       - model id for AI copy (default: claude-sonnet-4-6).
#
# 07:40 UTC: after the website rebuild (deploy-website.yml, 07:12) so the blog
# post whose date is today is already live when we link to it.

on:
  workflow_dispatch:
    inputs:
      verify:
        description: 'Verify credentials only (prints the handle, posts nothing)'
        type: boolean
        default: false
      force:
        description: 'Force a topic type (release | blog | highlight | ai)'
        type: string
        default: ''
      post:
        description: 'Actually post to X (unchecked = dry run)'
        type: boolean
        default: false
  schedule:
    - cron: '40 7 * * *'

permissions:
  contents: read

concurrency:
  group: daily-tweet
  cancel-in-progress: false

jobs:
  tweet:
    runs-on: ubuntu-latest
    # Bound the run so a hung API call can't hold the concurrency lock.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # The blog lives in the PRIVATE website submodule. Clone it so the blog
      # check can see today's post. If WEBSITE_TOKEN is absent the step is
      # skipped and the selector simply falls back past the blog type.
      - name: Check out the private website (for the blog check)
        env:
          WEBSITE_TOKEN: ${{ secrets.WEBSITE_TOKEN }}
        run: |
          if [ -z "$WEBSITE_TOKEN" ]; then
            echo "No WEBSITE_TOKEN set; skipping blog check (selector falls back past 'blog')."
            exit 0
          fi
          rm -rf website
          git clone --depth 1 --branch main \
            "https://x-access-token:${WEBSITE_TOKEN}@github.com/sv-grid/website.git" website

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium (for the card renderer)
        run: pnpm exec playwright install --with-deps chromium

      - name: Post tweet
        # Scheduled runs always post. Manual runs post only when the `post`
        # input is checked, so you can dry-run from the Actions tab first.
        run: node tools/post-tweet.mjs ${{ inputs.verify && '--verify' || ((github.event_name == 'schedule' || inputs.post) && '--post' || '') }}
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TWEET_MODEL: ${{ vars.TWEET_MODEL }}
          TWEET_FORCE: ${{ inputs.force }}

      - name: Upload rendered card
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tweet-card
          path: .tweet-out/card.png
          if-no-files-found: ignore

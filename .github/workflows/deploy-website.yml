name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'examples/src/demos/**'
      # Zazo, the site's helper, is imported from here by the home and demos pages.
      - 'examples/src/zazo/**'
      - 'packages/grid/**'
      - 'docs/**'
      - '.github/workflows/deploy-website.yml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      # The website's prebuild/postbuild shell out to these, so a fix in one has
      # to be able to trigger its own deploy (listing the scripts rather than
      # tools/** keeps unrelated tooling from redeploying the site).
      - 'tools/build-docs-index.mjs'
      # The deploy runs the agent-path check; a change to it has to run it.
      - 'tools/web-eval/**'
      - 'tools/build-schemas.mjs'
      - 'tools/fetch-discussions.mjs'
      - 'tools/prerender-site.mjs'
      # Shared doc/demo/SEO helpers the prerender and the site import.
      - 'tools/lib/**'
      # Blog SEO structure generated at deploy time (see the blog:seo step).
      - 'tools/blog-internal-links.mjs'
      - 'tools/blog-pillars.mjs'
      - 'tools/twitter/build-tips-pages.mjs'
      - 'tools/twitter/tips-data.mjs'
      - 'tools/indexnow.mjs'
      # The trial zip (built in the deploy) and what goes into it.
      - 'tools/build-trial-bundle.mjs'
      - 'tools/trial-bundle/**'
      - 'packages/enterprise/**'
  # Instant deploy: the PRIVATE website repo (sv-grid/website) fires this via a
  # repository_dispatch on every push to its main (see its notify-monorepo
  # workflow), since website content changes no longer land in this repo.
  repository_dispatch:
    types: [website-updated]
  workflow_dispatch:
    inputs:
      indexnow_all:
        description: 'Submit every sitemap URL to IndexNow, not only the changed ones'
        type: boolean
        default: false
  # Daily rebuild so scheduled blog posts go live on their date. The build gates
  # out future-dated posts (see tools/schedule-blog.mjs + lib/blog.ts), so each
  # day's rebuild publishes exactly the posts whose date has arrived. 07:12 UTC
  # is an off-peak, non-round minute (GitHub delays jobs scheduled on the hour).
  schedule:
    - cron: '12 7 * * *'
  # Rebuild when a discussion changes so the Community page's baked list stays
  # near-real-time (created / edited / answered etc.) instead of only refreshing
  # on the daily cron. Per-comment events (discussion_comment) are intentionally
  # not included - they would rebuild on every reply; comment counts catch up on
  # the next discussion-level change or the daily build.
  discussion:
    types: [created, edited, deleted, answered, unanswered, category_changed]

permissions:
  contents: read
  pages: write
  id-token: write
  # Lets the build read this repo's GitHub Discussions (GraphQL) so the
  # Community page can bake them into a static browse list.
  discussions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The website source lives in a PRIVATE repo (git submodule at website/).
      # Clone its latest main into website/ so the daily blog + content changes
      # deploy without having to bump the submodule pointer each time. Needs a
      # PAT with read access to sv-grid/website, stored as the WEBSITE_TOKEN
      # repo secret (the default GITHUB_TOKEN cannot read another repo).
      - name: Check out the private website
        env:
          WEBSITE_TOKEN: ${{ secrets.WEBSITE_TOKEN }}
        run: |
          rm -rf website
          git clone --depth 1 --branch main \
            "https://x-access-token:${WEBSITE_TOKEN}@github.com/sv-grid/website.git" website

      # Regenerate the blog's SEO structure against the fresh clone: the four
      # tips pages, the three pillar hubs, and every post's "Related reading"
      # block. The daily drip adds posts without any of this, so it has to be
      # rebuilt on each deploy or new posts publish as orphans. Dependency-free
      # node scripts, so they run before pnpm install. Order matters: tips pages
      # first (they are posts), pillars next (they list published posts), links
      # last (so the pillars and tips pages get linked and link out).
      - name: Generate blog SEO structure
        run: |
          node tools/twitter/build-tips-pages.mjs
          node tools/blog-pillars.mjs
          node tools/blog-internal-links.mjs

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm --filter @svgrid/grid build

      - name: Build website
        run: pnpm --filter svgrid-website build
        env:
          # Served from the svgrid.com custom domain at the root.
          SVGRID_SITE_BASE: /
          SVGRID_SITE_ORIGIN: https://svgrid.com
          # Exposed to the client build (canonical URLs in src/lib/seo.ts).
          VITE_SITE_ORIGIN: https://svgrid.com
          # Build-time GitHub Discussions fetch (website prebuild). Falls back to
          # an empty dataset if absent, so the build never fails on this.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Enable in-place community-demo voting: point the playground at the
          # deployed voting worker (see workers/svgrid-vote/README.md). When
          # unset, the Upvote control simply links out to the GitHub discussion.
          # VITE_VOTE_API: https://vote.svgrid.com
          # The trial dialog records sign-ups at the trial worker
          # (workers/svgrid-trial/README.md). Unset, it still downloads the zip
          # and fires the analytics event, but stores nothing. Read from either
          # a variable or a secret of that name: the URL is public (it ends up
          # in the client bundle), but it was first added as a secret.
          VITE_TRIAL_API: ${{ vars.TRIAL_API || secrets.TRIAL_API }}

      # The "Start a 30-day trial" download: the published @svgrid/grid and
      # @svgrid/enterprise tarballs from npm, the site's /demos page built from
      # website/trial.html to run offline, and a README. Served at /downloads/svgrid-trial.zip.
      - name: Build the trial download
        run: node tools/build-trial-bundle.mjs --out website/dist/downloads

      - name: Add .nojekyll
        run: touch website/dist/.nojekyll

      # An agent with only a fetch tool, starting at /llms.txt and reading each
      # response cut at 100 KB, must still reach the docs, demo sources, API
      # entries and MCP endpoint it reached before (tools/web-eval). It reads
      # the built files, so it takes seconds; a task failing that passed in
      # tools/web-eval/baseline.json stops the deploy.
      - name: Agent paths still work
        run: node tools/web-eval/run.mjs --dist website/dist --check

      # IndexNow, step 1 of 2 (tools/indexnow.mjs). Runs here, before the
      # deploy, because it compares this build's page hashes with the copy on
      # the site that is still live. It also writes the key file into dist, so
      # it has to come before the pages artifact is uploaded. Never fails the
      # build.
      - name: Plan IndexNow submission
        continue-on-error: true
        run: node tools/indexnow.mjs plan --dist website/dist --out indexnow-urls.json ${{ inputs.indexnow_all && '--all' || '' }}
        env:
          SVGRID_SITE_ORIGIN: https://svgrid.com

      - name: Keep the IndexNow list for the submit job
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-urls
          path: indexnow-urls.json
          if-no-files-found: ignore
          retention-days: 3

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # IndexNow, step 2 of 2: tell Bing and the other IndexNow engines which pages
  # changed, once the new build (and its key file) is live. ChatGPT search reads
  # Bing's index, so this is how a new page reaches it without waiting for a
  # crawl. Informational only: it cannot fail or block a deploy.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: tools/indexnow.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: indexnow-urls

      - name: Submit changed URLs
        run: node tools/indexnow.mjs submit --in indexnow-urls.json
        env:
          SVGRID_SITE_ORIGIN: https://svgrid.com

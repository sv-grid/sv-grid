name: Blog post (weekly)

# Generate one deep blog post a week with the Anthropic API and commit it.
# The subject is the next unwritten entry of tools/blog-topics.json (a search
# query with the demos and docs the post must link); an empty queue is a
# no-op run. The post is appended to the END of the publish queue (dated after
# the last scheduled post), so it goes live on its own day via the existing
# drip - it is never published the same day. The daily website rebuild
# (deploy-website.yml, 07:12 UTC) renders whichever post's date has arrived,
# hero image included.
#
# Required repo secret:
#   ANTHROPIC_API_KEY - Anthropic API key.
# Optional repo variable:
#   BLOG_MODEL - model id (default: claude-opus-5-5).
#   ANTHROPIC_WORKSPACE_ID - required when the key is an identity-linked key,
#     which rejects every request without it. Console -> Settings -> Workspaces.
#
# Tuesday 05:23 UTC, once a week. Off-peak and a non-round minute, before the
# npm publish (06:37) and the website rebuild (07:12). Each post is dated 7 days
# after the last queued one, and the run is a no-op while the queue already runs
# more than 8 weeks ahead - see CADENCE_DAYS / QUEUE_CAP_DAYS in
# tools/generate-blog-post.mjs.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Generate and print the post, but do not commit'
        type: boolean
        default: false
  schedule:
    - cron: '23 5 * * 2'

permissions:
  contents: write

concurrency:
  group: daily-blog
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    # Bound the run so a hung Anthropic API call can't hold the `daily-blog`
    # concurrency lock and leave later scheduled runs stuck in "Waiting".
    # 30, not 15: a 16k-token long-form post plus one validation retry.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # The website (where posts live) is a PRIVATE submodule - clone its main
      # so the generator can write into website/src/content/blog and we can push
      # the new post back to the website repo. Needs the WEBSITE_TOKEN secret
      # (a PAT with write access to sv-grid/website).
      - name: Check out the private website
        env:
          WEBSITE_TOKEN: ${{ secrets.WEBSITE_TOKEN }}
        run: |
          rm -rf website
          git clone --branch main \
            "https://x-access-token:${WEBSITE_TOKEN}@github.com/sv-grid/website.git" website

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Generate post
        id: gen
        run: node tools/generate-blog-post.mjs --next ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          BLOG_MODEL: ${{ vars.BLOG_MODEL }}

      - name: Commit and push
        if: inputs.dry_run != true && steps.gen.outputs.slug != ''
        # Title comes from the model, so pass it through the environment and
        # quote it in the shell rather than interpolating it into the script.
        env:
          SLUG: ${{ steps.gen.outputs.slug }}
          TITLE: ${{ steps.gen.outputs.title }}
        # The post is written inside the website submodule, so commit + push it
        # to the WEBSITE repo (its clone origin already carries the token).
        working-directory: website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "src/content/blog/${SLUG}.md"
          git commit -m "blog: ${TITLE} [skip ci]"
          git push origin HEAD:main

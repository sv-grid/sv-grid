name: Test

on:
  pull_request:
  push:
    branches: [main]

# Cancel earlier runs on the same PR when a new commit lands.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    name: Lint, type-check, unit tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library (svelte-package)
        # Needed because the website + MCP packages depend on the published
        # entry points being generated.
        run: pnpm --filter sv-grid-core build

      - name: Type-check (svelte-check on every package)
        run: pnpm test:types

      - name: Unit + behavioral tests with coverage
        # `pnpm test` resolves to `pnpm --filter sv-grid-core test:lib`,
        # which runs `vitest run --coverage` against the configured
        # thresholds in packages/sv-grid-core/vite.config.ts
        # (lines 90 / statements 90 / functions 80 / branches 75).
        run: pnpm test

      - name: Build MCP server (smoke check)
        run: pnpm --filter sv-grid-mcp build

      - name: Build website (smoke check)
        run: pnpm --filter svgrid-website build
        env:
          SVGRID_SITE_BASE: /sv-grid/

      # Extract the coverage summary from the vitest text reporter output
      # so we can persist it as an artifact + comment on PRs. The HTML
      # report goes to packages/sv-grid-core/coverage/.
      - name: Extract coverage summary
        id: coverage
        if: always()
        run: |
          set -e
          REPORT=packages/sv-grid-core/coverage/coverage-summary.json
          if [ ! -f "$REPORT" ]; then
            # vitest's default text reporter doesn't emit JSON. Generate it
            # once more with json-summary added so we can parse cleanly.
            pnpm --filter sv-grid-core exec vitest run --coverage \
              --coverage.reporter=text \
              --coverage.reporter=json-summary
          fi
          # Print the totals to the job log for human review.
          if [ -f "$REPORT" ]; then
            node -e "
              const r = require('./packages/sv-grid-core/coverage/coverage-summary.json').total;
              const fmt = (m) => m.pct.toFixed(2) + '%';
              const out = \`### Test coverage
| Metric | Coverage |
| ------ | -------- |
| Lines | \${fmt(r.lines)} |
| Statements | \${fmt(r.statements)} |
| Functions | \${fmt(r.functions)} |
| Branches | \${fmt(r.branches)} |
\`;
              require('fs').writeFileSync(process.env.GITHUB_STEP_SUMMARY ?? '/dev/null', out);
              console.log(out);
              require('fs').writeFileSync('coverage-comment.md', out);
            "
          fi

      - name: Upload coverage report (HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: packages/sv-grid-core/coverage/
          if-no-files-found: warn
          retention-days: 14

      - name: Comment coverage on pull request
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('coverage-comment.md')) return;
            const body = fs.readFileSync('coverage-comment.md', 'utf8');
            const marker = '<!-- sv-grid-coverage-comment -->';
            const fullBody = `${marker}\n${body}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: fullBody,
              });
            }

name: Test

on:
  pull_request:
  push:
    branches: [main]

# Cancel earlier runs on the same PR when a new commit lands.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    name: Lint, type-check, unit tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # website is a PRIVATE submodule; init it so it's a valid pnpm workspace
      # member (else `pnpm install --frozen-lockfile` fails on the missing
      # importer). Only the submodule fetch uses WEBSITE_TOKEN (read access to
      # sv-grid/website); the main checkout stays on the default token. Fork PRs
      # lack the secret and will fail here - accepted, per the private submodule.
      - name: Check out the private website submodule
        env:
          WEBSITE_TOKEN: ${{ secrets.WEBSITE_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${WEBSITE_TOKEN}@github.com/".insteadOf https://github.com/
          git submodule update --init website

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library (svelte-package)
        # Needed because the website + MCP packages depend on the published
        # entry points being generated. Enterprise ships `dist/` too now, so
        # its type declarations have to exist before the type-check step -
        # @svgrid/studio and @svgrid/mcp import `@svgrid/enterprise/studio`.
        # `build:designer` is skipped here: it is slow and only ships the SPA.
        run: |
          pnpm --filter @svgrid/grid build
          pnpm --filter @svgrid/enterprise build:lib
          pnpm --filter @svgrid/enterprise build:node

      - name: Type-check (svelte-check on every package)
        run: pnpm test:types

      - name: Unit + behavioral tests with coverage
        # `pnpm test` resolves to `pnpm --filter @svgrid/grid test:lib`,
        # which runs `vitest run --coverage` against the configured
        # thresholds in packages/grid/vite.config.ts. Those are a ratchet set
        # just under the measured values, so read them there rather than
        # copying the numbers here (this comment claimed 90/90/80/75 long
        # after the real gate became 79/73/73/63).
        run: pnpm test

      - name: Enterprise unit + DOM tests
        # Not covered by `pnpm test`, which filters to @svgrid/grid. Runs after
        # the grid build above because these resolve @svgrid/grid through dist.
        run: pnpm --filter @svgrid/enterprise test

      - name: Web component tests
        # Its suite loads the BUILT bundle, so the build is part of the test.
        # `build` runs `generate-surface.mjs --check` first, so a prop added to
        # <SvGrid> without regenerating fails here rather than silently going
        # missing from <sv-grid> - which is how the element ended up exposing
        # 7 of 100 props.
        run: pnpm --filter @svgrid/grid-wc build && pnpm --filter @svgrid/grid-wc test

      - name: Framework wrapper build
        # The React, Vue and Angular wrappers are generated from the same
        # surface as the elements; `build` gates them with --check. Angular
        # goes through ng-packagr, so a broken decorator fails here rather
        # than in a consumer app.
        run: pnpm --filter @svgrid/grid-wc build:test-apps

      - name: Framework examples compile
        # The docs ship these as "open this and it runs", so a broken example
        # is worse than a missing one. Each framework is checked by its own
        # compiler, and the Vue templates get an extra pass: Vue treats an
        # unknown attribute as a legal fallthrough, so a misspelled prop
        # type-checks cleanly and silently does nothing.
        run: pnpm --filter @svgrid/grid-wc check:examples

      - name: Web component size budget
        # grid-wc had no budget, so nothing would have noticed the elements
        # getting heavy any more than it noticed them being thin.
        run: pnpm --filter @svgrid/grid-wc size:check

      - name: Docs guardrails
        # Orphaned for months: these live in tools/ and no package's vitest
        # config includes them, so nothing ran them and all three drifted red.
        # studio-docs + ui-docs read website/src/lib/docs.ts, which needs the
        # private submodule checked out above.
        run: pnpm vitest run tools/docs-snippets.test.ts tools/studio-docs.test.ts tools/ui-docs.test.ts tools/seo-guardrails.test.ts

      - name: Docs structure + reference guards
        # Same story as the step above: these live in tools/, no package's
        # vitest config includes them, and CI names its tools tests one file at
        # a time - so six of them ran nowhere. They cover the shape of the docs
        # rather than their prose: every gallery demo reachable from a page, the
        # examples-per-page floor, "See also" staying last (content had been
        # appended below that footer on 181 pages, invisible to every other
        # check), demo-source links resolving, no undocumented public export,
        # and the docs.json / llms.txt split holding.
        #
        # `build-doc-snippets` runs FIRST on purpose. The snippet manifest is
        # gitignored, and three assertions in demo-doc-coverage early-return
        # when it is missing - without generating it the step would pass while
        # testing nothing, which is worse than not running it at all.
        run: |
          node tools/build-doc-snippets.mjs
          pnpm vitest run tools/demo-doc-coverage.test.ts tools/docs-links.test.ts tools/reference-coverage.test.ts tools/reference-defaults.test.ts tools/llm-only-docs.test.ts tools/shadcn-registry.test.ts

      - name: Machine-readable changelog is current
        # docs/changelog.md tells readers (and, through llms-full.txt, models)
        # to fetch /changelog.json for the same content in a parseable shape.
        # Nothing generated it, so that URL 404'd. It is generated in the
        # website prebuild now; this fails when the committed copy has drifted
        # from the markdown, the same way the reference and UI-surface files
        # are gated.
        run: node tools/build-changelog-json.mjs --check

      - name: Documented commands exist
        # docs/help/benchmarks.md told readers to run `pnpm bench --json` and
        # `--baseline=`, and claimed regressions over 10% failed CI on main.
        # There was no bench script in any package.json and no such CI step -
        # the whole reproduction section was fiction, and it survived releases
        # because docs-snippets.test.ts only ever looked at TS fences. Pasting
        # the repro command is the first thing an evaluator does.
        run: pnpm vitest run tools/docs-commands.test.ts

      - name: Demo count + quoted claims
        # The registry and examples/src/demos/ must agree, and every "370+
        # demos" style number quoted in a README, the website, or the MCP
        # package must still be true. Both drifted before: the count sat at
        # "280+" while the real number was past 360, and "150+"/"140" survived
        # in three files for months. Reads website/src/lib/*, so it needs the
        # private submodule checked out above.
        run: node tools/count-demos.mjs

      - name: Scaffold templates
        # The theme a user picks at scaffold time is recorded in three places
        # (app.css, the data-theme on the HTML shell, and the runtime picker's
        # starting value). A mismatch between any two shows up as a colour flash
        # or a picker that disagrees with the screen, and nothing else catches it.
        run: pnpm vitest run tools/scaffold-templates.test.ts

      - name: SSR renders rows
        # <SvGrid> silently stopped server-rendering its rows once: both
        # virtualizers learn their count from an $effect, and effects do not run
        # during SSR. Nothing tested it, so the docs claimed working SSR for a
        # long time while the server shipped an empty shell.
        run: pnpm ssr:check

      - name: Headless entry runs under plain Node
        # @svgrid/grid/core exists to run the pipeline where there is no DOM, and
        # every such consumer is a bare Node process. The source is written for
        # `moduleResolution: bundler`, so dist/ carried extensionless relative
        # specifiers that Vite, SvelteKit and vitest all resolved and Node did
        # not - `import('@svgrid/grid/core')` died with ERR_MODULE_NOT_FOUND while
        # the whole suite stayed green, because nothing ran the built files
        # outside a bundler.
        run: pnpm node:check

      - name: Bundle size budget
        # Guards the lazy boundaries. A static import of something meant to load
        # via import() silently inflates the base bundle and can also defeat an
        # existing import() of the same module - that has happened before and
        # nothing caught it. Budgets live in packages/grid/scripts/measure-size.mjs.
        run: pnpm size:check

      - name: Engine work-counter budget
        # Guards the row pipeline's algorithmic cost. Wall-clock is far too
        # noisy on a shared runner to gate - a flaky perf gate gets disabled
        # within a month and then protects nothing - so this counts work
        # instead, which is identical on every machine.
        #
        # All three budgets here are things that regressed unnoticed and were
        # only found by building the harness: the sort comparator resolved its
        # column with an Array.find PER COMPARISON (1,528,947 scans for a
        # single-clause 100k sort), the filter materialised every row's full
        # Cell[] to read one field (100,000 of them), and `rowSelection` sat in
        # the row-model cache key so ticking one checkbox re-filtered and
        # re-sorted the whole dataset. Budgets live in tools/bench/cases.mjs.
        #
        # Needs the built engine: the bench imports dist/, like node:check.
        run: pnpm bench:check

      - name: Build MCP server (smoke check)
        run: pnpm --filter @svgrid/mcp build

      # Runs here rather than with the other guardrails because it drives the
      # built server over stdio, so it needs the dist from the step above.
      - name: MCP tool guardrails
        run: pnpm vitest run tools/mcp-tools.test.ts

      # The remote server is a Cloudflare Worker in workers/, which is outside
      # the pnpm workspace, so nothing installs or builds it by default. Its
      # corpus is generated from the MCP dist built two steps up.
      - name: Build remote MCP worker corpus
        run: node workers/svgrid-mcp/scripts/build-data.mjs

      - name: Remote MCP worker guardrails
        run: pnpm vitest run tools/mcp-worker.test.ts

      # plugins/svgrid/ mirrors skills/svgrid/ because a plugin install copies
      # the plugin directory, and pointing it at the repo root drags
      # node_modules in (and dies on pnpm's symlinks). The mirror is generated,
      # so it can silently go stale after a skill edit; this catches that.
      - name: Claude Code plugin is in sync with the skill
        run: pnpm plugin:check

      # NOTE: the website is now a PRIVATE submodule, absent on public/fork
      # checkouts, so its build smoke-check moved to the website repo's own CI
      # (and to deploy-website.yml, which has the WEBSITE_TOKEN).

      # Extract the coverage summary from the vitest text reporter output
      # so we can persist it as an artifact + comment on PRs. The HTML
      # report goes to packages/grid/coverage/.
      - name: Extract coverage summary
        id: coverage
        if: always()
        run: |
          set -e
          REPORT=packages/grid/coverage/coverage-summary.json
          if [ ! -f "$REPORT" ]; then
            # vitest's default text reporter doesn't emit JSON. Generate it
            # once more with json-summary added so we can parse cleanly.
            pnpm --filter @svgrid/grid exec vitest run --coverage \
              --coverage.reporter=text \
              --coverage.reporter=json-summary
          fi
          # Print the totals to the job log for human review.
          if [ -f "$REPORT" ]; then
            # Build the table line by line. A template literal would need its
            # rows at column 0, which closes this block scalar and makes the
            # whole workflow file unparseable.
            node -e "
              const r = require('./packages/grid/coverage/coverage-summary.json').total;
              const fmt = (m) => m.pct.toFixed(2) + '%';
              const out = [
                '### Test coverage',
                '',
                '| Metric | Coverage |',
                '| ------ | -------- |',
                '| Lines | ' + fmt(r.lines) + ' |',
                '| Statements | ' + fmt(r.statements) + ' |',
                '| Functions | ' + fmt(r.functions) + ' |',
                '| Branches | ' + fmt(r.branches) + ' |',
                '',
              ].join('\n');
              require('fs').writeFileSync(process.env.GITHUB_STEP_SUMMARY ?? '/dev/null', out);
              console.log(out);
              require('fs').writeFileSync('coverage-comment.md', out);
            "
          fi

      - name: Upload coverage report (HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: packages/grid/coverage/
          if-no-files-found: warn
          retention-days: 14

      - name: Comment coverage on pull request
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('coverage-comment.md')) return;
            const body = fs.readFileSync('coverage-comment.md', 'utf8');
            const marker = '<!-- sv-grid-coverage-comment -->';
            const fullBody = `${marker}\n${body}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: fullBody,
              });
            }

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    # Independent of the unit job so the two run in parallel: this one is
    # dominated by browser wall-clock, not by anything the unit job produces.
    steps:
      - uses: actions/checkout@v5

      # Same private-submodule dance as the unit job. This is the reason the
      # suite sat outside CI: playwright.config.ts still says "website/ is a
      # private submodule, so this suite only runs on a checkout that has it.
      # It is not part of CI for that reason." That stopped being true once the
      # unit job started checking the submodule out with WEBSITE_TOKEN, and the
      # 122 specs went on not running for nobody's benefit.
      - name: Check out the private website submodule
        env:
          WEBSITE_TOKEN: ${{ secrets.WEBSITE_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${WEBSITE_TOKEN}@github.com/".insteadOf https://github.com/
          git submodule update --init website

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library (svelte-package)
        # The website dev server resolves @svgrid/grid and @svgrid/enterprise
        # through their published `exports`, i.e. dist/ - so the servers
        # playwright.config.ts starts will not boot without these.
        run: |
          pnpm --filter @svgrid/grid build
          pnpm --filter @svgrid/enterprise build:lib
          pnpm --filter @svgrid/enterprise build:node

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser specs
        # `chromium` is the behavioural suite against the website's demo routes;
        # `mobile` is the phone-viewport overflow guard against the gallery.
        # The `perf` project is deliberately excluded - its own comment explains
        # why browser wall-clock on a shared runner is not a gate.
        run: pnpm exec playwright test --project=chromium --project=mobile

      - name: Upload the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

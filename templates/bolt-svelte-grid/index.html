<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orders - SvGrid starter</title>
    <script>
      // Settle the theme before the first paint so the page does not flash
      // light and then switch. With nothing saved, follow the OS.
      try {
        var saved = localStorage.getItem('theme')
        var fallback = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = saved || fallback
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

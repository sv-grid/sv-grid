<!doctype html>
<!--
  "The Live Demo" - a 28-second promo, 1080 x 1920 (TikTok / Shorts / Reels).

  Story: a live demo in front of 200 people. The CEO asks to see all 100,000
  orders. The hand-rolled <table> tries to render every row and the tab
  freezes on the projector. The developer swaps the table for <SvGrid> on
  stage, and the projector shows SvGrid scrolling and sorting 100,000 rows.

  Everything moves from window.__seek(t): every animation here is a pure
  function of t (no CSS animations), so render.mjs can step frame by frame and
  the result is identical on every run. The payoff footage is real: render.mjs
  records demo 06-large-dataset at 100k rows frame by frame and hands each
  frame in with window.__setPayoff, together with the DOM row count it
  measured on that frame.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=block" />
<style>
  :root { --bg: #0b0908; --fg: #fafaf9; --orange: #ff5a1f; --red: #ef4444; --green: #22c55e; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, system-ui, sans-serif; font-variant-ligatures: none; }
  .abs { position: absolute; }
  #frame { position: absolute; inset: 0; overflow: hidden; }

  /* ---------- the stage world (wide shots) ---------- */
  #world { position: absolute; inset: 0; transform-origin: 540px 670px; }
  .wall { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 38%, #2a2320 0%, #120e0c 62%); }
  .curtain { position: absolute; top: 0; width: 96px; height: 1320px; background: repeating-linear-gradient(90deg, #5b0f12 0 18px, #7f1d1d 18px 34px, #4c0d10 34px 46px); box-shadow: inset -20px 0 40px rgba(0,0,0,.5); }
  .valance { position: absolute; left: 0; right: 0; top: 0; height: 70px; background: repeating-linear-gradient(90deg, #6b1013 0 40px, #891e22 40px 80px); border-radius: 0 0 40px 40px / 0 0 20px 20px; box-shadow: 0 10px 30px rgba(0,0,0,.6); }
  #screen { position: absolute; left: 130px; top: 440px; width: 820px; height: 461px; background: #f5f5f4; border-radius: 6px; overflow: hidden; box-shadow: 0 0 0 10px #1c1917, 0 0 120px 30px rgba(255,255,255,.08); }
  .screenglow { position: absolute; left: 40px; top: 400px; width: 1000px; height: 620px; background: radial-gradient(ellipse, rgba(255,255,255,.10), transparent 70%); pointer-events: none; }
  .floor { position: absolute; left: -100px; right: -100px; top: 1000px; height: 360px; background: repeating-linear-gradient(90deg, #5a3a22 0 70px, #4d3220 70px 74px); clip-path: polygon(8% 0, 92% 0, 100% 100%, 0 100%); }
  .floor::after { content: ''; position: absolute; inset: 0; background: linear-gradient(#000a, #0000 30%, #0008); }
  .podium { position: absolute; left: 780px; top: 1110px; width: 210px; height: 250px; background: linear-gradient(90deg, #292524, #3f3a36 50%, #292524); border-radius: 10px 10px 4px 4px; box-shadow: 0 20px 40px #0009; }
  .podium::before { content: ''; position: absolute; left: -14px; right: -14px; top: -14px; height: 22px; background: #44403c; border-radius: 6px; }
  .spot { position: absolute; left: 640px; top: -60px; width: 420px; height: 1380px; background: linear-gradient(rgba(255,244,214,.32), rgba(255,244,214,.05)); clip-path: polygon(42% 0, 58% 0, 100% 100%, 0 100%); filter: blur(6px); mix-blend-mode: screen; }
  .spotpool { position: absolute; left: 700px; top: 1290px; width: 360px; height: 90px; border-radius: 50%; background: radial-gradient(rgba(255,244,214,.35), transparent 70%); }
  #audience { position: absolute; left: -60px; right: -60px; top: 1380px; height: 600px; }
  .live { position: absolute; right: 60px; top: 300px; display: flex; align-items: center; gap: 12px; font: 800 34px Inter; letter-spacing: .08em; padding: 10px 18px; border-radius: 10px; background: #0009; }
  .live i { width: 18px; height: 18px; border-radius: 50%; background: var(--red); display: block; }

  /* ---------- projector contents ---------- */
  .layer { position: absolute; inset: 0; }
  .slide { background: linear-gradient(135deg, #0c0a09, #1c1917); color: #fafaf9; display: flex; flex-direction: column; justify-content: center; padding: 60px 70px; }
  .slide b { font-size: 64px; font-weight: 900; letter-spacing: -.03em; }
  .slide span { font-size: 30px; color: #a8a29e; margin-top: 10px; font-weight: 600; }
  .slide .bar { margin-top: 40px; height: 10px; width: 220px; background: var(--orange); border-radius: 5px; }
  .naive { background: #fff; color: #1c1917; font: 500 20px Inter; }
  .naive .top { height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; background: #f5f5f4; border-bottom: 1px solid #d6d3d1; font-weight: 700; }
  .naive table { width: 100%; border-collapse: collapse; }
  .naive th { text-align: left; padding: 9px 22px; background: #fafaf9; border-bottom: 2px solid #d6d3d1; font-weight: 700; color: #57534e; }
  .naive td { padding: 7px 22px; border-bottom: 1px solid #e7e5e4; }
  .naive .prog { position: absolute; left: 0; right: 0; bottom: 0; height: 56px; display: flex; align-items: center; gap: 14px; padding: 0 22px; background: #fafaf9; border-top: 1px solid #d6d3d1; font: 600 20px 'JetBrains Mono'; color: #57534e; }
  .spinner { width: 26px; height: 26px; border-radius: 50%; border: 4px solid #d6d3d1; border-top-color: #3b82f6; }
  #freezeVeil { position: absolute; inset: 0; background: rgba(120,113,108,.35); }
  .dialog { position: absolute; left: 150px; top: 100px; width: 520px; background: #fff; border-radius: 14px; box-shadow: 0 20px 60px #0006; padding: 30px 32px 24px; color: #1c1917; }
  .dialog b { font-size: 30px; font-weight: 800; display: block; }
  .dialog p { margin-top: 12px; font-size: 21px; color: #57534e; line-height: 1.35; }
  .dialog .btns { margin-top: 26px; display: flex; justify-content: flex-end; gap: 12px; }
  .dialog .btns span { font-weight: 700; font-size: 20px; padding: 10px 20px; border-radius: 999px; border: 1px solid #d6d3d1; }
  .dialog .btns span.primary { background: #1d4ed8; border-color: #1d4ed8; color: #fff; }
  .cursor { position: absolute; width: 34px; }
  .code { background: #0c0a09; font: 600 25px/1.6 'JetBrains Mono'; padding: 34px 40px; color: #e7e5e4; white-space: pre; }
  .code .file { color: #78716c; font-size: 20px; }
  .code .del { color: #fca5a5; background: rgba(239,68,68,.14); display: block; text-decoration: line-through; text-decoration-color: rgba(239,68,68,.7); }
  .code .add { color: #86efac; background: rgba(34,197,94,.16); display: block; }
  .code .cmd { color: #fafaf9; }
  .code .ok { color: var(--green); }
  #payoff { background: #0c0a09; }
  #payoff img { width: 100%; height: 100%; object-fit: cover; object-position: left top; display: block; }
  .dombadge { position: absolute; right: 18px; bottom: 18px; font: 700 24px 'JetBrains Mono'; color: #fff; background: rgba(12,10,9,.88); border: 2px solid var(--orange); border-radius: 12px; padding: 10px 16px; }
  .dombadge b { color: var(--orange); }

  /* ---------- close-up shots ---------- */
  .shot { position: absolute; inset: 0; overflow: hidden; }
  .bokeh { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 30%, #2b2420, #0b0908 70%); }
  .bokeh i { position: absolute; border-radius: 50%; background: radial-gradient(rgba(255,214,170,.28), transparent 70%); }
  .bubble { position: absolute; background: #fff; color: #0c0a09; font-weight: 900; border-radius: 30px; padding: 26px 34px; box-shadow: 0 12px 0 #0005; transform-origin: 20% 100%; }
  .bubble::after { content: ''; position: absolute; bottom: -30px; left: 80px; border: 18px solid transparent; border-top: 30px solid #fff; border-bottom: 0; }

  /* ---------- captions ---------- */
  .cap { position: absolute; left: 72px; right: 72px; top: 118px; font-weight: 900; font-size: 86px; line-height: 1.0; letter-spacing: -.035em; text-shadow: 0 4px 30px #000; }
  .cap small { display: block; font-size: 54px; font-weight: 800; color: #e7e5e4; margin-top: 16px; letter-spacing: -.02em; }
  .cap em { font-style: normal; color: var(--orange); }
  .cap .r { color: var(--red); }
  .cap .g { color: var(--green); }

  /* ---------- end card ---------- */
  #end { background: var(--bg); }
  #end .card { position: absolute; left: 72px; right: 72px; top: 560px; }
  #end .logo { display: flex; align-items: center; gap: 26px; font-size: 118px; font-weight: 900; letter-spacing: -.04em; }
  #end .logo i { font-style: normal; color: var(--orange); }
  #end h2 { font-size: 88px; line-height: 1.02; font-weight: 900; letter-spacing: -.035em; margin-top: 80px; }
  #end h2 em { font-style: normal; color: var(--orange); }
  #end .cmd { display: inline-block; margin-top: 64px; font: 600 46px 'JetBrains Mono'; background: #1c1917; border: 2px solid #292524; border-radius: 18px; padding: 22px 32px; }
  #end .url { margin-top: 46px; font-size: 54px; font-weight: 800; color: #a8a29e; }
  #vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 75% 60% at 50% 48%, transparent 55%, rgba(0,0,0,.55) 100%); }
  #black { position: absolute; inset: 0; background: #000; pointer-events: none; }
  #flash { position: absolute; inset: 0; background: #fff; pointer-events: none; }
</style>
</head>
<body>
<div id="frame">

  <!-- The stage: wide shots S1, S3, S5, S6 -->
  <div id="world">
    <div class="wall"></div>
    <div class="screenglow"></div>
    <div id="screen">
      <div class="layer slide" id="lSlide"><b>Q4 Orders</b><span>Live, with real data</span><div class="bar"></div></div>
      <div class="layer naive" id="lNaive">
        <div class="top"><span>orders.html</span><span id="naiveCount" style="font-family:'JetBrains Mono';color:#78716c"></span></div>
        <table><thead><tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th></tr></thead><tbody id="naiveBody"></tbody></table>
        <div class="prog"><div class="spinner" id="spin"></div><span id="naiveProg"></span></div>
        <div id="freezeVeil"></div>
        <div class="dialog" id="dialog"><b>Page Unresponsive</b><p>This page has stopped responding. You can wait for it, or exit the page.</p><div class="btns"><span>Exit page</span><span class="primary">Wait</span></div></div>
        <svg class="cursor" id="cursor" viewBox="0 0 24 34"><path d="M2 2 L2 28 L9 21 L14 32 L18 30 L13 19 L22 19 Z" fill="#fff" stroke="#000" stroke-width="2" stroke-linejoin="round"/></svg>
      </div>
      <div class="layer code" id="lCode"></div>
      <div class="layer" id="payoff"><img id="payoffImg" alt="" /><div class="dombadge" id="domBadge"></div></div>
    </div>
    <div class="curtain" style="left:0"></div>
    <div class="curtain" style="right:0;transform:scaleX(-1)"></div>
    <div class="valance"></div>
    <div class="floor"></div>
    <div class="spot" id="spot"></div>
    <div class="spotpool" id="spotpool"></div>
    <svg class="abs" id="devSmall" style="left:770px;top:880px;width:230px" viewBox="0 0 400 520"></svg>
    <div class="podium"></div>
    <svg id="audience" viewBox="0 0 1200 600" preserveAspectRatio="none"></svg>
  </div>
  <div class="live" id="live"><i id="liveDot"></i>LIVE</div>

  <!-- S2 / S7: the CEO -->
  <div class="shot" id="shotCeo">
    <div class="bokeh" id="bokehCeo"></div>
    <svg class="abs" id="ceo" style="left:90px;top:520px;width:900px" viewBox="0 0 600 640"></svg>
    <div class="bubble" id="ceoBubble1" style="left:70px;top:430px;font-size:58px">Show them all<br>100,000 orders.</div>
    <div class="bubble" id="ceoBubble2" style="left:120px;top:460px;font-size:72px">Ship it.</div>
  </div>

  <!-- S4: the developer -->
  <div class="shot" id="shotDev">
    <div class="bokeh" id="bokehDev"></div>
    <svg class="abs" id="dev" style="left:90px;top:470px;width:900px" viewBox="0 0 400 520"></svg>
  </div>

  <div id="end" class="shot">
    <div class="card">
      <div class="logo" id="logo"></div>
      <h2>100,000 rows.<br><em>One Svelte component.</em></h2>
      <div class="cmd">npm install @svgrid/grid</div>
      <div class="url">svgrid.com</div>
    </div>
  </div>

  <div id="vignette"></div>
  <div id="caps"></div>
  <div id="flash"></div>
  <div id="black"></div>
</div>

<script>
/* =============================================================== timing */
// The shots and the beats inside them. render.mjs replaces this with a
// timeline built from the voice takes (window.__setTimeline), so every cut
// lands on the performance; these defaults are the silent cut.
let T = {
  s1: [0, 2.4],      // wide: spotlight on, live demo
  s2: [2.4, 4.6],    // CEO: "show them all 100,000"
  s3: [4.6, 9.6],    // wide -> screen: the table renders, the tab freezes
  s4: [9.6, 11.2],   // developer: sweat, then decides
  s5: [11.2, 13.4],  // screen: swap the table for SvGrid
  s6: [13.4, 20.4],  // screen -> wide: 100k rows scroll and sort
  s7: [20.4, 23.6],  // CEO: applause, "Ship it."
  s8: [23.6, 28.0],  // end card, fades to black for the loop
  freeze: 7.7,       // the tab stops responding
  split: 16.85,      // second payoff caption ("The DOM holds ...")
  ceoAsk: 3.0,       // the CEO's bubble
  decide: 10.55,     // the developer's eyes lock
  clap: 20.9,        // the CEO starts clapping
  shipIt: 21.3,      // "Ship it."
  end: 28,
}
window.__setTimeline = (x) => { T = x; buildCaps() }

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const lerp = (a, b, k) => a + (b - a) * k
const easeInOut = (k) => (k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2)
const easeOut = (k) => 1 - Math.pow(1 - k, 3)
const inT = (t, [a, b]) => t >= a && t < b
const $ = (id) => document.getElementById(id)

/* ============================================================ the cast */
// The developer: curly hair, round glasses, teal hoodie, headset mic.
function devSvg() {
  const skin = '#8d5a3b', skinD = '#74472d', hair = '#1b1210', hood = '#0f766e', hoodD = '#0b5a54'
  const curls = []
  for (const [x, y, r] of [[120,150,46],[160,118,50],[210,104,54],[262,116,50],[300,150,46],[316,196,36],[104,196,36],[146,96,34],[236,84,36],[280,100,30]])
    curls.push(`<circle cx="${x}" cy="${y}" r="${r}" fill="${hair}"/>`)
  return `
  <defs>
    <clipPath id="devEyeL"><ellipse cx="170" cy="230" rx="24" ry="26"/></clipPath>
    <clipPath id="devEyeR"><ellipse cx="250" cy="230" rx="24" ry="26"/></clipPath>
  </defs>
  <path d="M70 520 q10 -150 140 -160 q130 10 140 160 z" fill="${hood}"/>
  <path d="M200 360 q-60 10 -80 60 M210 360 q60 10 80 60" stroke="${hoodD}" stroke-width="10" fill="none"/>
  <path d="M180 372 l-6 80 M240 372 l6 80" stroke="#e7e5e4" stroke-width="7" stroke-linecap="round"/>
  <rect x="178" y="300" width="64" height="70" rx="22" fill="${skinD}"/>
  <ellipse cx="110" cy="240" rx="20" ry="30" fill="${skin}"/><ellipse cx="310" cy="240" rx="20" ry="30" fill="${skin}"/>
  <ellipse cx="210" cy="230" rx="100" ry="112" fill="${skin}"/>
  <path d="M120 270 q90 80 180 0 q-10 60 -90 70 q-80 -10 -90 -70z" fill="${skinD}" opacity=".35"/>
  ${curls.join('')}
  <!-- headset -->
  <path d="M100 210 q110 -190 220 0" fill="none" stroke="#27272a" stroke-width="12"/>
  <rect x="86" y="206" width="30" height="58" rx="12" fill="#27272a"/><rect x="304" y="206" width="30" height="58" rx="12" fill="#27272a"/>
  <path d="M104 262 q8 70 86 58" fill="none" stroke="#27272a" stroke-width="7"/><circle cx="192" cy="320" r="9" fill="#27272a"/>
  <!-- eyes -->
  <g id="devEyes">
    <ellipse cx="170" cy="230" rx="24" ry="26" fill="#fff"/><ellipse cx="250" cy="230" rx="24" ry="26" fill="#fff"/>
    <g id="devPupils"><circle cx="172" cy="232" r="12" fill="#3b2314"/><circle cx="252" cy="232" r="12" fill="#3b2314"/>
      <circle cx="176" cy="227" r="4" fill="#fff"/><circle cx="256" cy="227" r="4" fill="#fff"/></g>
    <g clip-path="url(#devEyeL)"><rect id="devLidL" x="140" y="200" width="60" height="60" fill="${skin}"/></g>
    <g clip-path="url(#devEyeR)"><rect id="devLidR" x="220" y="200" width="60" height="60" fill="${skin}"/></g>
  </g>
  <!-- glasses -->
  <rect x="136" y="198" width="70" height="64" rx="22" fill="none" stroke="#111" stroke-width="7"/>
  <rect x="214" y="198" width="70" height="64" rx="22" fill="none" stroke="#111" stroke-width="7"/>
  <path d="M206 224 h8" stroke="#111" stroke-width="7"/>
  <path id="devGlint" d="M150 214 l14 -10" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".7"/>
  <!-- brows: worried / determined -->
  <g id="devBrowWorried"><path d="M140 186 L194 172" stroke="${hair}" stroke-width="10" stroke-linecap="round"/><path d="M280 186 L226 172" stroke="${hair}" stroke-width="10" stroke-linecap="round"/></g>
  <g id="devBrowDet"><path d="M140 172 L196 190" stroke="${hair}" stroke-width="11" stroke-linecap="round"/><path d="M280 172 L224 190" stroke="${hair}" stroke-width="11" stroke-linecap="round"/></g>
  <!-- mouths -->
  <path id="devMouthWorried" d="M180 300 q10 -12 20 0 q10 12 20 0 q10 -12 20 0" fill="none" stroke="#3b1408" stroke-width="7" stroke-linecap="round"/>
  <path id="devMouthDet" d="M184 298 q26 -6 52 0" fill="none" stroke="#3b1408" stroke-width="8" stroke-linecap="round"/>
  <g id="devMouthHappy"><path d="M174 288 q36 44 72 0 z" fill="#3b1408"/><path d="M184 292 q26 12 52 0" fill="#fff"/></g>
  <!-- sweat -->
  <path id="sweat1" d="M300 150 q16 26 0 38 q-16 -12 0 -38z" fill="#7dd3fc"/>
  <path id="sweat2" d="M118 170 q14 22 0 33 q-14 -11 0 -33z" fill="#7dd3fc"/>`
}

// The CEO: silver bob, navy blazer, pearl earrings, arms crossed or clapping.
function ceoSvg() {
  const skin = '#f1c6a8', skinD = '#e0a888', hair = '#d6d3d1', hairD = '#a8a29e'
  return `
  <defs>
    <clipPath id="ceoEyeL"><ellipse cx="258" cy="250" rx="22" ry="22"/></clipPath>
    <clipPath id="ceoEyeR"><ellipse cx="342" cy="250" rx="22" ry="22"/></clipPath>
  </defs>
  <path d="M60 640 q20 -190 240 -200 q220 10 240 200 z" fill="#1e293b"/>
  <path d="M250 450 l50 120 l50 -120 z" fill="#f8fafc"/>
  <path d="M230 450 l70 150 l-110 -10 z M370 450 l-70 150 l110 -10 z" fill="#0f172a"/>

  <path d="M192 160 q108 -90 216 0 q-20 -10 -40 30 q-60 -50 -150 -10 q-10 -30 -26 -20z" fill="${hair}"/>
  <path d="M220 130 q80 -40 160 0" fill="none" stroke="${hairD}" stroke-width="5"/>
  <circle cx="190" cy="300" r="11" fill="#fafaf9"/><circle cx="410" cy="300" r="11" fill="#fafaf9"/>
  <g><ellipse cx="258" cy="250" rx="22" ry="22" fill="#fff"/><ellipse cx="342" cy="250" rx="22" ry="22" fill="#fff"/>
    <g id="ceoPupils"><circle cx="260" cy="252" r="11" fill="#1e3a8a"/><circle cx="344" cy="252" r="11" fill="#1e3a8a"/>
      <circle cx="263" cy="248" r="4" fill="#fff"/><circle cx="347" cy="248" r="4" fill="#fff"/></g>
    <g clip-path="url(#ceoEyeL)"><rect id="ceoLidL" x="230" y="220" width="60" height="60" fill="${skin}"/></g>
    <g clip-path="url(#ceoEyeR)"><rect id="ceoLidR" x="314" y="220" width="60" height="60" fill="${skin}"/></g>
  </g>
  <g id="ceoBrowSkeptic"><path d="M226 218 L284 222" stroke="#57534e" stroke-width="9" stroke-linecap="round"/><path d="M318 212 q30 -26 58 -6" fill="none" stroke="#57534e" stroke-width="9" stroke-linecap="round"/></g>
  <g id="ceoBrowHappy"><path d="M228 214 q28 -16 56 -2" fill="none" stroke="#57534e" stroke-width="9" stroke-linecap="round"/><path d="M316 212 q28 -14 56 2" fill="none" stroke="#57534e" stroke-width="9" stroke-linecap="round"/></g>
  <path d="M296 260 q-10 40 6 46" fill="none" stroke="${skinD}" stroke-width="6" stroke-linecap="round"/>
  <path id="ceoMouthFlat" d="M268 330 q32 -8 64 4" fill="none" stroke="#9f1239" stroke-width="9" stroke-linecap="round"/>
  <g id="ceoMouthSmile"><path d="M262 318 q38 46 76 0 z" fill="#7f1d1d"/><path d="M272 322 q28 12 56 0" fill="#fff"/></g>
  <!-- arms crossed -->
  <g id="ceoArmsCrossed">
    <path d="M90 560 q120 -40 330 -10 q30 10 20 40 q-200 -20 -330 20 q-30 -20 -20 -50z" fill="#1e293b"/>
    <path d="M510 560 q-120 -40 -330 -10 q-30 10 -20 40 q200 -20 330 20 q30 -20 20 -50z" fill="#243245"/>
    <ellipse cx="160" cy="566" rx="30" ry="24" fill="${skin}"/><ellipse cx="440" cy="566" rx="30" ry="24" fill="${skin}"/>
  </g>
  <!-- clapping hands -->
  <g id="ceoClap">
    <path d="M130 640 q50 -60 140 -96" fill="none" stroke="#1e293b" stroke-width="58" stroke-linecap="round"/>
    <path d="M470 640 q-50 -60 -140 -96" fill="none" stroke="#243245" stroke-width="58" stroke-linecap="round"/>
    <g id="handL"><ellipse cx="272" cy="536" rx="34" ry="46" fill="${skin}" transform="rotate(20 272 536)"/></g>
    <g id="handR"><ellipse cx="328" cy="536" rx="34" ry="46" fill="${skinD}" transform="rotate(-20 328 536)"/></g>
  </g>`
}

function audienceSvg() {
  // Three rows of heads and shoulders, backs to us, rim-lit by the screen.
  let s = ''
  const rows = [[60, 46, 0.55, 150], [190, 58, 0.75, 120], [350, 74, 1, 100]]
  rows.forEach(([y, r, light, step], ri) => {
    for (let x = -40 + ri * 40, i = 0; x < 1260; x += step, i++) {
      const jitter = ((i * 37 + ri * 11) % 23) - 11
      s += `<g class="head" data-i="${ri * 100 + i}">
        <path d="M${x - r * 1.9} ${y + r * 3.2} q${r * 1.9} ${-r * 2.2} ${r * 3.8} 0z" fill="#171310"/>
        <circle cx="${x}" cy="${y + jitter * 0.4}" r="${r}" fill="#1f1a17"/>
        <path d="M${x - r * 0.8} ${y - r * 0.6 + jitter * 0.4} q${r * 0.8} ${-r * 0.55} ${r * 1.6} 0" fill="none" stroke="rgba(255,236,210,${0.42 * light})" stroke-width="5"/>
      </g>`
    }
  })
  return s
}

function logo(size) {
  const cols = [{ x: 4, w: 6 }, { x: 11, w: 4 }, { x: 16, w: 4 }]
  let r = ''
  for (const c of cols) r += `<rect x="${c.x}" y="4" width="${c.w}" height="4" rx="1.2" fill="#fafaf9" opacity="0.9"/>`
  r += `<path d="M16.9 5.4 L19.1 5.4 L18 6.9 Z" fill="#ff5a1f"/>`
  for (const y of [9, 13, 17]) cols.forEach((c, i) => (r += `<rect x="${c.x}" y="${y}" width="${c.w}" height="3" rx="0.9" fill="${i === 2 ? '#ff5a1f' : '#fafaf9'}" opacity="${i === 2 ? 1 : 0.32}"/>`))
  return `<svg viewBox="0 0 24 24" width="${size}" height="${size}">${r}</svg><span><i>Sv</i>Grid</span>`
}

$('dev').innerHTML = devSvg()
$('devSmall').innerHTML = devSvg().replace(/id="/g, 'id="s_').replace(/url\(#/g, 'url(#s_')
$('ceo').innerHTML = ceoSvg()
$('audience').innerHTML = audienceSvg()
$('logo').innerHTML = logo(126)
for (const id of ['bokehCeo', 'bokehDev']) {
  $(id).innerHTML = Array.from({ length: 14 }, (_, i) => {
    const r = 40 + ((i * 53) % 90)
    return `<i style="left:${(i * 173) % 1080 - r}px;top:${(i * 311) % 1500 + 200}px;width:${r * 2}px;height:${r * 2}px"></i>`
  }).join('')
}

/* ========================================================= captions */
let CAPS = []
function buildCaps() {
  CAPS = [
    [T.s1[0] + 0.25, T.s1[1], 'Live demo.<small>200 people watching.</small>'],
    [T.s2[0] + 0.1, T.s2[1], 'The CEO asks for<small>all <em>100,000</em> orders. Live.</small>'],
    [T.s3[0] + 0.1, T.freeze, 'Your table renders<small>every. single. row.</small>'],
    [T.freeze + 0.05, T.s3[1], '<span class="r">The tab freezes.</span><small>On the big screen.</small>'],
    [T.s4[0] + 0.05, T.s4[1], 'Ten seconds<small>to save it.</small>'],
    [T.s5[0] + 0.1, T.s5[1], 'Swap the table<small>for <em>one component.</em></small>'],
    [T.s6[0] + 0.1, T.split, '100,000 rows.<small>Scroll. Sort. <span class="g">No freeze.</span></small>'],
    [T.split, T.s6[1], '', 'dom'],
    [T.s7[0] + 0.1, T.s7[1], '<span class="g">Demo saved.</span>'],
  ]
  $('caps').innerHTML = CAPS.map((c, i) => `<div class="cap" id="cap${i}">${c[2]}</div>`).join('')
}
buildCaps()

/* ================================================ the naive table */
const CUSTOMERS = ['Halcyon Retail', 'Vector Freight', 'Redwood Clinic', 'Pinehill Academy', 'Blue Harbour', 'Cedar & Co', 'Meridian Labs', 'Fairlight Studio', 'Alpine Outfitters', 'Northgate Supply']
const STATUS = ['Paid', 'Shipped', 'Pending', 'Refunded']
function naiveRows(n) {
  let s = ''
  for (let i = 0; i < Math.min(n, 11); i++) {
    const id = 100001 + i
    s += `<tr><td>#${id}</td><td>${CUSTOMERS[(i * 7) % 10]}</td><td>$${(((i * 7919) % 90000) / 100 + 40).toFixed(2)}</td><td>${STATUS[(i * 3) % 4]}</td></tr>`
  }
  return s
}

// Spread over the swap shot, whatever its length.
const codeSteps = () => [
  { at: T.s5[0] + 0.15, html: '<span class="file">orders.svelte</span>\n' },
  { at: T.s5[0] + 0.3, html: '<span class="del">- {#each orders as order}</span><span class="del">-   &lt;tr&gt;{#each columns as c}</span><span class="del">-     &lt;td&gt;{order[c.field]}&lt;/td&gt;</span><span class="del">-   {/each}&lt;/tr&gt;</span><span class="del">- {/each}</span>' },
  { at: lerp(T.s5[0], T.s5[1], 0.42), html: '<span class="add">+ &lt;SvGrid data={orders} {columns} /&gt;</span>' },
  { at: lerp(T.s5[0], T.s5[1], 0.62), html: '\n<span class="cmd">$ npm install @svgrid/grid</span>\n' },
  { at: lerp(T.s5[0], T.s5[1], 0.8), html: '<span class="ok">ready</span>' },
]

/* ============================================ payoff frames (real) */
let PAYOFF = { frames: [], dom: [], fps: 30 }
window.__setPayoff = (p) => { PAYOFF = p }
let lastPayoff = -1
function setPayoffFrame(t) {
  if (!PAYOFF.frames.length) return
  const i = clamp(Math.floor((t - T.s6[0]) * PAYOFF.fps), 0, PAYOFF.frames.length - 1)
  if (i !== lastPayoff) { $('payoffImg').src = PAYOFF.frames[i]; lastPayoff = i }
  $('domBadge').innerHTML = `rows: <b>100,000</b> · in the DOM: <b>${PAYOFF.dom[i]}</b>`
}

/* ============================================================ tick */
function show(id, on) { $(id).style.display = on ? '' : 'none' }
function setVis(el, on) { el.style.display = on ? '' : 'none' }

function blink(t, period, offset) {
  // 0 = open, 1 = closed; a 0.16 s blink once per period.
  const p = ((t + offset) % period) / period
  const w = 0.16 / period
  return p < w ? Math.sin((p / w) * Math.PI) : 0
}

function tick(t) {
  /* --- which shot is on screen --- */
  const wide = inT(t, T.s1) || inT(t, T.s3) || inT(t, T.s5) || inT(t, T.s6)
  setVis($('world'), wide)
  setVis($('live'), wide && t >= 0.4)
  setVis($('shotCeo'), inT(t, T.s2) || inT(t, T.s7))
  setVis($('shotDev'), inT(t, T.s4))
  setVis($('end'), t >= T.s8[0])

  /* --- camera on the stage --- */
  // [time, scale, panY]: slow push in, zoom to the screen for the freeze,
  // hold on the screen through the swap, pull back wide for the reaction.
  const KEYS = [[0, 1.0, 0], [T.s1[1], 1.05, 0], [T.s3[0], 1.0, 0], [T.freeze - 0.2, 1.24, 0], [T.freeze + 0.05, 1.42, 30], [T.s3[1], 1.45, 30], [T.s5[0], 1.25, 0], [T.split - 0.25, 1.25, 0], [T.s6[1], 0.98, -30]]
  let k = 0
  while (k < KEYS.length - 2 && t >= KEYS[k + 1][0]) k++
  const [ta, sa, pa] = KEYS[k], [tb, sb, pb] = KEYS[k + 1]
  const e = easeInOut(seg(t, ta, tb))
  const sc = lerp(sa, sb, e), py = lerp(pa, pb, e)
  // A hit of shake when the tab freezes.
  const sh = t > T.freeze && t < T.freeze + 0.5 ? 22 * Math.exp(-(t - T.freeze) * 8) : 0
  $('world').style.transform = `translate(${(sh * Math.sin(t * 90)).toFixed(1)}px, ${(py + sh * Math.cos(t * 70)).toFixed(1)}px) scale(${sc.toFixed(4)})`

  /* --- spotlight: snaps on at 0.35 s, flickers once --- */
  const spot = t < 0.35 ? 0 : t < 0.45 ? 0.4 : t < 0.5 ? 0.15 : 1
  $('spot').style.opacity = spot
  $('spotpool').style.opacity = spot
  $('liveDot').style.opacity = Math.floor(t * 2) % 2 ? 0.25 : 1

  /* --- projector layers --- */
  setVis($('lSlide'), t < T.s3[0])
  setVis($('lNaive'), t >= T.s3[0] && t < T.s5[0])
  setVis($('lCode'), t >= T.s5[0] && t < T.s6[0])
  setVis($('payoff'), t >= T.s6[0])

  // The naive table: renders fast, slows, stalls at 31,207 and freezes.
  if (t >= T.s3[0] && t < T.s5[0]) {
    const p = seg(t, T.s3[0] + 0.4, T.freeze)
    const n = Math.floor(31207 * (1 - Math.pow(1 - p, 2.2)))
    $('naiveBody').innerHTML = naiveRows(n)
    $('naiveCount').textContent = `${n.toLocaleString('en-US')} rows in the DOM`
    $('naiveProg').textContent = `rendering ${n.toLocaleString('en-US')} / 100,000 rows`
    const frozen = t >= T.freeze
    $('spin').style.transform = `rotate(${frozen ? 0 : (t * 720) % 360}deg)`
    setVis($('freezeVeil'), frozen)
    setVis($('dialog'), t >= T.freeze + 0.2)
    $('dialog').style.transform = `scale(${lerp(0.85, 1, easeOut(seg(t, T.freeze + 0.2, T.freeze + 0.45)))})`
    // The cursor drifts to "Wait" and clicks it, which does nothing.
    const c = easeInOut(seg(t, T.freeze + 0.6, T.freeze + 1.5))
    $('cursor').style.left = `${lerp(300, 600, c)}px`
    $('cursor').style.top = `${lerp(420, 280, c)}px`
    setVis($('cursor'), t >= T.freeze + 0.5)
  }

  // The swap, typed onto the projector.
  if (t >= T.s5[0] && t < T.s6[0]) $('lCode').innerHTML = codeSteps().filter((s) => t >= s.at).map((s) => s.html).join('')

  if (t >= T.s6[0]) setPayoffFrame(t)

  /* --- the small presenter at the podium --- */
  const worriedSmall = t < T.decide + 0.45
  for (const [id, on] of [['s_devBrowWorried', worriedSmall], ['s_devBrowDet', !worriedSmall && t < T.s6[0] + 1.6], ['s_devMouthWorried', worriedSmall], ['s_devMouthDet', !worriedSmall && t < T.s6[0] + 1.6], ['s_devMouthHappy', t >= T.s6[0] + 1.6]])
    setVis($(id), on)
  setVis($('s_devBrowDet'), !worriedSmall)
  const bl = blink(t, 3.1, 0.7)
  $('s_devLidL').setAttribute('transform', `translate(0 ${(-60 + 60 * bl).toFixed(1)})`)
  $('s_devLidR').setAttribute('transform', `translate(0 ${(-60 + 60 * bl).toFixed(1)})`)
  setVis($('s_sweat1'), t > T.s3[0] && t < T.s6[0])
  setVis($('s_sweat2'), t > T.freeze && t < T.s6[0])
  $('devSmall').style.transform = `translateY(${(Math.sin(t * 2.2) * 4).toFixed(1)}px)`

  /* --- the audience: still, restless at the freeze, nodding at the payoff --- */
  document.querySelectorAll('.head').forEach((h) => {
    const i = Number(h.dataset.i)
    let dx = 0, dy = Math.sin(t * 1.3 + i) * 1.5
    if (t > T.freeze && t < T.s5[0]) dx = Math.sin(t * 6 + i * 1.7) * 9 // turning to each other
    if (t > T.s6[0] + 2.8) dy += Math.max(0, Math.sin(t * 7 + i * 0.9)) * 10    // nodding
    h.setAttribute('transform', `translate(${dx.toFixed(1)} ${dy.toFixed(1)})`)
  })

  /* --- close-up: the CEO --- */
  if (inT(t, T.s2) || inT(t, T.s7)) {
    const happy = t >= T.s7[0]
    setVis($('ceoBrowSkeptic'), !happy); setVis($('ceoBrowHappy'), happy)
    setVis($('ceoMouthFlat'), !happy); setVis($('ceoMouthSmile'), happy && t > T.clap + 0.3)
    if (happy && t <= T.clap + 0.3) setVis($('ceoMouthFlat'), true)
    setVis($('ceoArmsCrossed'), !happy || t < T.clap)
    setVis($('ceoClap'), happy && t >= T.clap)
    // Clap: hands meet four times a second.
    const c = Math.abs(Math.sin((t - T.clap) * Math.PI * 4))
    $('handL').setAttribute('transform', `translate(${(-26 * c).toFixed(1)} 0)`)
    $('handR').setAttribute('transform', `translate(${(26 * c).toFixed(1)} 0)`)
    const b = blink(t, 2.6, 0.3)
    $('ceoLidL').setAttribute('transform', `translate(0 ${(-44 + 44 * b).toFixed(1)})`)
    $('ceoLidR').setAttribute('transform', `translate(0 ${(-44 + 44 * b).toFixed(1)})`)
    // Skeptical: eyes narrow slowly. Pupils glance at the stage.
    if (!happy) { const n = 14 * seg(t, T.s2[0] + 0.2, T.s2[1] - 0.4); $('ceoLidL').setAttribute('transform', `translate(0 ${-44 + n + 44 * b})`); $('ceoLidR').setAttribute('transform', `translate(0 ${-44 + n + 44 * b})`) }
    $('ceoPupils').setAttribute('transform', `translate(${happy ? 0 : -4} 0)`)
    const push = happy ? lerp(1.0, 1.06, seg(t, T.s7[0], T.s7[1])) : lerp(1.0, 1.12, easeInOut(seg(t, T.s2[0], T.s2[1])))
    $('ceo').style.transform = `scale(${push}) translateY(${(Math.sin(t * 1.8) * 3).toFixed(1)}px)`
    $('ceo').style.transformOrigin = '450px 320px'
    const b1 = easeOut(seg(t, T.ceoAsk, T.ceoAsk + 0.25))
    setVis($('ceoBubble1'), !happy && t >= T.ceoAsk)
    $('ceoBubble1').style.transform = `scale(${b1})`
    const b2 = easeOut(seg(t, T.shipIt, T.shipIt + 0.25))
    setVis($('ceoBubble2'), happy && t >= T.shipIt)
    $('ceoBubble2').style.transform = `scale(${b2})`
  }

  /* --- close-up: the developer --- */
  if (inT(t, T.s4)) {
    const decided = t >= T.decide
    setVis($('devBrowWorried'), !decided); setVis($('devBrowDet'), decided)
    setVis($('devMouthWorried'), !decided); setVis($('devMouthDet'), decided); setVis($('devMouthHappy'), false)
    // Eyes dart left and right, then lock forward.
    const dart = decided ? 0 : Math.sign(Math.sin(t * 9)) * 7
    $('devPupils').setAttribute('transform', `translate(${dart} 0)`)
    const b = decided ? 0.25 : blink(t, 1.4, 0)
    $('devLidL').setAttribute('transform', `translate(0 ${(-60 + 60 * b).toFixed(1)})`)
    $('devLidR').setAttribute('transform', `translate(0 ${(-60 + 60 * b).toFixed(1)})`)
    // Sweat slides down.
    const s1 = ((t - T.s4[0]) * 60) % 140, s2 = ((t - T.s4[0] - 0.3) * 50) % 140
    $('sweat1').setAttribute('transform', `translate(0 ${s1.toFixed(1)})`)
    $('sweat2').setAttribute('transform', `translate(0 ${s2.toFixed(1)})`)
    setVis($('devGlint'), decided)
    // Slow push in, then a snap zoom on the decision.
    const z = decided ? lerp(1.12, 1.2, easeOut(seg(t, T.decide, T.decide + 0.2))) : lerp(1.0, 1.12, seg(t, T.s4[0], T.decide))
    $('dev').style.transformOrigin = '450px 380px'
    $('dev').style.transform = `scale(${z}) translateX(${(decided ? 0 : Math.sin(t * 40) * 2).toFixed(1)}px)`
  }

  /* --- captions --- */
  CAPS.forEach(([a, b, , kind], i) => {
    const el = $(`cap${i}`)
    const on = t >= a && t < b
    setVis(el, on)
    if (!on) return
    const k = easeOut(seg(t, a, a + 0.3))
    el.style.opacity = k
    el.style.transform = `translateY(${(1 - k) * 30}px)`
    if (kind === 'dom') {
      const dom = PAYOFF.dom.length ? PAYOFF.dom[Math.min(PAYOFF.dom.length - 1, Math.floor((t - T.s6[0]) * PAYOFF.fps))] : '?'
      el.innerHTML = `The DOM holds <em>${dom}</em> rows.<small>Out of 100,000.</small>`
    }
  })

  /* --- transitions --- */
  // White flash on the swap, black at both ends of the loop.
  $('flash').style.opacity = t >= T.s5[0] && t < T.s5[0] + 0.25 ? 1 - seg(t, T.s5[0], T.s5[0] + 0.25) : t >= T.s6[0] && t < T.s6[0] + 0.2 ? 0.6 * (1 - seg(t, T.s6[0], T.s6[0] + 0.2)) : 0
  const black = t < 0.35 ? 1 : t > T.end - 1.1 ? seg(t, T.end - 1.1, T.end - 0.2) : 0
  $('black').style.opacity = black
}

window.__seek = (t) => tick(t)
window.__seek(0)
</script>
</body>
</html>

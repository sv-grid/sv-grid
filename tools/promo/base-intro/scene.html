<!doctype html>
<!--
  "Meet SvGrid Base" - a ~1:50 landscape presentation, 1920 x 1080.

  Zazo presents, on the left, his mouth driven by the loudness of his own
  voice (window.__setMouth, one value per frame). The screen on the right
  shows slides and real footage of the Base demos (footage.mjs), and, for the
  Supabase part, a real app on a real Supabase project.

  Every animation is a pure function of t (window.__seek).
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=block" />
<style>
  :root { --bg: #0b0908; --fg: #fafaf9; --muted: #a8a29e; --orange: #ff5a1f; --green: #22c55e; --line: #292524; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, system-ui, sans-serif; }
  #frame { position: absolute; inset: 0; overflow: hidden; }
  .stage { position: absolute; inset: 0; background: radial-gradient(ellipse 70% 80% at 30% 40%, #221d29 0%, #120f16 55%, #0b0908 100%); }
  .floor { position: absolute; left: 0; right: 0; bottom: 0; height: 220px; background: linear-gradient(#0b0908 0%, #15110f 100%); border-top: 1px solid #1f1a17; }
  .spot { position: absolute; left: -120px; top: 120px; width: 900px; height: 1100px; background: radial-gradient(ellipse at 50% 40%, rgba(255,90,31,.10), transparent 60%); }

  /* The screen. */
  #screen { position: absolute; left: 650px; top: 96px; width: 1220px; height: 686px; border-radius: 22px; overflow: hidden; background: #0c0a09; box-shadow: 0 0 0 2px #2b2622, 0 30px 80px -20px rgba(0,0,0,.8), 0 0 120px 10px rgba(255,90,31,.06); }
  #slides { position: absolute; inset: 0; }
  .slide { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 70px 90px; }
  .slide h1 { font-size: 92px; line-height: 1; font-weight: 900; letter-spacing: -.04em; }
  .slide h1 em { font-style: normal; color: var(--orange); }
  .slide h2 { font-size: 58px; line-height: 1.08; font-weight: 900; letter-spacing: -.03em; }
  .slide p { font-size: 34px; line-height: 1.35; color: #d6d3d1; margin-top: 26px; font-weight: 600; }
  .slide .k { color: var(--muted); font-size: 26px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; margin-bottom: 22px; }
  .brand { display: flex; align-items: center; gap: 22px; font-size: 96px; font-weight: 900; letter-spacing: -.04em; }
  .brand i { font-style: normal; color: var(--orange); }
  .brand small { font-size: 96px; color: #e7e5e4; font-weight: 800; }
  .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px; margin-top: 34px; }
  .card { background: #171311; border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
  .card b { display: block; font-size: 26px; margin-bottom: 12px; }
  .card i { display: block; height: 14px; border-radius: 7px; background: #2a2420; margin-top: 10px; }
  .card i.c { width: 60%; background: var(--c); opacity: .85; }
  .split { display: grid; grid-template-columns: 1fr 120px 1fr; align-items: center; margin-top: 40px; gap: 10px; }
  .box { background: #171311; border: 1px solid var(--line); border-radius: 18px; padding: 26px; min-height: 250px; }
  .box b { display: block; font-size: 32px; margin-bottom: 14px; }
  .box span { display: block; font-size: 24px; color: var(--muted); line-height: 1.4; font-weight: 600; }
  .gap { text-align: center; font-size: 26px; color: #ef4444; font-weight: 800; }
  .code { white-space: pre-wrap; font: 600 30px/1.5 'JetBrains Mono'; background: #171311; border: 1px solid var(--line); border-radius: 14px; padding: 22px 28px; margin-top: 30px; color: #e7e5e4; }
  .code .f { color: #fbbf24; } .code .s { color: #86efac; } .code .c { color: #78716c; }
  .db { display: grid; grid-template-columns: 1fr 160px 1fr; align-items: center; margin-top: 34px; }
  .dbbox { background: #171311; border: 1px solid var(--line); border-radius: 18px; padding: 24px; font-size: 26px; font-weight: 700; line-height: 1.55; }
  .dbbox em { font-style: normal; color: var(--green); }
  .arrows { text-align: center; font: 800 46px Inter; color: var(--orange); }
  #clip { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: left top; display: block; }
  #sqlbox { position: absolute; right: 26px; top: 26px; width: 560px; bottom: 26px; background: rgba(12,10,9,.97); border: 1px solid #3f3a36; border-radius: 16px; padding: 18px 20px; font: 600 15px/1.45 'JetBrains Mono'; color: #d6d3d1; white-space: pre; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
  #sqlbox .hd { color: var(--green); font-weight: 700; margin-bottom: 8px; display: block; }
  #sqlbox .kw { color: #c084fc; }
  .tag { position: absolute; right: 18px; bottom: 16px; font: 700 18px 'JetBrains Mono'; color: #fff; background: rgba(12,10,9,.92); border: 2px solid var(--green); border-radius: 10px; padding: 7px 12px; }

  /* Lower third, under the screen. */
  #lower { position: absolute; left: 720px; top: 820px; width: 1150px; }
  #lower .big { font-size: 54px; font-weight: 900; letter-spacing: -.03em; line-height: 1.05; }
  #lower .big em { font-style: normal; color: var(--orange); }
  #lower .small { font-size: 30px; font-weight: 700; color: var(--muted); margin-top: 12px; }

  /* Zazo. */
  #zazo { position: absolute; left: 20px; top: 250px; width: 640px; overflow: visible; }
  .name { position: absolute; left: 70px; top: 960px; font-size: 30px; font-weight: 800; background: #171311; border: 1px solid var(--line); border-radius: 12px; padding: 10px 18px; }
  .name i { font-style: normal; color: var(--orange); }

  #black { position: absolute; inset: 0; background: #000; pointer-events: none; }
</style>
</head>
<body>
<div id="frame">
  <div class="stage"></div>
  <div class="spot"></div>
  <div class="floor"></div>

  <div id="screen">
    <img id="clip" alt="" />
    <div id="slides"></div>
    <div id="sqlbox"></div>
    <div class="tag" id="tag"></div>
  </div>
  <div id="lower"><div class="big" id="lowerBig"></div><div class="small" id="lowerSmall"></div></div>

  <svg id="zazo" viewBox="0 0 400 520"></svg>
  <div class="name"><i>Zazo</i> · SvGrid</div>
  <div id="black"></div>
</div>

<script>
/* =============================================================== timing */
let SEG = {}
let END = 110
let MOUTH = []
let CLIPS = {}
let SQL = ''
const FPS = 30
window.__setTimeline = (seg, end) => { SEG = seg; END = end }
window.__setMouth = (m) => { MOUTH = m }
window.__setClips = (c) => { CLIPS = c }
window.__setSql = (s) => { SQL = s }

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const easeOut = (k) => 1 - Math.pow(1 - k, 3)
const easeInOut = (k) => (k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2)
const $ = (id) => document.getElementById(id)
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
const now = (t) => Object.keys(SEG).find((k) => t >= SEG[k][0] && t < SEG[k][1]) ?? (t < (SEG.hello?.[0] ?? 0.6) ? 'hello' : 'close')

/* ============================================================ Zazo */
// The official Svelte mark (website/src/components/solutions/SvelteMark.svelte).
const SVELTE = `<path d="M91.8 15.6C80.9-.1 59.2-4.7 43.6 5.2L16.1 22.8C8.6 27.5 3.4 35.2 1.9 43.9c-1.3 7.3-.2 14.8 3.3 21.3-2.4 3.6-4 7.6-4.7 11.8-1.6 8.9.5 18.1 5.7 25.4 11 15.7 32.6 20.3 48.2 10.4l27.5-17.5c7.5-4.7 12.7-12.4 14.2-21.1 1.3-7.3.2-14.8-3.3-21.3 2.4-3.6 4-7.6 4.7-11.8 1.7-9-.4-18.2-5.6-25.5" fill="#ff3e00"/><path d="M40.9 103.9c-8.9 2.3-18.2-1.2-23.4-8.7-3.2-4.4-4.4-9.9-3.5-15.3.2-.9.4-1.7.6-2.6l.5-1.6 1.4 1c3.3 2.4 6.9 4.2 10.8 5.4l1 .3-.1 1c-.1 1.4.3 2.9 1.1 4.1 1.6 2.3 4.4 3.4 7.1 2.7.6-.2 1.2-.4 1.7-.7L67 78.2c1.4-.9 2.3-2.2 2.6-3.8.3-1.6-.1-3.3-1-4.6-1.6-2.3-4.4-3.3-7.1-2.6-.6.2-1.2.4-1.7.7l-10.5 6.7c-1.7 1.1-3.6 1.9-5.6 2.4-8.9 2.3-18.2-1.2-23.4-8.7-3.1-4.4-4.4-9.9-3.4-15.3.9-5.2 4.1-9.9 8.6-12.7l27.5-17.5c1.7-1.1 3.6-1.9 5.6-2.5 8.9-2.3 18.2 1.2 23.4 8.7 3.2 4.4 4.4 9.9 3.5 15.3-.2.9-.4 1.7-.7 2.6l-.5 1.6-1.4-1c-3.3-2.4-6.9-4.2-10.8-5.4l-1-.3.1-1c.1-1.4-.3-2.9-1.1-4.1-1.6-2.3-4.4-3.3-7.1-2.6-.6.2-1.2.4-1.7.7L31 39.8c-1.4.9-2.3 2.2-2.6 3.8-.3 1.6.1 3.3 1 4.6 1.6 2.3 4.4 3.3 7.1 2.6.6-.2 1.2-.4 1.7-.7l10.5-6.7c1.7-1.1 3.6-1.9 5.6-2.5 8.9-2.3 18.2 1.2 23.4 8.7 3.2 4.4 4.4 9.9 3.5 15.3-.9 5.2-4.1 9.9-8.6 12.7l-27.5 17.5c-1.7 1.1-3.6 1.9-5.6 2.5" fill="#fff"/>`

function zazoSvg() {
  const skin = '#8d5a3b', skinD = '#74472d', hair = '#1b1210', shirt = '#18181b'
  const curls = []
  for (const [x, y, r] of [[120,150,46],[160,118,50],[210,104,54],[262,116,50],[300,150,46],[316,196,36],[104,196,36],[146,96,34],[236,84,36],[280,100,30]])
    curls.push(`<circle cx="${x}" cy="${y}" r="${r}" fill="${hair}"/>`)
  return `
  <defs>
    <clipPath id="eyeL"><ellipse cx="170" cy="230" rx="24" ry="26"/></clipPath>
    <clipPath id="eyeR"><ellipse cx="250" cy="230" rx="24" ry="26"/></clipPath>
  </defs>
  <g id="armL"><path d="M96 410 q-40 60 -26 150" stroke="${shirt}" stroke-width="44" stroke-linecap="round" fill="none"/></g>
  <g id="body">
    <path d="M70 540 q10 -170 140 -180 q130 10 140 180 z" fill="${shirt}" stroke="#3f3f46" stroke-width="3"/>
    <path d="M176 362 q34 24 68 0" fill="none" stroke="#52525b" stroke-width="7" stroke-linecap="round"/>
    <g transform="translate(180 404) scale(0.6)">${SVELTE}</g>
  </g>
  <g id="armR">
    <path id="armRline" d="M324 410 q40 60 26 150" stroke="#3f3f46" stroke-width="50" stroke-linecap="round" fill="none"/>
    <path id="armRpath" d="M324 410 q40 60 26 150" stroke="${shirt}" stroke-width="44" stroke-linecap="round" fill="none"/>
    <g id="handR"><circle cx="0" cy="0" r="24" fill="${skin}"/><path id="finger" d="M14 -10 L44 -26" stroke="${skin}" stroke-width="13" stroke-linecap="round"/></g>
  </g>
  <g id="head">
    <rect x="178" y="300" width="64" height="70" rx="22" fill="${skinD}"/>
    <ellipse cx="110" cy="240" rx="20" ry="30" fill="${skin}"/><ellipse cx="310" cy="240" rx="20" ry="30" fill="${skin}"/>
    <ellipse cx="210" cy="230" rx="100" ry="112" fill="${skin}"/>
    <path d="M120 270 q90 80 180 0 q-10 60 -90 70 q-80 -10 -90 -70z" fill="${skinD}" opacity=".35"/>
    ${curls.join('')}
    <path d="M100 210 q110 -190 220 0" fill="none" stroke="#27272a" stroke-width="12"/>
    <rect x="86" y="206" width="30" height="58" rx="12" fill="#27272a"/><rect x="304" y="206" width="30" height="58" rx="12" fill="#27272a"/>
    <path d="M104 262 q8 70 86 58" fill="none" stroke="#27272a" stroke-width="7"/><circle cx="192" cy="320" r="9" fill="#27272a"/>
    <ellipse cx="170" cy="230" rx="24" ry="26" fill="#fff"/><ellipse cx="250" cy="230" rx="24" ry="26" fill="#fff"/>
    <g id="pupils"><circle cx="172" cy="232" r="12" fill="#3b2314"/><circle cx="252" cy="232" r="12" fill="#3b2314"/>
      <circle cx="176" cy="227" r="4" fill="#fff"/><circle cx="256" cy="227" r="4" fill="#fff"/></g>
    <g clip-path="url(#eyeL)"><rect id="lidL" x="140" y="200" width="60" height="60" fill="${skin}"/></g>
    <g clip-path="url(#eyeR)"><rect id="lidR" x="220" y="200" width="60" height="60" fill="${skin}"/></g>
    <rect x="136" y="198" width="70" height="64" rx="22" fill="none" stroke="#111" stroke-width="7"/>
    <rect x="214" y="198" width="70" height="64" rx="22" fill="none" stroke="#111" stroke-width="7"/>
    <path d="M206 224 h8" stroke="#111" stroke-width="7"/>
    <g id="brows">
      <path d="M144 180 q24 -18 50 -6" fill="none" stroke="${hair}" stroke-width="10" stroke-linecap="round"/>
      <path d="M226 174 q26 -12 50 6" fill="none" stroke="${hair}" stroke-width="10" stroke-linecap="round"/>
    </g>
    <ellipse cx="146" cy="282" rx="16" ry="9" fill="#c2410c" opacity=".28"/><ellipse cx="274" cy="282" rx="16" ry="9" fill="#c2410c" opacity=".28"/>
    <g id="smile"><path d="M178 292 q32 34 64 0 z" fill="#3b1408"/><path d="M186 294 q24 9 48 0" fill="#fff"/></g>
    <g id="talk"><ellipse cx="210" cy="300" rx="24" ry="18" fill="#3b1408"/><ellipse cx="210" cy="310" rx="13" ry="7" fill="#e11d48" opacity=".7"/><path d="M192 288 q18 -5 36 0" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/></g>
  </g>`
}
$('zazo').innerHTML = zazoSvg()

function logo(size) {
  const cols = [{ x: 4, w: 6 }, { x: 11, w: 4 }, { x: 16, w: 4 }]
  let r = ''
  for (const c of cols) r += `<rect x="${c.x}" y="4" width="${c.w}" height="4" rx="1.2" fill="#fafaf9" opacity="0.9"/>`
  r += `<path d="M16.9 5.4 L19.1 5.4 L18 6.9 Z" fill="#ff5a1f"/>`
  for (const y of [9, 13, 17]) cols.forEach((c, i) => (r += `<rect x="${c.x}" y="${y}" width="${c.w}" height="3" rx="0.9" fill="${i === 2 ? '#ff5a1f' : '#fafaf9'}" opacity="${i === 2 ? 1 : 0.32}"/>`))
  return `<svg viewBox="0 0 24 24" width="${size}" height="${size}">${r}</svg>`
}

/* ========================================================== the screen */
const SLIDES = {
  hello: () => `<div class="slide"><div class="k">Zazo presents</div><div class="brand">${logo(110)}<span><i>Sv</i>Grid</span><small>Base</small></div><p>Your tables, inside your own app.</p></div>`,
  hook: () => `<div class="slide"><h2>Your team runs on tables.</h2><div class="cards">${[['Projects', '#3b82f6'], ['Customers', '#22c55e'], ['Hiring', '#a855f7'], ['Inventory', '#f59e0b']].map(([n, c]) => `<div class="card" style="--c:${c}"><b>${n}</b><i class="c"></i><i></i><i></i><i class="c" style="width:40%"></i><i></i></div>`).join('')}</div></div>`,
  problem: () => `<div class="slide"><h2>It works. But...</h2><div class="split"><div class="box"><b>Someone else's cloud</b><span>Your records, on their servers.<br>Your team signs in somewhere else.</span></div><div class="gap">next to,<br>not inside</div><div class="box"><b>Your app</b><span>Where your users already work.<br>Your auth, your database.</span></div></div></div>`,
  intro: () => `<div class="slide"><div class="brand" style="font-size:84px">${logo(96)}<span><i>Sv</i>Grid</span><small style="font-size:84px">Base</small></div><h2 style="margin-top:34px">The Airtable alternative<br>that runs <em style="font-style:normal;color:var(--orange)">inside your Svelte app,</em><br>on your own database.</h2></div>`,
  bind: () => `<div class="slide"><h2>Point it at your Supabase project.</h2><div class="code"><span class="c">// reads your schema, builds the app</span>\nconst tables = await <span class="f">baseFromSupabase</span>({ client, url, key })</div><div class="db"><div class="dbbox">Your database<br><em>tables · columns · foreign keys</em></div><div class="arrows">→</div><div class="dbbox">A base<br><em>tables · field types · links · views</em></div></div></div>`,
  sync: () => `<div class="slide"><h2>And it stays in sync.</h2><div class="db"><div class="dbbox">You edit a cell<br><em>written to the database</em></div><div class="arrows">⇄</div><div class="dbbox">A colleague edits<br><em>arrives live, via Realtime</em></div></div></div>`,
  close: () => `<div class="slide"><div class="brand" style="font-size:84px">${logo(96)}<span><i>Sv</i>Grid</span><small style="font-size:84px">Base</small></div><h2 style="margin-top:30px">Your tables. Your database.<br><em style="font-style:normal;color:var(--orange)">Your app.</em></h2><div class="code" style="font-size:30px">npm i @svgrid/enterprise</div><p style="font-size:28px">Part of SvGrid Suite. Free to try, with a small watermark until you add a key.<br>svgrid.com/docs/help/base</p></div>`,
}
const LOWER = {
  fields: ['More than <em>twenty field types.</em>', 'Selects, people, dates, files, links, lookups, rollups, formulas'],
  views: ['Every table, <em>your way.</em>', 'Grid, Kanban, calendar, gallery, form'],
  records: ['Filter, group, sort, color.', 'And every record opens in full, with comments'],
  bind: ['It builds the app <em>from your database.</em>', 'Every table, its fields, its records, and views'],
  sync: ['Always <em>in sync.</em>', 'Edits written to the database, changes arriving live'],
  databases: ['Any database. <em>Or your API.</em>', 'Postgres, MySQL, SQLite, SQL Server, REST'],
  sql: ['Designed in the page?', 'Download it as SQL, and that creates the tables'],
  automations: ['<em>Automations,</em> built in.', 'Update records, call a webhook, send an email'],
}
const TAGS = { databases: 'baseFromDatabase({ execute }) · real Postgres in the page', bind: 'a real Supabase project', sync: 'two windows, one Supabase project' }

let lastSlide = ''
let lastClipSrc = ''
function screen(t) {
  const id = now(t)
  const clip = CLIPS[id]
  const img = $('clip')
  if (clip && clip.length) {
    const i = clamp(Math.floor((t - SEG[id][0]) * FPS), 0, clip.length - 1)
    if (clip[i] !== lastClipSrc) { img.src = clip[i]; lastClipSrc = clip[i] }
    img.style.display = ''
    if (lastSlide) { $('slides').innerHTML = ''; lastSlide = '' }
  } else {
    img.style.display = 'none'
    const html = SLIDES[id] ? SLIDES[id]() : ''
    if (html !== lastSlide) { $('slides').innerHTML = html; lastSlide = html }
  }
  // A slide fades in at the start of its segment.
  $('slides').style.opacity = easeOut(seg(t, SEG[id]?.[0] ?? 0, (SEG[id]?.[0] ?? 0) + 0.4))
  $('slides').style.transform = `translateY(${(1 - easeOut(seg(t, SEG[id]?.[0] ?? 0, (SEG[id]?.[0] ?? 0) + 0.5))) * 20}px)`
  // The SQL the base downloads, shown once the menu has done its work.
  const showSql = id === 'sql' && SQL && t > SEG.sql[0] + 2.4
  $('sqlbox').style.display = showSql ? '' : 'none'
  if (showSql) {
    const k = easeOut(seg(t, SEG.sql[0] + 2.4, SEG.sql[0] + 3.0))
    $('sqlbox').style.transform = `translateX(${(1 - k) * 600}px)`
    const lines = SQL.split('\n').filter((l) => l.trim() && !l.startsWith('--')).slice(0, 30)
    $('sqlbox').innerHTML = `<span class="hd">base.sql</span>${lines.map((l) => esc(l).replace(/\b(create table|alter table|primary key|references|add foreign key|not null|default)\b/gi, '<span class="kw">$1</span>')).join('\n')}`
  }
  const tag = clip && TAGS[id]
  $('tag').style.display = tag ? '' : 'none'
  if (tag) $('tag').textContent = TAGS[id]
  // Lower third.
  const l = LOWER[id]
  $('lower').style.display = l ? '' : 'none'
  if (l) {
    $('lowerBig').innerHTML = l[0]
    $('lowerSmall').textContent = l[1]
    const k = easeOut(seg(t, SEG[id][0] + 0.2, SEG[id][0] + 0.6))
    $('lower').style.opacity = k
    $('lower').style.transform = `translateY(${(1 - k) * 16}px)`
  }
}

/* ============================================================ tick */
function blink(t, period, offset) {
  const p = ((t + offset) % period) / period
  const w = 0.16 / period
  return p < w ? Math.sin((p / w) * Math.PI) : 0
}
const POINT = new Set(['fields', 'views', 'records', 'bind', 'sync', 'databases', 'sql', 'automations'])

function tick(t) {
  screen(t)
  const id = now(t)
  const f = Math.floor(t * FPS)
  const open = MOUTH[f] ?? 0
  const talking = open > 0.04
  // Mouth: the voice's loudness this frame.
  $('smile').style.opacity = talking ? 0 : 1
  $('talk').style.opacity = talking ? 1 : 0
  $('talk').setAttribute('transform', `translate(210 300) scale(${(0.9 + 0.15 * Math.sin(t * 9)).toFixed(3)} ${(0.15 + open * 1.1).toFixed(3)}) translate(-210 -300)`)
  $('brows').setAttribute('transform', `translate(0 ${(-open * 5).toFixed(2)})`)
  const b = blink(t, 3.6, 0.4)
  $('lidL').setAttribute('transform', `translate(0 ${(-60 + 60 * b).toFixed(1)})`)
  $('lidR').setAttribute('transform', `translate(0 ${(-60 + 60 * b).toFixed(1)})`)
  // He looks at the screen when it shows footage, at us otherwise.
  const look = POINT.has(id) ? 1 : 0
  $('pupils').setAttribute('transform', `translate(${(look * 9).toFixed(1)} ${(-look * 2).toFixed(1)})`)
  $('head').setAttribute('transform', `rotate(${(Math.sin(t * 1.3) * 2 + open * 2 * Math.sin(t * 5)).toFixed(2)} 210 330)`)
  // The right arm points at the screen during the demos, and talks with him otherwise.
  const pointK = easeInOut(clamp(POINT.has(id) ? seg(t, SEG[id][0], SEG[id][0] + 0.5) : 1 - seg(t, SEG[id]?.[0] ?? 0, (SEG[id]?.[0] ?? 0) + 0.5)))
  const restHand = [350, 560], pointHand = [430, 300]
  const gesture = talking && !POINT.has(id) ? Math.sin(t * 3.2) * 18 : 0
  const hx = restHand[0] + (pointHand[0] - restHand[0]) * pointK
  const hy = restHand[1] + (pointHand[1] - restHand[1]) * pointK - gesture
  const armD = `M324 410 Q${(330 + 70 * pointK).toFixed(1)} ${(470 - 120 * pointK).toFixed(1)} ${hx.toFixed(1)} ${hy.toFixed(1)}`
  $('armRpath').setAttribute('d', armD)
  $('armRline').setAttribute('d', armD)
  $('handR').setAttribute('transform', `translate(${hx.toFixed(1)} ${hy.toFixed(1)})`)
  $('finger').style.opacity = pointK
  // A gentle sway, and a wave at hello and goodbye.
  const wave = (id === 'hello' || id === 'close') && t < (SEG[id]?.[0] ?? 0) + 2 ? Math.sin(t * 14) * 10 : 0
  $('armL').setAttribute('transform', `rotate(${(wave).toFixed(1)} 96 410)`)
  $('zazo').style.transform = `translateY(${(Math.sin(t * 1.1) * 4).toFixed(1)}px)`
  $('black').style.opacity = t < 0.4 ? 1 - seg(t, 0, 0.4) : t > END - 1.2 ? seg(t, END - 1.2, END - 0.2) : 0
}

window.__seek = (t) => tick(t)
window.__seek(0)
</script>
</body>
</html>

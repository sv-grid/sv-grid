<!doctype html>
<!--
  "You're absolutely right" - a ~68-second Short, 1080 x 1920.

  Story: Zazo asks Claude for a simple orders table and gets a 2,040-line
  "enterprise-grade table framework" with a plugin system, a state machine
  and a design system. It doesn't sort. "You're absolutely right!" Claude
  starts rewriting all of it. Zazo: use the SvGrid MCP. Claude finds the
  docs, checks its code, the check catches a mistake, and 13 lines later the
  table sorts, filters and pages. "You actually checked it?"

  Claude is a cartoon character: a speech bubble with a face and a name tag,
  not Anthropic's logo or interface. The chat, the framework and the broken
  table are cartoons. Real: the tool names, the check result on the monitor
  (svgrid_check_code's message on the first draft, "Clean" on the second),
  the 13-line Orders.svelte shown (tutorials-out/app/claude-orders), and the
  payoff footage of that app on the published @svgrid/grid.

  Every animation is a pure function of t (window.__seek).
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=block" />
<style>
  :root { --bg: #0b0908; --fg: #fafaf9; --orange: #ff5a1f; --red: #ef4444; --green: #22c55e; --coral: #e8875f; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, system-ui, sans-serif; font-variant-ligatures: none; }
  .abs { position: absolute; }
  #frame { position: absolute; inset: 0; overflow: hidden; }
  #room { position: absolute; inset: 0; background: radial-gradient(ellipse 90% 60% at 50% 35%, #242036, #12101a 70%, #0b0a0f); }
  #glow { position: absolute; left: 40px; top: 300px; width: 1000px; height: 620px; border-radius: 50%; background: radial-gradient(rgba(150,160,255,.16), transparent 70%); }
  .desk { position: absolute; left: -40px; right: -40px; top: 1580px; height: 400px; background: linear-gradient(#4a3a2c, #33281e 50%, #241c15); box-shadow: 0 -6px 0 #5c4836 inset; }
  .mug { position: absolute; left: 456px; top: 1500px; width: 74px; height: 86px; background: #e7e5e4; border-radius: 6px 6px 20px 20px; }
  .mug::after { content: ''; position: absolute; right: -28px; top: 18px; width: 28px; height: 40px; border: 9px solid #e7e5e4; border-left: 0; border-radius: 0 22px 22px 0; }

  /* ---------- the monitor ---------- */
  #monitor { position: absolute; left: 90px; top: 350px; width: 900px; height: 506px; transform-origin: 540px 350px; }
  #screen { position: absolute; inset: 0; background: #0c0a09; border-radius: 8px; overflow: hidden; box-shadow: 0 0 0 14px #1c1917, 0 0 0 17px #2b2622, 0 30px 80px rgba(0,0,0,.6); }
  .stand { position: absolute; left: 400px; top: 520px; width: 100px; height: 60px; background: linear-gradient(#292524, #1c1917); clip-path: polygon(35% 0, 65% 0, 100% 100%, 0 100%); }
  .layer { position: absolute; inset: 0; }
  .chat { background: #1f1e1d; display: flex; flex-direction: column; color: #ece9e2; }
  .chat .bar { height: 46px; display: flex; align-items: center; gap: 10px; padding: 0 18px; border-bottom: 1px solid #353331; font: 700 18px Inter; flex: none; }
  .chat .bar i { width: 11px; height: 11px; border-radius: 50%; background: var(--coral); display: block; }
  .chat .body { flex: 1; overflow: hidden; padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; }
  .msg.user { align-self: flex-end; max-width: 78%; font: 600 22px/1.35 Inter; background: #393735; border-radius: 16px; padding: 10px 16px; }
  .msg.ai { font: 500 21px/1.45 Inter; }
  .msg.ai b { color: #fff; }
  .files { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 18px; font: 500 15px/1.5 'JetBrains Mono'; color: #a8a29e; background: #141312; border: 1px solid #353331; border-radius: 10px; padding: 10px 14px; }
  .files span::before { content: '+ '; color: var(--green); }
  .counter { display: flex; justify-content: space-between; font: 700 20px 'JetBrains Mono'; color: #fca5a5; padding: 2px 4px; }
  .counter em { font-style: normal; color: #a8a29e; font-weight: 600; }
  .tool { background: #141312; border: 1px solid #353331; border-radius: 10px; padding: 12px 16px; font: 600 21px/1.45 'JetBrains Mono'; color: #d6d3d1; }
  .tool .hd { color: #a8a29e; font-size: 16px; }
  .tool .hd b { color: #fafaf9; }
  .tool .ok { color: var(--green); }
  .tool .bad { color: #fca5a5; }
  .broken { background: #f5f5f4; color: #1c1917; font: 500 19px Inter; }
  .broken .tt { height: 42px; display: flex; align-items: center; padding: 0 16px; background: #e7e5e4; font: 700 15px 'JetBrains Mono'; color: #57534e; }
  .broken table { width: 100%; border-collapse: collapse; }
  .broken th { text-align: left; padding: 9px 16px; background: #fafaf9; font-weight: 700; color: #57534e; border-bottom: 2px solid #d6d3d1; }
  .broken td { padding: 7px 16px; border-bottom: 1px solid #e7e5e4; }
  .broken th.hit { background: #fde68a; }
  .stamp { position: absolute; right: 26px; bottom: 26px; font: 900 40px Inter; color: var(--red); border: 6px solid var(--red); border-radius: 12px; padding: 4px 16px; transform: rotate(-8deg); background: rgba(255,255,255,.9); }
  .code13 { background: #0c0a09; font: 600 17px/1.55 'JetBrains Mono'; padding: 16px 22px; color: #e7e5e4; white-space: pre; }
  .code13 .hd { color: #78716c; } .code13 .hd b { color: var(--green); }
  .code13 .k { color: #c084fc; } .code13 .s { color: #86efac; } .code13 .f { color: #fbbf24; } .code13 .n { color: #57534e; }
  #payoff { background: #0c0a09; }
  #payoff img { width: 100%; height: 100%; object-fit: contain; object-position: center top; display: block; }
  .badge { position: absolute; right: 12px; bottom: 12px; font: 700 17px 'JetBrains Mono'; color: #fff; background: rgba(12,10,9,.92); border: 2px solid var(--green); border-radius: 10px; padding: 7px 12px; }
  .badge b { color: var(--green); }
  #fakeCursor { position: absolute; left: 0; top: 0; width: 30px; height: 30px; filter: drop-shadow(0 2px 3px rgba(0,0,0,.4)); }

  /* ---------- the cast ---------- */
  #zazo { position: absolute; left: 10px; top: 960px; width: 560px; transform-origin: 280px 700px; }
  #claudeWrap { position: absolute; left: 560px; top: 1010px; width: 470px; transform-origin: 235px 300px; }
  .tag { position: absolute; left: 50%; bottom: -6px; transform: translateX(-50%); font: 800 30px Inter; color: #1c1917; background: #fafaf9; border-radius: 999px; padding: 6px 22px; box-shadow: 0 6px 0 #0005; }

  /* ---------- captions ---------- */
  .cap { position: absolute; left: 70px; right: 70px; top: 104px; font-weight: 900; font-size: 76px; line-height: 1.0; letter-spacing: -.035em; text-shadow: 0 4px 30px #000; }
  .cap small { display: block; font-size: 48px; font-weight: 800; color: #e7e5e4; margin-top: 14px; letter-spacing: -.02em; }
  .cap em { font-style: normal; color: var(--orange); }
  .cap .r { color: var(--red); } .cap .g { color: var(--green); }

  /* ---------- end card ---------- */
  #end { position: absolute; inset: 0; background: var(--bg); }
  #end .card { position: absolute; left: 72px; right: 72px; top: 520px; }
  #end .logo { display: flex; align-items: center; gap: 26px; font-size: 118px; font-weight: 900; letter-spacing: -.04em; }
  #end .logo i { font-style: normal; color: var(--orange); }
  #end h2 { font-size: 92px; line-height: 1.02; font-weight: 900; letter-spacing: -.035em; margin-top: 80px; }
  #end h2 em { font-style: normal; color: var(--orange); }
  #end .cmd { display: inline-block; margin-top: 64px; font: 600 33px/1.5 'JetBrains Mono'; background: #1c1917; border: 2px solid #292524; border-radius: 18px; padding: 22px 30px; white-space: pre; }
  #end .url { margin-top: 46px; font-size: 54px; font-weight: 800; color: #a8a29e; }
  #vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 75% 60% at 50% 48%, transparent 55%, rgba(0,0,0,.5) 100%); }
  #black { position: absolute; inset: 0; background: #000; pointer-events: none; }
  #flash { position: absolute; inset: 0; background: #fff; pointer-events: none; }
</style>
</head>
<body>
<div id="frame">
  <div id="room"></div>
  <div id="glow"></div>
  <div id="monitor">
    <div id="screen">
      <div class="layer chat" id="lChat"><div class="bar"><i></i>Claude</div><div class="body" id="chatBody"></div></div>
      <div class="layer broken" id="lBroken"></div>
      <div class="layer code13" id="lCode"></div>
      <div class="layer" id="payoff"><img id="payoffImg" alt="" /><div class="badge" id="badge"></div></div>
      <svg id="fakeCursor" viewBox="0 0 24 24"><path d="M3 2 L3 20 L8 15.5 L11.5 22.5 L14.8 21 L11.3 14 L18 14 Z" fill="#fff" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/></svg>
    </div>
    <div class="stand"></div>
  </div>
  <div class="desk"></div>
  <svg id="zazo" viewBox="0 0 400 560"></svg>
  <div id="claudeWrap"><svg id="claude" viewBox="0 0 400 420" width="470" height="494"></svg><div class="tag">Claude</div></div>
  <div class="mug"></div>

  <div id="end">
    <div class="card">
      <div class="logo" id="logo"></div>
      <h2>Give your AI<br><em>the docs.</em></h2>
      <div class="cmd">claude mcp add svgrid \
  -- npx -y @svgrid/mcp</div>
      <div class="url">svgrid.com/mcp</div>
    </div>
  </div>

  <div id="vignette"></div>
  <div id="caps"></div>
  <div id="flash"></div>
  <div id="black"></div>
</div>

<script>
/* =============================================================== timing */
let T = { intro: [0.5, 4], ask: [4, 6.6], gen: [6.6, 14.7], lines: [14.7, 17], extra: [17, 24.6], nosort: [24.6, 28.1], sorry: [28.1, 35.3],
  stop: [35.3, 39.3], docs: [39.3, 43.9], check: [43.9, 50.6], payoff: [50.6, 57.7], sus: [57.7, 59.9], joke: [59.9, 64.1], outro: [64.1, 69], end: 69 }
let AT = {}
let MOUTH = { zazo: [], claude: [], narrator: [] }
const FPS = 30
window.__setTimeline = (t, at) => { T = t; AT = at; buildCaps() }
window.__setMouth = (m) => { MOUTH = m }

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const lerp = (a, b, k) => a + (b - a) * k
const easeInOut = (k) => (k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2)
const easeOut = (k) => 1 - Math.pow(1 - k, 3)
const inB = (t, id) => t >= T[id][0] && t < T[id][1]
const $ = (id) => document.getElementById(id)
const setVis = (el, on) => { el.style.display = on ? '' : 'none' }
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
const typed = (s, k) => s.slice(0, Math.ceil(s.length * clamp(k)))
const mouth = (who, t) => MOUTH[who]?.[Math.floor(t * FPS)] ?? 0
const show = (id, on) => { const el = $(id); if (el) el.style.display = on ? '' : 'none' }

/* ============================================================ the cast */
function logoGlyph(size, ink = '#fafaf9') {
  const cols = [{ x: 4, w: 6 }, { x: 11, w: 4 }, { x: 16, w: 4 }]
  let r = ''
  for (const c of cols) r += `<rect x="${c.x}" y="4" width="${c.w}" height="4" rx="1.2" fill="${ink}" opacity="0.9"/>`
  r += `<path d="M16.9 5.4 L19.1 5.4 L18 6.9 Z" fill="#ff5a1f"/>`
  for (const y of [9, 13, 17]) cols.forEach((c, i) => (r += `<rect x="${c.x}" y="${y}" width="${c.w}" height="3" rx="0.9" fill="${i === 2 ? '#ff5a1f' : ink}" opacity="${i === 2 ? 1 : 0.32}"/>`))
  return `<svg viewBox="0 0 24 24" width="${size}" height="${size}">${r}</svg>`
}
// Zazo, front on: curly hair, glasses, headset, the black SvGrid T-shirt.
function zazoSvg() {
  const skin = '#8d5a3b', skinD = '#74472d', hair = '#1b1210', shirt = '#18181b'
  const curls = []
  for (const [x, y, r] of [[120,150,46],[160,118,50],[210,104,54],[262,116,50],[300,150,46],[316,196,36],[104,196,36],[146,96,34],[236,84,36],[280,100,30]])
    curls.push(`<circle cx="${x}" cy="${y}" r="${r}" fill="${hair}"/>`)
  return `
  <defs>
    <clipPath id="zEyeL"><ellipse cx="170" cy="230" rx="24" ry="26"/></clipPath>
    <clipPath id="zEyeR"><ellipse cx="250" cy="230" rx="24" ry="26"/></clipPath>
  </defs>
  <path d="M40 560 q14 -190 170 -200 q156 10 170 200 z" fill="${shirt}" stroke="#3f3f46" stroke-width="3"/>
  <path d="M176 362 q34 24 68 0" fill="none" stroke="#52525b" stroke-width="7" stroke-linecap="round"/>
  <g transform="translate(180 400) scale(2.5)">${logoGlyph(24).replace(/<\/?svg[^>]*>/g, '')}</g>
  <rect x="178" y="300" width="64" height="70" rx="22" fill="${skinD}"/>
  <ellipse cx="110" cy="240" rx="20" ry="30" fill="${skin}"/><ellipse cx="310" cy="240" rx="20" ry="30" fill="${skin}"/>
  <ellipse cx="210" cy="230" rx="100" ry="112" fill="${skin}"/>
  <path d="M120 270 q90 80 180 0 q-10 60 -90 70 q-80 -10 -90 -70z" fill="${skinD}" opacity=".35"/>
  ${curls.join('')}
  <path d="M100 210 q110 -190 220 0" fill="none" stroke="#27272a" stroke-width="12"/>
  <rect x="86" y="206" width="30" height="58" rx="12" fill="#27272a"/><rect x="304" y="206" width="30" height="58" rx="12" fill="#27272a"/>
  <path d="M104 262 q8 70 86 58" fill="none" stroke="#27272a" stroke-width="7"/><circle cx="192" cy="320" r="9" fill="#27272a"/>
  <ellipse cx="210" cy="230" rx="0" ry="0"/>
  <g>
    <ellipse cx="170" cy="230" rx="24" ry="26" fill="#fff"/><ellipse cx="250" cy="230" rx="24" ry="26" fill="#fff"/>
    <g id="zPupils"><circle cx="172" cy="232" r="12" fill="#3b2314"/><circle cx="252" cy="232" r="12" fill="#3b2314"/>
      <circle cx="176" cy="227" r="4" fill="#fff"/><circle cx="256" cy="227" r="4" fill="#fff"/></g>
    <g clip-path="url(#zEyeL)"><rect id="zLidL" x="140" y="200" width="60" height="60" fill="${skin}"/></g>
    <g clip-path="url(#zEyeR)"><rect id="zLidR" x="220" y="200" width="60" height="60" fill="${skin}"/></g>
  </g>
  <rect x="136" y="198" width="70" height="64" rx="22" fill="none" stroke="#111" stroke-width="7"/>
  <rect x="214" y="198" width="70" height="64" rx="22" fill="none" stroke="#111" stroke-width="7"/>
  <path d="M206 224 h8" stroke="#111" stroke-width="7"/>
  <g id="zBrowN"><path d="M144 182 q24 -12 50 -4" fill="none" stroke="${hair}" stroke-width="10" stroke-linecap="round"/><path d="M226 178 q26 -8 50 4" fill="none" stroke="${hair}" stroke-width="10" stroke-linecap="round"/></g>
  <g id="zBrowDown"><path d="M144 178 L194 190" stroke="${hair}" stroke-width="11" stroke-linecap="round"/><path d="M276 178 L226 190" stroke="${hair}" stroke-width="11" stroke-linecap="round"/></g>
  <g id="zBrowUp"><path d="M144 168 q24 -18 50 -8" fill="none" stroke="${hair}" stroke-width="10" stroke-linecap="round"/><path d="M226 160 q26 -14 50 8" fill="none" stroke="${hair}" stroke-width="10" stroke-linecap="round"/></g>
  <g id="zBrowSus"><path d="M144 186 L194 186" stroke="${hair}" stroke-width="11" stroke-linecap="round"/><path d="M226 162 q26 -16 50 6" fill="none" stroke="${hair}" stroke-width="10" stroke-linecap="round"/></g>
  <path id="zMouthFlat" d="M186 306 h48" stroke="#3b1408" stroke-width="8" stroke-linecap="round"/>
  <path id="zMouthSmile" d="M182 298 q28 22 56 0" fill="none" stroke="#3b1408" stroke-width="8" stroke-linecap="round"/>
  <g id="zMouthGrin"><path d="M176 292 q34 40 68 0 z" fill="#3b1408"/><path d="M184 294 q26 10 52 0" fill="#fff"/></g>
  <ellipse id="zMouthTalk" cx="210" cy="304" rx="20" ry="10" fill="#3b1408"/>
  <g id="zSweat"><path d="M300 150 q16 26 0 38 q-16 -12 0 -38z" fill="#7dd3fc"/></g>`
}
// Claude, as a cartoon: a coral speech bubble with a face. Not the logo.
function claudeSvg() {
  const body = '#e8875f', bodyD = '#c96b45', ink = '#2b1810'
  const spark = (x, y, s) => `<path d="M${x} ${y - s} L${x + s * 0.28} ${y - s * 0.28} L${x + s} ${y} L${x + s * 0.28} ${y + s * 0.28} L${x} ${y + s} L${x - s * 0.28} ${y + s * 0.28} L${x - s} ${y} L${x - s * 0.28} ${y - s * 0.28} Z" fill="#fde68a"/>`
  return `
  <g id="cBody">
    <path d="M70 330 L40 392 L128 334 Z" fill="${bodyD}"/>
    <rect x="30" y="60" width="340" height="280" rx="120" fill="${bodyD}"/>
    <rect x="30" y="48" width="340" height="280" rx="120" fill="${body}"/>
    <path d="M78 324 L46 384 L136 326 Z" fill="${body}"/>
    <ellipse cx="150" cy="110" rx="70" ry="22" fill="#fff" opacity=".18"/>
  </g>
  <g id="cEyesN"><ellipse cx="150" cy="170" rx="28" ry="34" fill="#fff"/><ellipse cx="250" cy="170" rx="28" ry="34" fill="#fff"/>
    <g id="cPupils"><circle cx="154" cy="176" r="15" fill="${ink}"/><circle cx="254" cy="176" r="15" fill="${ink}"/><circle cx="159" cy="170" r="5" fill="#fff"/><circle cx="259" cy="170" r="5" fill="#fff"/></g></g>
  <g id="cEyesHappy"><path d="M122 178 q28 -40 56 0" fill="none" stroke="${ink}" stroke-width="11" stroke-linecap="round"/><path d="M222 178 q28 -40 56 0" fill="none" stroke="${ink}" stroke-width="11" stroke-linecap="round"/></g>
  <g id="cEyesO"><circle cx="150" cy="168" r="36" fill="#fff"/><circle cx="250" cy="168" r="36" fill="#fff"/><circle cx="150" cy="168" r="10" fill="${ink}"/><circle cx="250" cy="168" r="10" fill="${ink}"/></g>
  <g id="cEyesDown"><ellipse cx="150" cy="178" rx="28" ry="26" fill="#fff"/><ellipse cx="250" cy="178" rx="28" ry="26" fill="#fff"/><circle cx="142" cy="190" r="13" fill="${ink}"/><circle cx="242" cy="190" r="13" fill="${ink}"/>
    <path d="M118 160 h64 M218 160 h64" stroke="${body}" stroke-width="22"/></g>
  <g id="cEyesWink"><ellipse cx="150" cy="170" rx="28" ry="34" fill="#fff"/><circle cx="154" cy="176" r="15" fill="${ink}"/><circle cx="159" cy="170" r="5" fill="#fff"/>
    <path d="M222 176 q28 -30 56 0" fill="none" stroke="${ink}" stroke-width="11" stroke-linecap="round"/></g>
  <ellipse cx="108" cy="232" rx="24" ry="13" fill="#d9534f" opacity=".35"/><ellipse cx="292" cy="232" rx="24" ry="13" fill="#d9534f" opacity=".35"/>
  <path id="cMouthSmile" d="M168 236 q32 34 64 0" fill="none" stroke="${ink}" stroke-width="10" stroke-linecap="round"/>
  <g id="cMouthGrin"><path d="M156 228 q44 64 88 0 z" fill="${ink}"/><path d="M166 232 q34 12 68 0" fill="#fff"/></g>
  <ellipse id="cMouthTalk" cx="200" cy="248" rx="30" ry="14" fill="${ink}"/>
  <path id="cMouthWavy" d="M164 250 q9 -10 18 0 q9 10 18 0 q9 -10 18 0 q9 10 18 0" fill="none" stroke="${ink}" stroke-width="8" stroke-linecap="round"/>
  <g id="cSweat"><path d="M330 110 q18 30 0 44 q-18 -14 0 -44z" fill="#7dd3fc"/></g>
  <g id="cSparks">${spark(28, 60, 22)}${spark(372, 40, 18)}${spark(386, 250, 14)}${spark(12, 240, 12)}</g>`
}
$('zazo').innerHTML = zazoSvg()
$('claude').innerHTML = claudeSvg()
$('logo').innerHTML = logoGlyph(126) + '<span><i>Sv</i>Grid</span>'

/* ========================================================= captions */
let CAPS = []
function buildCaps() {
  CAPS = [
    [T.intro[0] + 0.2, T.ask[1], 'Zazo needs<br>a table.'],
    [T.gen[0] + 1.2, T.extra[1], 'Claude wrote<br><span class="r">2,040 lines.</span>'],
    [T.nosort[0] + 0.3, T.nosort[1], "It doesn't sort."],
    [T.sorry[0] + 0.1, T.sorry[1], '"You\'re absolutely<br>right!"'],
    [T.stop[0] + 0.2, T.docs[1], 'Give it the<br><em>SvGrid MCP.</em>'],
    [T.check[0] + 0.1, T.check[1], 'It checks<br>its own code.'],
    [T.payoff[0] + 0.1, T.payoff[1], '<span class="g">13 lines.</span><small>Sorted, filtered, paged.</small>'],
  ]
  $('caps').innerHTML = CAPS.map((c, i) => `<div class="cap" id="cap${i}">${c[2]}</div>`).join('')
}
buildCaps()

/* ============================================== the monitor */
const FILES = ['TableEngine.ts', 'VirtualDOM.ts', 'PluginRegistry.ts', 'StateMachine.ts', 'EventBus.ts', 'SortStrategy.ts', 'ThemeProvider.ts', 'design/tokens.ts', 'design/Button.svelte', 'design/Tooltip.svelte', 'a11y/AriaManager.ts', 'OrdersTable.svelte']
const ASK = 'I just need a simple orders table.'
const STOP = 'Use the SvGrid MCP.'
function counterHtml(n, label) { return `<div class="counter"><span>${n.toLocaleString('en-US')} lines</span><em>${label}</em></div>` }
function chatHtml(t) {
  let h = ''
  if (t < T.nosort[0]) {
    if (t >= T.ask[0]) h += `<div class="msg user">${esc(typed(ASK, seg(t, T.ask[0] + 0.1, T.ask[1] - 0.4)))}</div>`
    if (t >= T.gen[0]) {
      const k = easeOut(seg(t, T.gen[0] + 0.3, T.gen[1] - 0.2))
      const n = Math.round(2040 * k)
      const files = FILES.slice(0, Math.max(1, Math.ceil(FILES.length * k)))
      h += `<div class="msg ai">Absolutely! Here is your <b>comprehensive, enterprise-grade table framework</b>:</div>`
      h += `<div class="files">${files.map((f) => `<span>${f}</span>`).join('')}</div>`
      h += counterHtml(n, `${files.length} files`)
    }
  } else if (t < T.stop[0]) {
    const r = seg(t, T.sorry[0] + 0.6, T.sorry[1])
    const n = r < 0.18 ? Math.round(2040 * (1 - r / 0.18)) : Math.round(640 * easeOut((r - 0.18) / 0.82))
    h += `<div class="msg user">It doesn't sort.</div>`
    h += `<div class="msg ai">You're absolutely right! I sincerely apologize. <b>Rewriting all of it</b>...</div>`
    h += counterHtml(n, r < 0.18 ? 'deleting' : 'rewriting')
  } else {
    if (t >= T.stop[0]) h += `<div class="msg user">${esc(typed(STOP, seg(t, T.stop[0] + 0.3, T.stop[0] + 1.6)))}</div>`
    const call = (at, name, arg, result) => (t >= at ? `<div class="tool"><div class="hd">svgrid · <b>${name}</b></div>${esc(arg)}${t >= at + 0.6 ? `<br>${result}` : ''}</div>` : '')
    h += call(T.docs[0] + 0.3, 'svgrid_search', 'query: "orders table sort filter paging"', '<span class="ok">docs, demos and API</span>')
    h += call(T.docs[0] + 1.5, 'svgrid_get', 'ref: "help/cells/text-formatting"', '<span class="ok">format: { type: \'currency\' }</span>')
  }
  return h
}
const ROWS = [['10001', 'Bluebird Co', 'Paid', '$1,408.34'], ['10002', 'Riverbend', 'Pending', '$1,600.70'], ['10003', 'Pinegate', 'Pending', '$3,305.67'], ['10004', 'Copperline', 'Paid', '$1,816.31'], ['10005', 'Lumen Works', 'Refunded', '$609.62'], ['10006', 'Kestrel Labs', 'Shipped', '$752.35']]
function brokenHtml(t) {
  const click = T.nosort[0] + 0.3
  const hit = t >= click && t < click + 0.25
  return `<div class="tt">OrdersTable.svelte · 2,040 lines · 12 files</div>
    <table><tr><th>Order</th><th>Customer</th><th>Status</th><th class="${hit ? 'hit' : ''}">Total ▲▼</th></tr>${ROWS.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join('')}</tr>`).join('')}</table>
    ${t >= AT.nosort ? '<div class="stamp">DOESN\'T SORT</div>' : ''}`

// The real Orders.svelte, highlighted by hand; App.svelte in the app.
const CODE13 = [
  '&lt;<span class="k">script</span> lang=<span class="s">"ts"</span>&gt;',
  '  <span class="k">import</span> { SvGrid } <span class="k">from</span> <span class="s">\'@svgrid/grid\'</span>',
  '  <span class="k">import</span> <span class="s">\'@svgrid/grid/themes/ember.css\'</span>',
  '  <span class="k">import</span> { orders } <span class="k">from</span> <span class="s">\'./orders.js\'</span>',
  '  <span class="k">const</span> columns = [',
  "    { field: <span class=\"s\">'id'</span>, header: <span class=\"s\">'Order'</span> },",
  "    { field: <span class=\"s\">'customer'</span>, header: <span class=\"s\">'Customer'</span> },",
  "    { field: <span class=\"s\">'status'</span>, header: <span class=\"s\">'Status'</span> },",
  "    { field: <span class=\"s\">'total'</span>, header: <span class=\"s\">'Total'</span>,",
  "      cellDataType: <span class=\"s\">'number'</span>, format: { type: <span class=\"s\">'currency'</span> } },",
  '  ]',
  '&lt;/<span class="k">script</span>&gt;',
  '',
  '&lt;<span class="f">SvGrid</span> data={orders} {columns}',
  '  sortable filterable pageable fitColumns',
  '  pageSize={8} containerHeight={400} /&gt;',
]
function checkHtml(t) {
  const a = T.check[0]
  let h = ''
  const first = `<div class="tool"><div class="hd">svgrid · <b>svgrid_check_code</b> Orders.svelte</div><span class="bad">✗ line 9: \`type\` is not a SvGrid column key.<br>&nbsp;&nbsp;Use \`cellDataType\`.</span></div>`
  const second = `<div class="tool"><div class="hd">svgrid · <b>svgrid_check_code</b> Orders.svelte</div><span class="ok">✓ Clean against @svgrid/grid@3.0.16.</span></div>`
  if (t < a + 2.6) h = `<div class="chat" style="height:100%"><div class="bar"><i></i>Claude</div><div class="body">${t >= a + 0.2 ? first : ''}${t >= a + 1.5 ? second : ''}</div></div>`
  else {
    const shown = Math.ceil(CODE13.length * seg(t, a + 2.6, a + 3.6))
    h = `<span class="hd">Orders.svelte · <b>13 lines</b> · checked</span>\n` + CODE13.slice(0, shown).join('\n')
  }
  return h
}
let PAYOFF = { frames: [], fps: 30, version: '' }
window.__setPayoff = (p) => { PAYOFF = p }
let lastPayoff = -1
function setPayoffFrame(t) {
  if (!PAYOFF.frames.length) return
  const i = clamp(Math.floor((t - T.payoff[0]) * PAYOFF.fps), 0, PAYOFF.frames.length - 1)
  if (i !== lastPayoff) { $('payoffImg').src = PAYOFF.frames[i]; lastPayoff = i }
  $('badge').innerHTML = `Orders.svelte: <b>13 lines</b> · @svgrid/grid ${PAYOFF.version}`
}

/* ============================================================ tick */
function blink(t, period, offset) {
  const p = ((t + offset) % period) / period
  const w = 0.16 / period
  return p < w ? Math.sin((p / w) * Math.PI) : 0
}
function zazoMood(t) {
  if (inB(t, 'gen')) return 'up'
  if (inB(t, 'lines') || inB(t, 'extra')) return 'flat'
  if (inB(t, 'nosort') || inB(t, 'sorry')) return 'down'
  if (inB(t, 'stop')) return 'down'
  if (inB(t, 'payoff')) return 'grin'
  if (inB(t, 'sus')) return 'sus'
  if (inB(t, 'joke')) return t > AT.joke + 2.2 ? 'grin' : 'sus'
  if (inB(t, 'check')) return 'smile'
  return 'smile'
}
function claudeMood(t) {
  if (inB(t, 'gen') || inB(t, 'extra')) return 'delight'
  if (inB(t, 'lines')) return 'delight'
  if (inB(t, 'nosort') || inB(t, 'stop')) return 'shock'
  if (inB(t, 'sorry')) return 'shock'
  if (inB(t, 'docs')) return 'sheepish'
  if (inB(t, 'check') || inB(t, 'payoff')) return 'proud'
  if (inB(t, 'sus')) return 'nervous'
  if (inB(t, 'joke')) return t > AT.joke + 2.4 ? 'wink' : 'proud'
  return 'idle'
}

function tick(t) {
  const ending = t >= T.outro[0]
  setVis($('end'), ending)

  /* --- the monitor --- */
  const payoffOn = t >= T.payoff[0] && !ending
  const brokenOn = inB(t, 'nosort')
  const codeOn = inB(t, 'check')
  setVis($('lChat'), !payoffOn && !brokenOn && !codeOn)
  setVis($('lBroken'), brokenOn)
  setVis($('lCode'), codeOn)
  setVis($('payoff'), payoffOn)
  if (!payoffOn && !brokenOn && !codeOn) $('chatBody').innerHTML = chatHtml(t)
  if (brokenOn) $('lBroken').innerHTML = brokenHtml(t)
  if (codeOn) {
    const html = checkHtml(t)
    $('lCode').innerHTML = html
    $('lCode').style.padding = t < T.check[0] + 2.6 ? '0' : ''
    $('lCode').style.whiteSpace = t < T.check[0] + 2.6 ? 'normal' : ''
  }
  if (payoffOn) setPayoffFrame(t)
  // The drawn cursor clicks the broken table's Total header; nothing happens.
  const cur = $('fakeCursor')
  setVis(cur, brokenOn)
  if (brokenOn) {
    const k = easeInOut(seg(t, T.nosort[0], T.nosort[0] + 0.3))
    const press = t >= T.nosort[0] + 0.3 && t < T.nosort[0] + 0.45 ? 0.85 : 1
    cur.style.transform = `translate(${lerp(560, 690, k)}px, ${lerp(400, 54, k)}px) scale(${press})`
  }
  // The check and the payoff get the monitor bigger: both have to be read on a phone.
  const zoomIn = (id) => inB(t, id) ? easeInOut(seg(t, T[id][0], T[id][0] + 0.5)) * (1 - easeInOut(seg(t, T[id][1] - 0.4, T[id][1]))) : 0
  const z = Math.max(zoomIn('check'), zoomIn('payoff'))
  $('monitor').style.transform = `scale(${1 + 0.15 * z}) translateY(${-12 * z}px)`

  /* --- Zazo --- */
  const zm = zazoMood(t)
  const zTalk = mouth('zazo', t)
  show('zBrowN', zm === 'smile' || zm === 'grin' || zm === 'flat')
  show('zBrowDown', zm === 'down')
  show('zBrowUp', zm === 'up')
  show('zBrowSus', zm === 'sus')
  const talking = zTalk > 0.04
  show('zMouthTalk', talking)
  show('zMouthFlat', !talking && (zm === 'flat' || zm === 'down' || zm === 'sus'))
  show('zMouthSmile', !talking && (zm === 'smile' || zm === 'up'))
  show('zMouthGrin', !talking && zm === 'grin')
  $('zMouthTalk').setAttribute('ry', (5 + zTalk * 22).toFixed(1))
  show('zSweat', zm === 'flat' && inB(t, 'extra'))
  const zb = blink(t, 3.1, 0.4)
  const zLid = zm === 'flat' ? -32 : zm === 'sus' ? -38 : zm === 'up' ? -62 : -60
  $('zLidL').setAttribute('transform', `translate(0 ${(zLid + (-zLid) * zb).toFixed(1)})`)
  $('zLidR').setAttribute('transform', `translate(0 ${((zm === 'sus' ? -56 : zLid) + (-(zm === 'sus' ? -56 : zLid)) * zb).toFixed(1)})`)
  // Looks at the screen, or at Claude when Claude talks.
  const lookClaude = mouth('claude', t) > 0.02 || inB(t, 'sus')
  $('zPupils').setAttribute('transform', lookClaude ? 'translate(7 2)' : 'translate(0 -6)')
  const zBob = Math.sin(t * 2.2) * 3 + (talking ? Math.sin(t * 18) * 2 : 0)
  $('zazo').style.transform = `translateY(${zBob.toFixed(1)}px) scale(${talking ? 1.015 : 1})`

  /* --- Claude --- */
  const cm = claudeMood(t)
  const cTalk = mouth('claude', t)
  const cTalking = cTalk > 0.04
  show('cEyesN', cm === 'idle' || cm === 'proud' || cm === 'nervous')
  show('cEyesHappy', cm === 'delight')
  show('cEyesO', cm === 'shock')
  show('cEyesDown', cm === 'sheepish')
  show('cEyesWink', cm === 'wink')
  show('cMouthTalk', cTalking)
  show('cMouthSmile', !cTalking && (cm === 'idle' || cm === 'sheepish'))
  show('cMouthGrin', !cTalking && (cm === 'delight' || cm === 'proud' || cm === 'wink'))
  show('cMouthWavy', !cTalking && (cm === 'nervous' || cm === 'shock'))
  $('cMouthTalk').setAttribute('ry', (6 + cTalk * 26).toFixed(1))
  show('cSweat', cm === 'shock' || cm === 'sheepish' || cm === 'nervous')
  show('cSparks', cm === 'delight' || cm === 'wink')
  $('cSparks').style.opacity = String(0.6 + 0.4 * Math.sin(t * 9))
  $('cPupils').setAttribute('transform', lookClaude ? 'translate(0 0)' : 'translate(-9 2)')
  // Floats; bounces when excited, shrinks a little when sheepish.
  const excited = cm === 'delight' ? Math.abs(Math.sin(t * 7)) * 18 : 0
  const cScale = cm === 'sheepish' ? 0.9 : cm === 'shock' ? 1.05 : 1
  const shake = cm === 'shock' && t < (T.sorry[0] + 1.2) && t > T.sorry[0] ? Math.sin(t * 60) * 4 : 0
  $('claudeWrap').style.transform = `translate(${shake.toFixed(1)}px, ${(Math.sin(t * 2.6) * 10 - excited).toFixed(1)}px) scale(${cScale}) rotate(${(Math.sin(t * 1.7) * 2).toFixed(2)}deg)`

  /* --- captions --- */
  CAPS.forEach(([a, b], i) => {
    const el = $(`cap${i}`)
    const on = t >= a && t < b
    setVis(el, on)
    if (!on) return
    const k = easeOut(seg(t, a, a + 0.3))
    el.style.opacity = k
    el.style.transform = `translateY(${(1 - k) * 30}px)`
  })

  /* --- transitions --- */
  $('flash').style.opacity = t >= T.payoff[0] && t < T.payoff[0] + 0.25 ? 0.7 * (1 - seg(t, T.payoff[0], T.payoff[0] + 0.25)) : 0
  $('black').style.opacity = t < 0.3 ? 1 - seg(t, 0, 0.3) : t > T.end - 1.0 ? seg(t, T.end - 1.0, T.end - 0.15) : 0
}

window.__seek = (t) => tick(t)
window.__seek(0)

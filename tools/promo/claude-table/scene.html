<!doctype html>
<!--
  "A thousand lines of table" - a ~53-second promo, 1080 x 1920.

  Story: a fresh SvelteKit 3 app needs a table. Claude writes one, about a
  thousand lines. HR wants a tree by manager, and editing: more prompts, more
  code. In testing, opening one branch closes another and edits snap back.
  Asked what to do, Claude says to use a grid that already does this: SvGrid.
  41 lines later the org chart is a tree three levels deep, and an edit sticks.

  The chat and the broken table are cartoons. Real: the `sv create` output and
  the `npm install @svgrid/grid` output on the monitor (both captured from real
  runs), the 41-line page shown, and the payoff footage of that app
  (tutorials-out/app/hr-app) on the published @svgrid/grid.

  Every animation is a pure function of t (window.__seek).
-->

window.__setTimeline = (x) => { T = x; buildCaps() }

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))

const easeInOut = (k) => (k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2)
const easeOut = (k) => 1 - Math.pow(1 - k, 3)
const inT = (t, [a, b]) => t >= a && t < b
const $ = (id) => document.getElementById(id)

const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
const typed = (s, k) => s.slice(0, Math.ceil(s.length * clamp(k)))

/* ============================================================ the cast */

}

}
function ceoSvg() {
  const skin = '#f1c6a8', skinD = '#e0a888', hair = '#d6d3d1', hairD = '#a8a29e'

function skyline() {
  let s = '', x = 0, i = 0
  while (x < 470) {
    const w = 36 + ((i * 29) % 40), h = 60 + ((i * 47) % 100)
    s += `<rect x="${x}" y="${170 - h}" width="${w}" height="${h}" fill="#0a0d1c"/>`

      if (((wx * 7 + wy * 13 + i) % 7) < 2) s += `<rect x="${wx}" y="${wy}" width="5" height="7" fill="#fcd34d" opacity=".7"/>`
    x += w + 4; i++
  }
  return s
}
function logo(size) {

}

function codeStream(t, a, b, fromLines, toLines, file) {
  const k = seg(t, a, b)
  const lines = Math.round(lerp(fromLines, toLines, easeOut(k)))
  const shown = []
  for (let i = Math.max(0, lines - 12); i < lines; i++) shown.push(`<span class="ln">${i + 1}</span>${esc(GEN[i % GEN.length])}`)
  return `<div class="codebox"><div class="hd"><span>${file}</span><b>${lines.toLocaleString('en-US')} lines</b></div><pre>${shown.join('\n')}</pre></div>`
}

/* ============================================================ tick */
function blink(t, period, offset) {
  const p = ((t + offset) % period) / period
  const w = 0.16 / period
  return p < w ? Math.sin((p / w) * Math.PI) : 0
}

function tick(t) {
  const devShot = inT(t, T.s6)
  const ceoShot = inT(t, T.s3) || inT(t, T.s10)
  setVis($('world'), !devShot && !ceoShot && t < T.s11[0])
  setVis($('shotCeo'), ceoShot)
  setVis($('shotDev'), devShot)
  setVis($('end'), t >= T.s11[0])

  /* --- camera --- */
  const mon = [1.25, 0, 60]
  const KEYS = [
    [0, 1.0, 0, 0], [T.s1[1] - 0.8, 1.04, 0, 0], [T.s1[1], ...mon],
    [T.s9[1] - 0.8, ...mon], [T.s9[1], 1.0, 0, 0],
  ]
  let k = 0
  while (k < KEYS.length - 2 && t >= KEYS[k + 1][0]) k++
  const [ta, sa, xa, ya] = KEYS[k], [tb, sb, xb, yb] = KEYS[k + 1]
  const e = easeInOut(seg(t, ta, tb))
  const hits = [T.wrong, T.lost].map((h) => (t > h && t < h + 0.4 ? 12 * Math.exp(-(t - h) * 9) : 0)).reduce((a, b) => a + b, 0)
  $('world').style.transform = `translate(${(lerp(xa, xb, e) + hits * Math.sin(t * 90)).toFixed(1)}px, ${(lerp(ya, yb, e) + hits * Math.cos(t * 70)).toFixed(1)}px) scale(${lerp(sa, sb, e).toFixed(4)})`
  $('back').style.transform = `translateY(${(Math.sin(t * 1.6) * 5).toFixed(1)}px)`

  /* --- the monitor --- */
  const chatOn = inT(t, T.s2) || inT(t, T.s4) || inT(t, T.s7)
  setVis($('lTerm'), t < T.s2[0])
  setVis($('lChat'), chatOn)
  setVis($('lBroken'), inT(t, T.s5))
  setVis($('lInstall'), inT(t, T.s8))
  setVis($('payoff'), t >= T.s9[0])
  if (t < T.s2[0]) $('lTerm').innerHTML = termHtml(SV, t, 0.4, T.s1[1] - 0.3)
  if (chatOn) $('chatBody').innerHTML = chatHtml(t)
  if (inT(t, T.s5)) $('lBroken').innerHTML = brokenHtml(t)
  if (inT(t, T.s8)) $('lInstall').innerHTML = installHtml(t)
  if (t >= T.s9[0]) setPayoffFrame(t)

  /* --- close-up: the developer --- */
  if (devShot) {
    const dart = Math.sign(Math.sin(t * 8)) * 7
    $('devPupils').setAttribute('transform', `translate(${dart} 0)`)
    const b = blink(t, 1.4, 0)
    $('devLidL').setAttribute('transform', `translate(0 ${(-60 + 60 * b).toFixed(1)})`)
    $('devLidR').setAttribute('transform', `translate(0 ${(-60 + 60 * b).toFixed(1)})`)
    const s1 = ((t - T.s6[0]) * 60) % 140, s2 = ((t - T.s6[0] - 0.3) * 50) % 140
    $('sweat1').setAttribute('transform', `translate(0 ${s1.toFixed(1)})`)
    $('sweat2').setAttribute('transform', `translate(0 ${s2.toFixed(1)})`)
    $('dev').style.transformOrigin = '450px 380px'
    $('dev').style.transform = `scale(${lerp(1.0, 1.1, seg(t, T.s6[0], T.s6[1]))}) translateX(${(Math.sin(t * 40) * 2).toFixed(1)}px)`
    const bb = easeOut(seg(t, T.s6[0] + 0.2, T.s6[0] + 0.45))
    setVis($('devBubble'), t >= T.s6[0] + 0.2)
    $('devBubble').style.transform = `scale(${bb})`
  }

  /* --- close-up: the CEO --- */
  if (ceoShot) {
    const late = t >= T.s10[0]
    setVis($('ceoBrowSkeptic'), !late); setVis($('ceoBrowHappy'), late)
    setVis($('ceoMouthFlat'), !late); setVis($('ceoMouthSmile'), late)
    const b = blink(t, 2.6, 0.3)
    const narrow = late ? 0 : 12 * seg(t, T.s3[0] + 0.2, T.s3[1] - 0.4)
    $('ceoLidL').setAttribute('transform', `translate(0 ${(-44 + narrow + 44 * b).toFixed(1)})`)
    $('ceoLidR').setAttribute('transform', `translate(0 ${(-44 + narrow + 44 * b).toFixed(1)})`)
    const push = late ? lerp(1.0, 1.06, seg(t, T.s10[0], T.s10[1])) : lerp(1.0, 1.1, easeInOut(seg(t, T.s3[0], T.s3[1])))

    $('ceo').style.transform = `scale(${push}) translateY(${(Math.sin(t * 1.8) * 3).toFixed(1)}px)`
    const b1 = easeOut(seg(t, T.s3[0] + 0.3, T.s3[0] + 0.55))
    setVis($('ceoBubble1'), !late && t >= T.s3[0] + 0.3)
    $('ceoBubble1').style.transform = `scale(${b1})`
    const b2 = easeOut(seg(t, T.s10[0] + 0.3, T.s10[0] + 0.55))
    setVis($('ceoBubble2'), late && t >= T.s10[0] + 0.3)
    $('ceoBubble2').style.transform = `scale(${b2})`
  }

  /* --- captions --- */
  CAPS.forEach(([a, b], i) => {
    const el = $(`cap${i}`)
    const on = t >= a && t < b
    setVis(el, on)
    if (!on) return
    const k = easeOut(seg(t, a, a + 0.3))
    el.style.opacity = k
    el.style.transform = `translateY(${(1 - k) * 30}px)`
  })

  /* --- transitions --- */
  $('flash').style.opacity = t >= T.s9[0] && t < T.s9[0] + 0.25 ? 0.8 * (1 - seg(t, T.s9[0], T.s9[0] + 0.25)) : 0
  $('black').style.opacity = t < 0.3 ? 1 - seg(t, 0, 0.3) : t > T.end - 1.1 ? seg(t, T.end - 1.1, T.end - 0.2) : 0
}

<!doctype html>
<!--
  "300,000 rows, live" - a ~53-second promo, 1080 x 1920 (Shorts / TikTok / Reels).

  Story: a test and measurement company, a jQWidgets customer, moves to
  Svelte. Its results grid holds 300,000 records grouped by station, and
  every second 600 arrive, 600 leave and 3,000 change. Grid A freezes, grid B
  loses its groups, grid C runs the tab out of memory. SvGrid holds it.

  The failed grids are unnamed cartoons. The payoff is real footage: a Vite +
  Svelte 5 app on the published @svgrid/grid (tutorials-out/app/tm-bench)
  doing exactly that, with what it measured printed on every frame.

  Every animation is a pure function of t (window.__seek), so render.mjs can
  step it frame by frame.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=block" />
<style>
  :root { --bg: #0b0908; --fg: #fafaf9; --orange: #ff5a1f; --red: #ef4444; --green: #22c55e; --scope: #4ade80; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, system-ui, sans-serif; font-variant-ligatures: none; }
  .abs { position: absolute; }
  #frame { position: absolute; inset: 0; overflow: hidden; }

  /* ---------- the lab (wide shots) ---------- */
  #world { position: absolute; inset: 0; transform-origin: 540px 670px; }
  .wall { position: absolute; inset: -1400px; background: linear-gradient(#141b26 0, #141b26 1400px, #0e131b 2600px, #0a0d12); }
  .rack { position: absolute; top: 150px; width: 250px; height: 830px; background: linear-gradient(90deg, #1f2937, #273244 50%, #1f2937); border-radius: 8px; box-shadow: 0 20px 50px #000a, inset 0 0 0 3px #111827; }
  .unit { position: absolute; left: 14px; right: 14px; background: #111827; border-radius: 6px; border: 2px solid #374151; }
  .unit canvas, .unit svg { position: absolute; inset: 8px; }
  .led { position: absolute; width: 10px; height: 10px; border-radius: 50%; }
  .desk { position: absolute; left: -60px; right: -60px; top: 1010px; height: 380px; background: linear-gradient(#3a3f4a, #2a2e36 60%, #1e2127); box-shadow: 0 -6px 0 #4b5160 inset; }
  #screen { position: absolute; left: 290px; top: 470px; width: 500px; height: 461px; background: #0c0a09; border-radius: 6px; overflow: hidden; box-shadow: 0 0 0 14px #1c1917, 0 0 0 16px #2b2622, 0 0 120px 30px rgba(120,180,255,.08); }
  .stand { position: absolute; left: 470px; top: 945px; width: 140px; height: 70px; background: linear-gradient(#292524, #1c1917); clip-path: polygon(35% 0, 65% 0, 100% 100%, 0 100%); }
  .mug { position: absolute; left: 150px; top: 1040px; width: 90px; height: 100px; background: #e7e5e4; border-radius: 6px 6px 22px 22px; }
  .mug::after { content: ''; position: absolute; right: -34px; top: 22px; width: 34px; height: 46px; border: 10px solid #e7e5e4; border-left: 0; border-radius: 0 24px 24px 0; }
  #back { position: absolute; left: -60px; top: 1110px; width: 760px; }

  /* ---------- monitor contents ---------- */
  .layer { position: absolute; inset: 0; }
  .spec { background: #0c0a09; padding: 30px 30px; font: 600 20px/1.5 'JetBrains Mono'; color: #d6d3d1; }
  .spec h3 { font: 800 26px Inter; color: #fafaf9; margin-bottom: 18px; }
  .spec .row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #292524; }
  .spec .row b { color: var(--orange); }
  .spec .feed { margin-top: 18px; font-size: 16px; color: #78716c; white-space: pre; }
  .spec .feed .add { color: var(--green); } .spec .feed .del { color: var(--red); } .spec .feed .upd { color: #fbbf24; }
  .fail { background: #f5f5f4; color: #1c1917; font: 500 15px Inter; }
  .fail .tag { position: absolute; left: 14px; top: 12px; font: 800 20px Inter; background: #1c1917; color: #fff; padding: 4px 12px; border-radius: 8px; z-index: 3; }
  .fail table { width: 100%; border-collapse: collapse; margin-top: 54px; }
  .fail th { text-align: left; padding: 6px 12px; background: #e7e5e4; font-weight: 700; color: #57534e; }
  .fail td { padding: 5px 12px; border-bottom: 1px solid #e7e5e4; }
  .fail .grp td { background: #fafaf9; font-weight: 700; }
  .veil { position: absolute; inset: 0; background: rgba(120,113,108,.35); }
  .dialog { position: absolute; left: 40px; right: 40px; top: 120px; background: #fff; border-radius: 14px; box-shadow: 0 20px 60px #0006; padding: 24px 26px 20px; z-index: 4; }
  .dialog b { font-size: 24px; font-weight: 800; display: block; }
  .dialog p { margin-top: 10px; font-size: 17px; color: #57534e; line-height: 1.35; }
  .stamp { position: absolute; right: 18px; bottom: 18px; font: 900 34px Inter; color: var(--red); border: 5px solid var(--red); border-radius: 12px; padding: 4px 14px; transform: rotate(-8deg); background: rgba(255,255,255,.85); z-index: 5; }
  .oom { position: absolute; inset: 0; background: #202124; color: #e8eaed; display: flex; flex-direction: column; justify-content: center; padding: 40px; z-index: 4; }
  .oom b { font: 700 26px Inter; margin-top: 18px; }
  .oom p { margin-top: 10px; font: 500 17px Inter; color: #9aa0a6; }
  .code { background: #0c0a09; font: 600 19px/1.6 'JetBrains Mono'; padding: 26px 26px; color: #e7e5e4; white-space: pre; }
  .code .file { color: #78716c; font-size: 16px; }
  .code .k { color: #c084fc; } .code .s { color: #86efac; } .code .f { color: #fbbf24; }
  #payoff { background: #0c0a09; }
  #payoff img { width: 100%; height: 100%; object-fit: cover; object-position: left top; display: block; }
  .badge { position: absolute; left: 10px; right: 10px; bottom: 10px; font: 700 15px 'JetBrains Mono'; color: #fff; background: rgba(12,10,9,.92); border: 2px solid var(--green); border-radius: 10px; padding: 8px 12px; line-height: 1.45; }
  .badge b { color: var(--green); }

  /* ---------- close-ups ---------- */
  .shot { position: absolute; inset: 0; overflow: hidden; }
  .bokeh { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 30%, #1d2838, #0a0d12 70%); }
  .bokeh i { position: absolute; border-radius: 50%; background: radial-gradient(rgba(120,180,255,.22), transparent 70%); }
  .bubble { position: absolute; background: #fff; color: #0c0a09; font-weight: 900; border-radius: 30px; padding: 26px 34px; box-shadow: 0 12px 0 #0005; transform-origin: 20% 100%; line-height: 1.05; }
  .bubble::after { content: ''; position: absolute; bottom: -30px; left: 80px; border: 18px solid transparent; border-top: 30px solid #fff; border-bottom: 0; }

  /* ---------- captions ---------- */
  .cap { position: absolute; left: 72px; right: 72px; top: 118px; font-weight: 900; font-size: 84px; line-height: 1.0; letter-spacing: -.035em; text-shadow: 0 4px 30px #000; }
  .cap small { display: block; font-size: 52px; font-weight: 800; color: #e7e5e4; margin-top: 16px; letter-spacing: -.02em; }
  .cap em { font-style: normal; color: var(--orange); }
  .cap .r { color: var(--red); }
  .cap .g { color: var(--green); }

  /* ---------- end card ---------- */
  #end { background: var(--bg); }
  #end .card { position: absolute; left: 72px; right: 72px; top: 540px; }
  #end .logo { display: flex; align-items: center; gap: 26px; font-size: 118px; font-weight: 900; letter-spacing: -.04em; }
  #end .logo i { font-style: normal; color: var(--orange); }
  #end h2 { font-size: 86px; line-height: 1.02; font-weight: 900; letter-spacing: -.035em; margin-top: 80px; }
  #end h2 em { font-style: normal; color: var(--orange); }
  #end .cmd { display: inline-block; margin-top: 64px; font: 600 44px 'JetBrains Mono'; background: #1c1917; border: 2px solid #292524; border-radius: 18px; padding: 22px 32px; white-space: nowrap; }
  #end .url { margin-top: 46px; font-size: 54px; font-weight: 800; color: #a8a29e; }
  #vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 75% 60% at 50% 48%, transparent 55%, rgba(0,0,0,.55) 100%); }
  #black { position: absolute; inset: 0; background: #000; pointer-events: none; }
  #flash { position: absolute; inset: 0; background: #fff; pointer-events: none; }
</style>
</head>
<body>
<div id="frame">

  <!-- The lab, over the engineer's shoulder -->
  <div id="world">
    <div class="wall"></div>
    <div class="rack" style="left:20px">
      <div class="unit" style="top:20px;height:190px"><svg id="scope" viewBox="0 0 206 160" preserveAspectRatio="none"></svg></div>
      <div class="unit" style="top:225px;height:150px"><svg id="spectrum" viewBox="0 0 206 120" preserveAspectRatio="none"></svg></div>
      <div class="unit" style="top:390px;height:120px"><svg id="dmm" viewBox="0 0 206 90"></svg></div>
      <div class="unit" style="top:525px;height:280px"><svg id="leds1" viewBox="0 0 206 250"></svg></div>
    </div>
    <div class="rack" style="right:20px">
      <div class="unit" style="top:20px;height:150px"><svg id="spectrum2" viewBox="0 0 206 120" preserveAspectRatio="none"></svg></div>
      <div class="unit" style="top:185px;height:190px"><svg id="scope2" viewBox="0 0 206 160" preserveAspectRatio="none"></svg></div>
      <div class="unit" style="top:390px;height:415px"><svg id="leds2" viewBox="0 0 206 380"></svg></div>
    </div>
    <div id="screen">
      <div class="layer spec" id="lSpec"></div>
      <div class="layer fail" id="lFailA"></div>
      <div class="layer fail" id="lFailB"></div>
      <div class="layer fail" id="lFailC"></div>
      <div class="layer code" id="lCode"></div>
      <div class="layer" id="payoff"><img id="payoffImg" alt="" /><div class="badge" id="badge"></div></div>
    </div>
    <div class="stand"></div>
    <div class="desk"></div>
    <div class="mug"></div>
    <svg id="back" viewBox="0 0 760 820"></svg>
  </div>

  <!-- S2 / S8: the CEO -->
  <div class="shot" id="shotCeo">
    <div class="bokeh" id="bokehCeo"></div>
    <svg class="abs" id="ceo" style="left:90px;top:520px;width:900px" viewBox="0 0 600 640"></svg>
    <div class="bubble" id="ceoBubble1" style="left:60px;top:300px;font-size:54px">We're moving to Svelte.<br>300,000 records. Live.<br>Grouped by station.</div>
    <div class="bubble" id="ceoBubble2" style="left:120px;top:440px;font-size:72px">That's our grid.</div>
  </div>

  <!-- S5: the developer -->
  <div class="shot" id="shotDev">
    <div class="bokeh" id="bokehDev"></div>
    <svg class="abs" id="dev" style="left:90px;top:470px;width:900px" viewBox="0 0 400 520"></svg>
  </div>

  <div id="end" class="shot">
    <div class="card">
      <div class="logo" id="logo"></div>
      <h2>300,000 rows.<br><em>Live. Grouped.</em></h2>
      <div class="cmd">npm install @svgrid/grid</div>
      <div class="url">svgrid.com</div>
    </div>
  </div>

  <div id="vignette"></div>
  <div id="caps"></div>
  <div id="flash"></div>
  <div id="black"></div>
</div>

<script>
/* =============================================================== timing */
let T = {
  s1: [0, 6.2], s2: [6.2, 13.3], s3: [13.3, 20.5], s4: [20.5, 28.5], s5: [28.5, 31.2],
  s6: [31.2, 34.6], s7: [34.6, 44.1], s8: [44.1, 47.1], s9: [47.1, 52.8],
  failA: 23.6, failB: 25.2, failC: 26.6, end: 52.8,
}
window.__setTimeline = (x) => { T = x; buildCaps() }

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const lerp = (a, b, k) => a + (b - a) * k
const easeInOut = (k) => (k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2)
const easeOut = (k) => 1 - Math.pow(1 - k, 3)
const inT = (t, [a, b]) => t >= a && t < b
const $ = (id) => document.getElementById(id)
const setVis = (el, on) => { el.style.display = on ? '' : 'none' }
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')

/* ============================================================ the cast */
function devSvg() {
  const skin = '#8d5a3b', skinD = '#74472d', hair = '#1b1210', hood = '#0f766e', hoodD = '#0b5a54'
  const curls = []
  for (const [x, y, r] of [[120,150,46],[160,118,50],[210,104,54],[262,116,50],[300,150,46],[316,196,36],[104,196,36],[146,96,34],[236,84,36],[280,100,30]])
    curls.push(`<circle cx="${x}" cy="${y}" r="${r}" fill="${hair}"/>`)
  return `
  <defs>
    <clipPath id="devEyeL"><ellipse cx="170" cy="230" rx="24" ry="26"/></clipPath>
    <clipPath id="devEyeR"><ellipse cx="250" cy="230" rx="24" ry="26"/></clipPath>
  </defs>
  <path d="M70 520 q10 -150 140 -160 q130 10 140 160 z" fill="${hood}"/>
  <path d="M200 360 q-60 10 -80 60 M210 360 q60 10 80 60" stroke="${hoodD}" stroke-width="10" fill="none"/>
  <path d="M180 372 l-6 80 M240 372 l6 80" stroke="#e7e5e4" stroke-width="7" stroke-linecap="round"/>
  <rect x="178" y="300" width="64" height="70" rx="22" fill="${skinD}"/>
  <ellipse cx="110" cy="240" rx="20" ry="30" fill="${skin}"/><ellipse cx="310" cy="240" rx="20" ry="30" fill="${skin}"/>
  <ellipse cx="210" cy="230" rx="100" ry="112" fill="${skin}"/>
  <path d="M120 270 q90 80 180 0 q-10 60 -90 70 q-80 -10 -90 -70z" fill="${skinD}" opacity=".35"/>
  ${curls.join('')}
  <path d="M100 210 q110 -190 220 0" fill="none" stroke="#27272a" stroke-width="12"/>
  <rect x="86" y="206" width="30" height="58" rx="12" fill="#27272a"/><rect x="304" y="206" width="30" height="58" rx="12" fill="#27272a"/>
  <path d="M104 262 q8 70 86 58" fill="none" stroke="#27272a" stroke-width="7"/><circle cx="192" cy="320" r="9" fill="#27272a"/>
  <g id="devEyes">
    <ellipse cx="170" cy="230" rx="24" ry="26" fill="#fff"/><ellipse cx="250" cy="230" rx="24" ry="26" fill="#fff"/>
    <g id="devPupils"><circle cx="172" cy="232" r="12" fill="#3b2314"/><circle cx="252" cy="232" r="12" fill="#3b2314"/>
      <circle cx="176" cy="227" r="4" fill="#fff"/><circle cx="256" cy="227" r="4" fill="#fff"/></g>
    <g clip-path="url(#devEyeL)"><rect id="devLidL" x="140" y="200" width="60" height="60" fill="${skin}"/></g>
    <g clip-path="url(#devEyeR)"><rect id="devLidR" x="220" y="200" width="60" height="60" fill="${skin}"/></g>
  </g>
  <rect x="136" y="198" width="70" height="64" rx="22" fill="none" stroke="#111" stroke-width="7"/>
  <rect x="214" y="198" width="70" height="64" rx="22" fill="none" stroke="#111" stroke-width="7"/>
  <path d="M206 224 h8" stroke="#111" stroke-width="7"/>
  <path id="devGlint" d="M150 214 l14 -10" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".7"/>
  <g id="devBrowDet"><path d="M140 172 L196 190" stroke="${hair}" stroke-width="11" stroke-linecap="round"/><path d="M280 172 L224 190" stroke="${hair}" stroke-width="11" stroke-linecap="round"/></g>
  <path id="devMouthDet" d="M184 298 q26 -6 52 0" fill="none" stroke="#3b1408" stroke-width="8" stroke-linecap="round"/>`
}

function backSvg() {
  const hair = '#1b1210', hood = '#0f766e', hoodD = '#0b5a54'
  const curls = []
  for (const [x, y, r] of [[250,250,70],[320,200,80],[400,190,84],[480,210,76],[530,270,66],[220,320,58],[560,340,56],[300,300,80],[440,280,90],[370,330,80]])
    curls.push(`<circle cx="${x}" cy="${y}" r="${r}" fill="${hair}"/>`)
  return `
  <path d="M20 820 q30 -300 370 -330 q340 30 370 330 z" fill="${hood}"/>
  <path d="M230 520 q160 60 320 0" stroke="${hoodD}" stroke-width="16" fill="none"/>
  <rect x="320" y="400" width="140" height="110" rx="40" fill="#74472d"/>
  ${curls.join('')}
  <path d="M190 300 q200 -260 400 0" fill="none" stroke="#27272a" stroke-width="18"/>
  <rect x="168" y="290" width="44" height="86" rx="18" fill="#27272a"/><rect x="568" y="290" width="44" height="86" rx="18" fill="#27272a"/>`
}

function ceoSvg() {
  const skin = '#f1c6a8', skinD = '#e0a888', hair = '#d6d3d1', hairD = '#a8a29e'
  return `
  <defs>
    <clipPath id="ceoEyeL"><ellipse cx="258" cy="250" rx="22" ry="22"/></clipPath>
    <clipPath id="ceoEyeR"><ellipse cx="342" cy="250" rx="22" ry="22"/></clipPath>
  </defs>
  <path d="M60 640 q20 -190 240 -200 q220 10 240 200 z" fill="#1e293b"/>
  <path d="M250 450 l50 120 l50 -120 z" fill="#f8fafc"/>
  <path d="M230 450 l70 150 l-110 -10 z M370 450 l-70 150 l110 -10 z" fill="#0f172a"/>
  <rect x="264" y="370" width="72" height="80" rx="26" fill="${skinD}"/>
  <path d="M150 300 q-30 -210 150 -220 q180 10 150 220 q-10 60 -40 80 l0 -150 q-110 -40 -220 0 l0 150 q-30 -20 -40 -80z" fill="${hair}"/>
  <ellipse cx="300" cy="260" rx="108" ry="124" fill="${skin}"/>
  <path d="M200 300 q100 90 200 0 q-10 70 -100 80 q-90 -10 -100 -80z" fill="${skinD}" opacity=".35"/>
  <path d="M192 160 q108 -90 216 0 q-20 -10 -40 30 q-60 -50 -150 -10 q-10 -30 -26 -20z" fill="${hair}"/>
  <path d="M220 130 q80 -40 160 0" fill="none" stroke="${hairD}" stroke-width="5"/>
  <circle cx="190" cy="300" r="11" fill="#fafaf9"/><circle cx="410" cy="300" r="11" fill="#fafaf9"/>
  <g><ellipse cx="258" cy="250" rx="22" ry="22" fill="#fff"/><ellipse cx="342" cy="250" rx="22" ry="22" fill="#fff"/>
    <g id="ceoPupils"><circle cx="260" cy="252" r="11" fill="#1e3a8a"/><circle cx="344" cy="252" r="11" fill="#1e3a8a"/>
      <circle cx="263" cy="248" r="4" fill="#fff"/><circle cx="347" cy="248" r="4" fill="#fff"/></g>
    <g clip-path="url(#ceoEyeL)"><rect id="ceoLidL" x="230" y="220" width="60" height="60" fill="${skin}"/></g>
    <g clip-path="url(#ceoEyeR)"><rect id="ceoLidR" x="314" y="220" width="60" height="60" fill="${skin}"/></g>
  </g>
  <g id="ceoBrowSkeptic"><path d="M226 218 L284 222" stroke="#57534e" stroke-width="9" stroke-linecap="round"/><path d="M318 212 q30 -26 58 -6" fill="none" stroke="#57534e" stroke-width="9" stroke-linecap="round"/></g>
  <g id="ceoBrowHappy"><path d="M228 206 q28 -22 56 -6" fill="none" stroke="#57534e" stroke-width="9" stroke-linecap="round"/><path d="M316 200 q28 -20 56 6" fill="none" stroke="#57534e" stroke-width="9" stroke-linecap="round"/></g>
  <path d="M296 260 q-10 40 6 46" fill="none" stroke="${skinD}" stroke-width="6" stroke-linecap="round"/>
  <path id="ceoMouthFlat" d="M268 330 q32 -8 64 4" fill="none" stroke="#9f1239" stroke-width="9" stroke-linecap="round"/>
  <g id="ceoMouthSmile"><path d="M262 318 q38 46 76 0 z" fill="#7f1d1d"/><path d="M272 322 q28 12 56 0" fill="#fff"/></g>
  <g id="ceoArmsCrossed">
    <path d="M90 560 q120 -40 330 -10 q30 10 20 40 q-200 -20 -330 20 q-30 -20 -20 -50z" fill="#1e293b"/>
    <path d="M510 560 q-120 -40 -330 -10 q-30 10 -20 40 q200 -20 330 20 q30 -20 20 -50z" fill="#243245"/>
    <ellipse cx="160" cy="566" rx="30" ry="24" fill="${skin}"/><ellipse cx="440" cy="566" rx="30" ry="24" fill="${skin}"/>
  </g>`
}

function logo(size) {
  const cols = [{ x: 4, w: 6 }, { x: 11, w: 4 }, { x: 16, w: 4 }]
  let r = ''
  for (const c of cols) r += `<rect x="${c.x}" y="4" width="${c.w}" height="4" rx="1.2" fill="#fafaf9" opacity="0.9"/>`
  r += `<path d="M16.9 5.4 L19.1 5.4 L18 6.9 Z" fill="#ff5a1f"/>`
  for (const y of [9, 13, 17]) cols.forEach((c, i) => (r += `<rect x="${c.x}" y="${y}" width="${c.w}" height="3" rx="0.9" fill="${i === 2 ? '#ff5a1f' : '#fafaf9'}" opacity="${i === 2 ? 1 : 0.32}"/>`))
  return `<svg viewBox="0 0 24 24" width="${size}" height="${size}">${r}</svg><span><i>Sv</i>Grid</span>`
}

$('dev').innerHTML = devSvg()
$('back').innerHTML = backSvg()
$('ceo').innerHTML = ceoSvg()
$('logo').innerHTML = logo(126)
for (const id of ['bokehCeo', 'bokehDev']) {
  $(id).innerHTML = Array.from({ length: 14 }, (_, i) => {
    const r = 40 + ((i * 53) % 90)
    return `<i style="left:${(i * 173) % 1080 - r}px;top:${(i * 311) % 1500 + 200}px;width:${r * 2}px;height:${r * 2}px"></i>`
  }).join('')
}

/* ============================================ the instruments on the racks */
function scope(id, t, f, ph) {
  let d = ''
  for (let x = 0; x <= 206; x += 3) {
    const y = 80 - 52 * Math.sin((x / 206) * Math.PI * 2 * f + t * 6 + ph) * (0.7 + 0.3 * Math.sin(t * 1.3 + x / 40))
    d += `${x ? 'L' : 'M'}${x} ${y.toFixed(1)}`
  }
  let grid = ''
  for (let x = 0; x <= 206; x += 41) grid += `<line x1="${x}" y1="0" x2="${x}" y2="160" stroke="#14532d" stroke-width="1"/>`
  for (let y = 0; y <= 160; y += 40) grid += `<line x1="0" y1="${y}" x2="206" y2="${y}" stroke="#14532d" stroke-width="1"/>`
  $(id).innerHTML = `<rect width="206" height="160" fill="#03140a"/>${grid}<path d="${d}" fill="none" stroke="#4ade80" stroke-width="2.5"/>`
}
function spectrum(id, t, seedOff) {
  let s = '<rect width="206" height="120" fill="#06101c"/>'
  for (let i = 0; i < 26; i++) {
    const h = 20 + 80 * Math.abs(Math.sin(i * 0.7 + t * 3 + seedOff) * Math.cos(i * 0.31 + t * 1.7))
    s += `<rect x="${i * 8}" y="${120 - h}" width="6" height="${h}" fill="#38bdf8" opacity="${0.5 + 0.5 * (h / 100)}"/>`
  }
  $(id).innerHTML = s
}
function leds(id, t, rows, off) {
  let s = ''
  for (let r = 0; r < rows; r++) for (let c = 0; c < 8; c++) {
    const on = Math.sin(t * 5 + r * 1.7 + c * 2.3 + off) > 0.2
    const col = (r * 8 + c) % 11 === 0 ? '#f59e0b' : '#22c55e'
    s += `<circle cx="${16 + c * 25}" cy="${16 + r * 30}" r="6" fill="${on ? col : '#1f2937'}"/>`
  }
  $(id).innerHTML = s
}

/* ========================================================= captions */
let CAPS = []
function buildCaps() {
  CAPS = [
    [T.s1[0] + 0.3, T.s1[1], 'A test and measurement<br>company.<small>A <em>jQWidgets</em> customer for years.</small>'],
    [T.s2[0] + 0.1, T.s2[1], 'New app.<small>In <em>Svelte</em> this time.</small>'],
    [T.s3[0] + 0.1, T.s3[1], 'Every second:<small><span class="g">+600</span> in. <span class="r">-600</span> out. <em>3,000</em> updates.</small>'],
    [T.s4[0] + 0.1, T.s4[1], 'Grid after grid.<small><span class="r">None of them held.</span></small>'],
    [T.s5[0] + 0.1, T.s5[1], 'Then:<small><em>SvGrid.</em></small>'],
    [T.s7[0] + 0.1, T.s7[1], '300,000 rows.<small>Grouped. Live. <span class="g">Smooth.</span></small>'],
    [T.s8[0] + 0.1, T.s8[1], '<span class="g">Rolled out.</span>'],
  ]
  $('caps').innerHTML = CAPS.map((c, i) => `<div class="cap" id="cap${i}">${c[2]}</div>`).join('')
}
buildCaps()

/* ============================================== the requirement, counting */
function specHtml(t) {
  const k = seg(t, T.s3[0] + 0.3, T.s3[1] - 0.6)
  const sec = Math.floor((t - T.s3[0]) * 2)
  const lines = []
  for (let i = 0; i < 7; i++) {
    const n = sec - i
    if (n < 0) continue
    const kind = (n * 7) % 3
    lines.push(kind === 0 ? `<span class="add">+ STN-${String(1 + (n * 5) % 24).padStart(2, '0')}  CH${1 + n % 8}  Ripple  ${(11 + (n % 7) * 0.31).toFixed(2)} mV</span>`
      : kind === 1 ? `<span class="del">- STN-${String(1 + (n * 11) % 24).padStart(2, '0')}  CH${1 + (n * 3) % 8}  oldest result removed</span>`
      : `<span class="upd">~ STN-${String(1 + (n * 7) % 24).padStart(2, '0')}  CH${1 + (n * 5) % 8}  ${(3.3 + (n % 5) * 0.01).toFixed(3)} V  Pass</span>`)
  }
  return `<h3>Results grid: requirements</h3>
    <div class="row"><span>Records held</span><b>${Math.round(300000 * easeOut(k)).toLocaleString('en-US')}</b></div>
    <div class="row"><span>Grouped by</span><b>station</b></div>
    <div class="row"><span>New results / s</span><b>+600</b></div>
    <div class="row"><span>Removed / s</span><b>-600</b></div>
    <div class="row"><span>Updated / s</span><b>3,000</b></div>
    <div class="feed">${lines.join('\n')}</div>`
}

/* ============================================ the three grids that failed */
const STATIONS = ['Station 01', 'Station 02', 'Station 03', 'Station 04']
function tableRows(t, jitter) {
  let s = '<tr><th>Station</th><th>Test</th><th>Value</th><th>Status</th></tr>'
  for (let g = 0; g < 2; g++) {
    s += `<tr class="grp"><td colspan="4">▾ ${STATIONS[g]} (12,4${10 + g * 7} rows)</td></tr>`
    for (let r = 0; r < 4; r++) s += `<tr><td>${STATIONS[g]}</td><td>${['Ripple', 'Supply voltage', 'Rise time', 'Temperature'][r]}</td><td>${(10 + r * 1.37 + jitter).toFixed(3)}</td><td>Pass</td></tr>`
  }
  return s
}
function failA(t) {
  // Grid A: the table is up, then a batch arrives and the tab stops.
  const frozen = t >= T.failA - 0.5
  return `<div class="tag">Grid A</div><table>${tableRows(t, frozen ? 0 : (t * 3) % 1)}</table>
    ${frozen ? `<div class="veil"></div><div class="dialog"><b>Page Unresponsive</b><p>This page has stopped responding. You can wait for it, or exit the page.</p></div>` : ''}
    ${t >= T.failA ? '<div class="stamp">FROZE</div>' : ''}`
}
function failB(t) {
  // Grid B: every batch re-renders from scratch, and the groups come back collapsed and out of order.
  const flick = Math.floor(t * 5) % 2
  let s = '<div class="tag">Grid B</div><table><tr><th>Station</th><th>Test</th><th>Value</th><th>Status</th></tr>'
  if (t < T.failB - 0.5) s += tableRows(t, 0).replace(/^<tr>.*?<\/tr>/, '')
  else {
    const order = flick ? [3, 1, 0, 2] : [1, 3, 2, 0]
    for (const g of order) s += `<tr class="grp"><td colspan="4">▸ ${STATIONS[g]}</td></tr>`
    s += '<tr><td colspan="4" style="color:#b91c1c;font-weight:700">expanded groups reset on update</td></tr>'
  }
  return s + `</table>${t >= T.failB ? '<div class="stamp">LOST GROUPS</div>' : ''}`
}
function failC(t) {
  // Grid C: memory climbs with every batch until the tab dies.
  const mem = Math.round(lerp(1.2, 3.9, seg(t, T.failB + 0.9, T.failC + 0.35)) * 10) / 10
  if (t < T.failC + 0.35) return `<div class="tag">Grid C</div><table>${tableRows(t, 0)}</table><div class="dialog" style="top:auto;bottom:24px;padding:14px 18px"><p style="margin:0;font:700 18px 'JetBrains Mono';color:#b91c1c">tab memory: ${mem} GB and climbing</p></div>`
  return `<div class="tag">Grid C</div><div class="oom"><svg width="56" height="56" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="#9aa0a6" stroke-width="1.6"/><circle cx="9" cy="10" r="1.2" fill="#9aa0a6"/><circle cx="15" cy="10" r="1.2" fill="#9aa0a6"/><path d="M8 16 q4 -3 8 0" stroke="#9aa0a6" stroke-width="1.6" fill="none"/></svg><b>This page ran out of memory.</b><p>Reload to try again.</p></div>${t >= T.failC + 0.45 ? '<div class="stamp">CRASHED</div>' : ''}`
}

/* ======================================================= the code typed */
const CODE = [
  '<span class="file">results.svelte</span>',
  '',
  '&lt;<span class="f">SvGrid</span>',
  '  data={rows} {columns} {features}',
  '  getRowId={(r) =&gt; r.id}',
  '  onApiReady={(api) =&gt;',
  "    api.setGroupBy([<span class=\"s\">'station'</span>])} /&gt;",
  '',
  '<span class="k">// every second, one batch</span>',
  'api.<span class="f">applyTransaction</span>({',
  '  add, remove, update })',
]
function codeHtml(t) {
  const k = seg(t, T.s6[0] + 0.15, T.s6[1] - 0.5)
  const n = Math.ceil(CODE.length * k)
  return CODE.slice(0, n).join('\n')
}

/* ============================================ payoff frames (real) */
let PAYOFF = { frames: [], bench: [], fps: 30 }
window.__setPayoff = (p) => { PAYOFF = p }
let lastPayoff = -1
function setPayoffFrame(t) {
  if (!PAYOFF.frames.length) return
  const i = clamp(Math.floor((t - T.s7[0]) * PAYOFF.fps), 0, PAYOFF.frames.length - 1)
  if (i !== lastPayoff) { $('payoffImg').src = PAYOFF.frames[i]; lastPayoff = i }
  const b = PAYOFF.bench[i]
  if (b) $('badge').innerHTML = `measured in the browser · batch <b>${b.ticks}</b><br><b>${b.held.toLocaleString('en-US')}</b> rows · applied + painted in <b>${b.lastMs} ms</b>`
}

/* ============================================================ tick */
function blink(t, period, offset) {
  const p = ((t + offset) % period) / period
  const w = 0.16 / period
  return p < w ? Math.sin((p / w) * Math.PI) : 0
}

function tick(t) {
  const wide = inT(t, T.s1) || inT(t, T.s3) || inT(t, T.s4) || inT(t, T.s6) || inT(t, T.s7)
  setVis($('world'), wide)
  setVis($('shotCeo'), inT(t, T.s2) || inT(t, T.s8))
  setVis($('shotDev'), inT(t, T.s5))
  setVis($('end'), t >= T.s9[0])

  /* --- camera: wide on the lab, in on the monitor for the story beats --- */
  const mon = [1.55, 0, 120]
  const KEYS = [
    [0, 1.0, 0, 0], [T.s1[1], 1.06, 0, 0],
    [T.s3[0], 1.2, 0, 60], [T.s3[0] + 0.8, ...mon], [T.s4[1], ...mon],
    [T.s6[0], ...mon], [T.s7[1] - 0.8, ...mon], [T.s7[1], 1.0, 0, 0],
  ]
  let k = 0
  while (k < KEYS.length - 2 && t >= KEYS[k + 1][0]) k++
  const [ta, sa, xa, ya] = KEYS[k], [tb, sb, xb, yb] = KEYS[k + 1]
  const e = easeInOut(seg(t, ta, tb))
  // A jolt on each failed grid.
  const hits = [T.failA, T.failB, T.failC].map((h) => (t > h && t < h + 0.4 ? 14 * Math.exp(-(t - h) * 9) : 0)).reduce((a, b) => a + b, 0)
  $('world').style.transform = `translate(${(lerp(xa, xb, e) + hits * Math.sin(t * 90)).toFixed(1)}px, ${(lerp(ya, yb, e) + hits * Math.cos(t * 70)).toFixed(1)}px) scale(${lerp(sa, sb, e).toFixed(4)})`

  /* --- the instruments --- */
  scope('scope', t, 2, 0); scope('scope2', t, 3.5, 1.2)
  spectrum('spectrum', t, 0); spectrum('spectrum2', t, 2.1)
  leds('leds1', t, 8, 0); leds('leds2', t, 12, 3)
  $('dmm').innerHTML = `<rect width="206" height="90" fill="#0b1a10"/><text x="103" y="58" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="34" fill="#4ade80">${(3.3 + 0.004 * Math.sin(t * 4)).toFixed(4)} V</text>`
  $('back').style.transform = `translateY(${(Math.sin(t * 1.6) * 5).toFixed(1)}px)`

  /* --- the monitor --- */
  setVis($('lSpec'), t < T.s4[0])
  setVis($('lFailA'), t >= T.s4[0] && t < T.failA + 0.9)
  setVis($('lFailB'), t >= T.failA + 0.9 && t < T.failB + 0.9)
  setVis($('lFailC'), t >= T.failB + 0.9 && t < T.s6[0])
  setVis($('lCode'), t >= T.s6[0] && t < T.s7[0])
  setVis($('payoff'), t >= T.s7[0])
  if (t < T.s4[0]) $('lSpec').innerHTML = specHtml(t)
  if (t >= T.s4[0] && t < T.failA + 0.9) $('lFailA').innerHTML = failA(t)
  if (t >= T.failA + 0.9 && t < T.failB + 0.9) $('lFailB').innerHTML = failB(t)
  if (t >= T.failB + 0.9 && t < T.s6[0]) $('lFailC').innerHTML = failC(t)
  if (t >= T.s6[0] && t < T.s7[0]) $('lCode').innerHTML = codeHtml(t)
  if (t >= T.s7[0]) setPayoffFrame(t)

  /* --- close-up: the developer --- */
  if (inT(t, T.s5)) {
    const b = 0.2 + 0.8 * blink(t, 2.2, 0)
    $('devLidL').setAttribute('transform', `translate(0 ${(-60 + 60 * b * 0.4).toFixed(1)})`)
    $('devLidR').setAttribute('transform', `translate(0 ${(-60 + 60 * b * 0.4).toFixed(1)})`)
    const z = lerp(1.05, 1.2, easeOut(seg(t, T.s5[0], T.s5[1])))
    $('dev').style.transformOrigin = '450px 380px'
    $('dev').style.transform = `scale(${z})`
  }

  /* --- close-up: the CEO --- */
  if ($('shotCeo').style.display !== 'none') {
    const late = t >= T.s8[0]
    setVis($('ceoBrowSkeptic'), !late); setVis($('ceoBrowHappy'), late)
    setVis($('ceoMouthFlat'), !late); setVis($('ceoMouthSmile'), late)
    const b = blink(t, 2.6, 0.3)
    const narrow = late ? 0 : 12 * seg(t, T.s2[0] + 0.2, T.s2[1] - 0.4)
    $('ceoLidL').setAttribute('transform', `translate(0 ${(-44 + narrow + 44 * b).toFixed(1)})`)
    $('ceoLidR').setAttribute('transform', `translate(0 ${(-44 + narrow + 44 * b).toFixed(1)})`)
    const push = late ? lerp(1.0, 1.06, seg(t, T.s8[0], T.s8[1])) : lerp(1.0, 1.1, easeInOut(seg(t, T.s2[0], T.s2[1])))
    $('ceo').style.transformOrigin = '450px 320px'
    $('ceo').style.transform = `scale(${push}) translateY(${(Math.sin(t * 1.8) * 3).toFixed(1)}px)`
    const b1 = easeOut(seg(t, T.s2[0] + 0.3, T.s2[0] + 0.55))
    setVis($('ceoBubble1'), !late && t >= T.s2[0] + 0.3)
    $('ceoBubble1').style.transform = `scale(${b1})`
    const b2 = easeOut(seg(t, T.s8[0] + 0.3, T.s8[0] + 0.55))
    setVis($('ceoBubble2'), late && t >= T.s8[0] + 0.3)
    $('ceoBubble2').style.transform = `scale(${b2})`
  }

  /* --- captions --- */
  CAPS.forEach(([a, b], i) => {
    const el = $(`cap${i}`)
    const on = t >= a && t < b
    setVis(el, on)
    if (!on) return
    const k = easeOut(seg(t, a, a + 0.3))
    el.style.opacity = k
    el.style.transform = `translateY(${(1 - k) * 30}px)`
  })

  /* --- transitions --- */
  $('flash').style.opacity = t >= T.s7[0] && t < T.s7[0] + 0.25 ? 0.8 * (1 - seg(t, T.s7[0], T.s7[0] + 0.25)) : 0
  $('black').style.opacity = t < 0.3 ? 1 - seg(t, 0, 0.3) : t > T.end - 1.1 ? seg(t, T.end - 1.1, T.end - 0.2) : 0
}

window.__seek = (t) => tick(t)
window.__seek(0)
</script>
</body>
</html>

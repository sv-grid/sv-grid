<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!--
  "SvGrid Studio, a tour": a product overview cut, 1920 x 1080, music only.
  Shot list (SHOTS below) is the single source of timing: render.mjs reads it
  through window.__plan(), records the footage clips at those lengths, then
  seeks this page frame by frame. Every animation is a pure function of t.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=block" />
<style>
  :root {
    --ink: #1c1917; --ink2: #292524; --paper: #ffffff; --band: #fdf3ec; --line: #efdccf;
    --muted: #78716c; --soft: #a8a29e; --orange: #ff3e00;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--paper); color: var(--ink); font-family: Inter, system-ui, sans-serif; font-feature-settings: 'ss01' 1; }
  .shot { position: absolute; inset: 0; display: none; overflow: hidden; }
  .light { background: linear-gradient(160deg, #ffffff 0%, #fffaf6 45%, var(--band) 100%); }
  .dark { background: var(--ink); color: #fafaf9; }
  .blob { position: absolute; border-radius: 50%; filter: blur(80px); opacity: .55; pointer-events: none; }
  .ani { opacity: 0; will-change: transform, opacity; }

  /* logo */
  .logo-wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 34px; }
  .logo-wrap svg { width: 150px; height: 150px; }
  .wordmark { font-size: 116px; font-weight: 700; letter-spacing: -.035em; line-height: 1; }
  .wordmark .sv { color: var(--orange); }
  .wordmark .studio { color: #d6d3d1; font-weight: 500; margin-left: 26px; }

  /* kinetic text, left aligned two-tone */
  .text { position: absolute; left: 190px; right: 190px; top: 50%; transform: translateY(-50%); }
  .text .ln { font-size: 92px; font-weight: 700; letter-spacing: -.035em; line-height: 1.08; }
  .text .ln.small { font-size: 40px; font-weight: 500; letter-spacing: -.01em; line-height: 1.35; margin-top: 34px; }
  .mute { color: var(--soft); }
  em { font-style: normal; color: var(--orange); }

  /* section head used on chips / checks / tiles */
  .head { position: absolute; left: 190px; top: 150px; font-size: 64px; font-weight: 700; letter-spacing: -.03em; line-height: 1.1; max-width: 1400px; }
  .rule { position: absolute; left: 190px; top: 118px; width: 56px; height: 5px; background: var(--orange); border-radius: 3px; }

  .chips { position: absolute; left: 190px; right: 190px; top: 360px; display: flex; flex-wrap: wrap; gap: 22px 22px; }
  .chip { display: inline-flex; align-items: center; gap: 16px; padding: 20px 30px 20px 22px; background: #fff; border: 1px solid var(--line); border-radius: 14px; font-size: 34px; font-weight: 600; box-shadow: 0 10px 30px -18px rgba(120, 60, 20, .35); }
  .chip i { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; font: 700 20px 'JetBrains Mono'; color: #fff; font-style: normal; }

  .proof-top { position: absolute; left: 190px; top: 250px; font-size: 44px; font-weight: 600; color: var(--muted); }
  .proof-big { position: absolute; left: 190px; top: 320px; font-size: 150px; font-weight: 800; letter-spacing: -.045em; line-height: 1; }
  .proof-big small { font-size: 64px; font-weight: 600; color: var(--soft); letter-spacing: -.02em; margin-left: 24px; }
  .names { position: absolute; left: 190px; right: 190px; top: 640px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px 60px; }
  .names span { font-size: 58px; font-weight: 800; letter-spacing: -.02em; color: #57534e; }

  .tiles { position: absolute; left: 190px; right: 190px; top: 330px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; }
  .tile { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 30px 34px; height: 300px; position: relative; box-shadow: 0 16px 40px -26px rgba(120, 60, 20, .45); }
  .tile .n { font: 600 24px 'JetBrains Mono'; color: var(--orange); }
  .tile b { display: block; font-size: 44px; letter-spacing: -.02em; margin-top: 8px; }
  .tile svg { position: absolute; right: 30px; bottom: 26px; width: 210px; height: 140px; }

  /* section title card */
  .t-num { position: absolute; left: 190px; top: 330px; font: 600 40px 'JetBrains Mono'; color: var(--orange); }
  .t-title { position: absolute; left: 186px; top: 390px; font-size: 150px; font-weight: 800; letter-spacing: -.045em; line-height: 1; }
  .t-sub { position: absolute; left: 190px; top: 580px; font-size: 46px; font-weight: 500; color: var(--soft); }
  .t-art { position: absolute; right: 190px; top: 50%; width: 600px; height: 420px; margin-top: -210px; }

  /* footage clip */
  .clip-label { position: absolute; left: 160px; top: 44px; font-size: 40px; font-weight: 700; letter-spacing: -.02em; white-space: nowrap; }
  .clip-label span { color: var(--muted); font-weight: 500; }
  .clip-label span::before { content: ''; display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--orange); margin: 0 18px 7px 20px; }
  .card { position: absolute; left: 160px; top: 120px; width: 1600px; height: 900px; border-radius: 16px; overflow: hidden; background: #fff; border: 1px solid var(--line); box-shadow: 0 40px 80px -40px rgba(90, 40, 10, .45), 0 2px 6px rgba(0, 0, 0, .05); }
  .card img { width: 100%; height: 100%; display: block; transform-origin: 50% 40%; }
  .card .ph { position: absolute; inset: 0; display: grid; place-items: center; font: 600 32px 'JetBrains Mono'; color: var(--soft); background: repeating-linear-gradient(45deg, #fff, #fff 18px, #fbf7f3 18px, #fbf7f3 36px); }

  .checks { position: absolute; left: 190px; right: 190px; top: 330px; display: grid; grid-template-columns: 1fr 1fr; gap: 22px 40px; }
  .check { display: flex; align-items: center; gap: 22px; font-size: 38px; font-weight: 600; letter-spacing: -.01em; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 20px 26px; }
  .check i { flex: none; width: 44px; height: 44px; border-radius: 50%; background: var(--ink); display: grid; place-items: center; }

  /* calls to action */
  .cta-big { position: absolute; left: 190px; right: 190px; top: 340px; font-size: 104px; font-weight: 800; letter-spacing: -.04em; line-height: 1.04; }
  .pill { position: absolute; left: 190px; top: 640px; font: 600 52px 'JetBrains Mono'; color: #fafaf9; border: 2px solid #44403c; border-radius: 16px; padding: 22px 34px; }
  .pill b { color: var(--orange); font-weight: 600; }
  .btn { position: absolute; left: 190px; top: 640px; background: var(--orange); color: #fff; font-size: 50px; font-weight: 500; border-radius: 12px; padding: 26px 48px; }
  .cta-sub { position: absolute; left: 190px; top: 800px; font-size: 40px; font-weight: 500; color: var(--soft); }
</style>
</head>
<body>
<div id="stage"></div>
<script>
// ------------------------------------------------------------------ shots
// dur in seconds. Clip shots name the footage recorder (footage.mjs).
const SHOTS = [
  { id: 'logo', kind: 'logo', dur: 3.4 },
  { id: 'hook', kind: 'text', dur: 6.2, lines: [
    { t: 0.2, html: 'Every internal tool starts' },
    { t: 0.6, html: 'the same way.' },
    { t: 2.1, html: '<span class="mute">Tables in a database, and the</span>' },
    { t: 2.6, html: '<span class="mute">screens to work with them.</span>' },
  ] },
  { id: 'promise', kind: 'text', dur: 5.8, lines: [
    { t: 0.2, html: 'SvGrid Studio designs' },
    { t: 0.6, html: 'those screens and writes' },
    { t: 1.0, html: 'them as a <em>SvelteKit app.</em>' },
  ] },
  { id: 'sources', kind: 'chips', dur: 6.6, head: 'Start from the data you already have.', chips: [
    ['PostgreSQL', '#336791', 'PG'], ['MySQL', '#00758f', 'My'], ['SQL Server', '#a91d22', 'MS'], ['SQLite', '#0f80cc', 'Lt'],
    ['Supabase', '#3ecf8e', 'Sb'], ['Neon', '#00b894', 'Ne'], ['Turso', '#4ff8d2', 'Tu'], ['REST API', '#57534e', '{}'],
    ['OpenAPI', '#6ba539', 'OA'], ['CSV', '#78716c', ',,'], ['Drizzle schema', '#1c1917', 'Dz'], ['Prisma schema', '#2d3748', 'Pr'],
  ] },
  { id: 'proof', kind: 'proof', dur: 6.0 },
  { id: 'tiles', kind: 'tiles', dur: 6.4, head: 'From tables to a running app.' },
  { id: 't-data', kind: 'title', n: '01', title: 'Data model', sub: 'Tables, fields and relationships', art: 'data', dur: 2.7 },
  { id: 'adddata', kind: 'clip', label: 'Data model', cap: 'A database, a CSV, or an OpenAPI spec', dur: 5.0, zoom: [1.8, '64% 10%', 0.9] },
  { id: 'datamodel', kind: 'clip', label: 'Data model', cap: 'Entities and how they relate', dur: 5.4, zoom: [1.3, '50% 42%', 1.0] },
  { id: 't-screens', kind: 'title', n: '02', title: 'Screens', sub: 'Dashboards, grids, boards, record pages', art: 'screens', dur: 2.7 },
  { id: 'overview', kind: 'clip', label: 'Screens', cap: 'Blocks on a canvas, bound to your data', dur: 6.0 },
  { id: 'pipeline', kind: 'clip', label: 'Screens', cap: 'A pipeline board with filters', dur: 5.0 },
  { id: 'forecast', kind: 'clip', label: 'Screens', cap: 'KPIs, charts and a pivot table', dur: 5.0 },
  { id: 'deal360', kind: 'clip', label: 'Screens', cap: 'A record page for every table', dur: 5.0 },
  { id: 't-themes', kind: 'title', n: '03', title: 'Themes', sub: '20 themes, light and dark', art: 'themes', dur: 2.7 },
  { id: 'themes', kind: 'clip', label: 'Themes', cap: 'Restyle the whole app in one click', dur: 7.0 },
  { id: 'dark', kind: 'clip', label: 'Themes', cap: 'Every theme has a dark mode', dur: 4.5 },
  { id: 't-logic', kind: 'title', n: '04', title: 'Logic', sub: 'Typed handlers, in code you own', art: 'logic', dur: 2.7 },
  { id: 'code', kind: 'clip', label: 'Logic', cap: 'Insert an action, keep writing TypeScript', dur: 6.5 },
  { id: 't-preview', kind: 'title', n: '05', title: 'Preview', sub: 'Desktop, tablet and phone', art: 'preview', dur: 2.7 },
  { id: 'preview', kind: 'clip', label: 'Preview', cap: 'Run it the way your users will', dur: 7.0 },
  { id: 't-ship', kind: 'title', n: '06', title: 'Generate and deploy', sub: 'A SvelteKit project, ready for CI', art: 'ship', dur: 2.7 },
  { id: 'generate', kind: 'clip', label: 'Generate', cap: 'Routes, schemas, sign-in, tests, a CI workflow', dur: 7.0, zoom: [1.28, '50% 50%', 1.0] },
  { id: 'deploy', kind: 'clip', label: 'Deploy', cap: 'Vercel, Netlify or Cloudflare', dur: 5.0, zoom: [1.6, '50% 50%', 0.9] },
  { id: 'samples', kind: 'clip', label: 'Sample apps', cap: 'Or start from a finished app', dur: 6.0, zoom: [1.28, '50% 46%', 0.9] },
  { id: 'checks', kind: 'checks', dur: 9.6, head: 'Every generated app comes with', items: [
    'SvelteKit routes and API endpoints', 'Typed schemas, with tests',
    'Sign-in, roles, OAuth and 2FA', 'A Drizzle data layer and migrations',
    'A GitHub Actions CI workflow', 'Deploy to Vercel, Netlify, Cloudflare or Docker',
    'Svelte 5 code you can read and edit', 'An MCP server, so AI agents can build with you',
  ] },
  { id: 'value', kind: 'text', dur: 6.6, lines: [
    { t: 0.2, html: 'Generate the boring parts.' },
    { t: 0.8, html: '<em>Keep the code.</em>' },
    { t: 2.3, cls: 'small', html: '<span class="mute">Every screen is built from SvGrid components,<br>which we build, maintain and support.</span>' },
  ] },
  { id: 'cta1', kind: 'cta', dur: 4.4, big: 'Try SvGrid Studio<br>in your browser.', pill: 'svgrid.com/<b>studio</b>' },
  { id: 'cta2', kind: 'cta', dur: 4.4, big: 'Build your first app<br>this afternoon.', btn: 'Start a 30-day free trial', sub: 'SvGrid Studio is part of SvGrid Enterprise Suite.' },
  { id: 'outro', kind: 'logo', dur: 3.6, outro: true },
]

// ------------------------------------------------------------------ helpers
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const easeOut = (k) => 1 - Math.pow(1 - k, 3)
const easeInOut = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2)
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e }

const LOGO = (size) => {
  const cols = [{ x: 4, w: 6 }, { x: 11, w: 4 }, { x: 16, w: 4 }]
  let s = `<svg viewBox="0 0 24 24" width="${size}" height="${size}"><rect x=".5" y=".5" width="23" height="23" rx="5" fill="#1c1917"/><rect x=".5" y=".5" width="23" height="23" rx="5" fill="none" stroke="rgba(250,250,249,.22)" stroke-width="1"/>`
  for (const c of cols) s += `<rect x="${c.x}" y="4" width="${c.w}" height="4" rx="1.2" fill="#fafaf9" opacity=".95"/>`
  s += `<path d="M16.9 5.4 L19.1 5.4 L18 6.9 Z" fill="#ff3e00"/>`
  for (const ry of [9, 13, 17]) cols.forEach((c, i) => { s += `<rect x="${c.x}" y="${ry}" width="${c.w}" height="3" rx=".9" fill="${i === 2 ? '#ff3e00' : '#fafaf9'}" opacity="${i === 2 ? 1 : 0.32}"/>` })
  return s + '</svg>'
}

// Drawn schematics: ink strokes, orange for the one thing that matters.
function art(kind, fg = '#1c1917', faint = '#d6d3d1') {
  const O = '#ff3e00'
  const box = (x, y, w, h, f = 'none', s = fg, r = 8, sw = 3) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${f}" stroke="${s}" stroke-width="${sw}"/>`
  const bar = (x, y, w, h, f) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="${f}"/>`
  const v = (inner) => `<svg viewBox="0 0 300 200" fill="none" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`
  if (kind === 'data') return v(box(14, 20, 100, 74) + bar(26, 36, 60, 8, fg) + bar(26, 54, 70, 6, faint) + bar(26, 68, 50, 6, faint)
    + box(186, 20, 100, 74) + bar(198, 36, 60, 8, fg) + bar(198, 54, 70, 6, faint) + bar(198, 68, 50, 6, faint)
    + box(100, 120, 100, 70, 'none', O) + bar(112, 136, 60, 8, O) + bar(112, 154, 70, 6, faint) + bar(112, 168, 50, 6, faint)
    + `<path d="M64 94 V150 H100 M236 94 V150 H200" stroke="${fg}" stroke-width="3"/>`)
  if (kind === 'screens') return v(box(10, 14, 280, 172) + box(26, 32, 76, 44) + box(112, 32, 76, 44) + box(198, 32, 76, 44, 'none', O)
    + bar(36, 46, 40, 7, faint) + bar(36, 60, 50, 9, fg) + bar(122, 46, 40, 7, faint) + bar(122, 60, 50, 9, fg) + bar(208, 46, 40, 7, faint) + bar(208, 60, 50, 9, O)
    + [0, 1, 2, 3, 4, 5].map((i) => bar(34 + i * 40, 168 - [40, 62, 30, 78, 52, 66][i], 24, [40, 62, 30, 78, 52, 66][i], i === 3 ? O : fg)).join(''))
  if (kind === 'themes') return v(`<circle cx="105" cy="100" r="62" fill="#fafaf9" stroke="${fg}" stroke-width="3"/><circle cx="160" cy="100" r="62" fill="#44403c" stroke="${fg}" stroke-width="3" opacity=".9"/><circle cx="215" cy="100" r="62" fill="${O}" opacity=".92"/>`)
  if (kind === 'logic') return v(`<path d="M70 40 L22 100 L70 160 M230 40 L278 100 L230 160" stroke="${fg}" stroke-width="6"/>` + bar(100, 60, 110, 10, fg) + bar(120, 84, 80, 10, O) + bar(120, 108, 100, 10, faint) + bar(100, 132, 60, 10, fg))
  if (kind === 'preview') return v(box(10, 24, 190, 128) + bar(24, 40, 162, 10, faint) + bar(24, 62, 100, 70, faint) + `<path d="M80 152 L70 176 H140 L130 152" stroke="${fg}" stroke-width="3"/>`
    + box(222, 54, 68, 124, '#fff', O, 12) + bar(234, 76, 44, 8, O) + bar(234, 92, 44, 30, faint) + bar(234, 130, 30, 8, faint))
  if (kind === 'ship') return v(box(20, 20, 160, 160) + [0, 1, 2, 3, 4].map((i) => bar(40 + (i % 2) * 18, 42 + i * 26, 100 - (i % 2) * 30, 10, i === 4 ? O : i % 2 ? faint : fg)).join('')
    + `<path d="M210 100 H280 M252 72 L280 100 L252 128" stroke="${O}" stroke-width="7"/>`)
  return ''
}

// ------------------------------------------------------------------ build
let plan = []
let clips = {}
const nodes = []
function build() {
  const stage = document.getElementById('stage')
  let at = 0
  plan = SHOTS.map((s) => { const p = { ...s, start: at, end: at + s.dur }; at += s.dur; return p })
  for (const s of plan) {
    const n = el('div', 'shot')
    n.dataset.id = s.id
    const anis = []
    const add = (parent, node, t, opts = {}) => { node.classList.add('ani'); parent.appendChild(node); anis.push({ node, t, ...opts }); return node }
    if (s.kind === 'logo') {
      n.classList.add('dark')
      const w = el('div', 'logo-wrap')
      w.innerHTML = LOGO(150) + `<div class="wordmark"><span class="sv">Sv</span>Grid<span class="studio">Studio</span></div>`
      add(n, w, 0.15, { scale: true })
    } else if (s.kind === 'text') {
      n.classList.add('light')
      n.appendChild(Object.assign(el('div', 'blob'), { style: 'width:900px;height:700px;right:-200px;top:-200px;background:#ffe4d4' }))
      const box = el('div', 'text')
      n.appendChild(box)
      for (const l of s.lines) add(box, el('div', 'ln' + (l.cls ? ' ' + l.cls : ''), l.html), l.t)
    } else if (s.kind === 'chips') {
      n.classList.add('light')
      add(n, el('div', 'rule'), 0.1)
      add(n, el('div', 'head', s.head), 0.2)
      const box = el('div', 'chips')
      n.appendChild(box)
      s.chips.forEach(([label, color, glyph], i) => add(box, el('div', 'chip', `<i style="background:${color}">${glyph}</i>${label}`), 0.9 + i * 0.16, { pop: true }))
    } else if (s.kind === 'proof') {
      n.classList.add('light')
      add(n, el('div', 'proof-top', 'From the team behind jQWidgets'), 0.2)
      const big = add(n, el('div', 'proof-big', '<span class="count">5,000+</span><small>customers, including</small>'), 0.6)
      big.dataset.count = '1'
      const names = el('div', 'names')
      n.appendChild(names)
      ;['Samsung', 'Boeing', 'NVIDIA', 'Microsoft', 'Nokia', 'Intel'].forEach((nm, i) => add(names, el('span', '', nm), 1.9 + i * 0.22))
    } else if (s.kind === 'tiles') {
      n.classList.add('light')
      add(n, el('div', 'rule'), 0.1)
      add(n, el('div', 'head', s.head), 0.2)
      const box = el('div', 'tiles')
      n.appendChild(box)
      const T = [['01', 'Data model', 'data'], ['02', 'Screens', 'screens'], ['03', 'Themes', 'themes'], ['04', 'Logic', 'logic'], ['05', 'Preview', 'preview'], ['06', 'Generate and deploy', 'ship']]
      T.forEach(([num, name, a], i) => add(box, el('div', 'tile', `<div class="n">${num}</div><b>${name}</b>${art(a)}`), 0.8 + i * 0.22, { pop: true }))
    } else if (s.kind === 'title') {
      n.classList.add('dark')
      add(n, el('div', 't-num', s.n), 0.1, { dx: 60 })
      add(n, el('div', 't-title', s.title), 0.18, { dx: 80 })
      add(n, el('div', 't-sub', s.sub), 0.4, { dx: 80 })
      add(n, Object.assign(el('div', 't-art', art(s.art, '#fafaf9', '#57534e'))), 0.3, { dx: -80 })
    } else if (s.kind === 'clip') {
      n.classList.add('light')
      add(n, el('div', 'clip-label', `${s.label}<span>${s.cap}</span>`), 0.15)
      const card = add(n, el('div', 'card'), 0, { rise: true })
      const img = el('img')
      img.alt = ''
      card.appendChild(img)
      card.appendChild(el('div', 'ph', `footage: ${s.id}`))
      s.img = img
    } else if (s.kind === 'checks') {
      n.classList.add('light')
      add(n, el('div', 'rule'), 0.1)
      add(n, el('div', 'head', s.head), 0.2)
      const box = el('div', 'checks')
      n.appendChild(box)
      const tick = '<svg viewBox="0 0 24 24" width="26" height="26"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#ff3e00" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
      s.items.forEach((it, i) => add(box, el('div', 'check', `<i>${tick}</i>${it}`), 1.0 + i * 0.85, { pop: true }))
    } else if (s.kind === 'cta') {
      n.classList.add('dark')
      add(n, el('div', 'cta-big', s.big), 0.15)
      if (s.pill) add(n, el('div', 'pill', s.pill), 0.8, { pop: true })
      if (s.btn) add(n, el('div', 'btn', s.btn), 0.8, { pop: true })
      if (s.sub) add(n, el('div', 'cta-sub', s.sub), 1.3)
    }
    stage.appendChild(n)
    nodes.push({ s, n, anis })
  }
}

// ------------------------------------------------------------------ seek
function seek(t) {
  for (const { s, n, anis } of nodes) {
    const on = t >= s.start && t < s.end
    n.style.display = on ? 'block' : 'none'
    if (!on) continue
    const u = t - s.start
    const left = s.end - t
    // Every shot eases in over its first frames and out over its last.
    n.style.opacity = String(clamp(Math.min(u / 0.22, left / 0.22 + 0.15)))
    for (const a of anis) {
      const k = easeOut(clamp((u - a.t) / (a.pop ? 0.38 : 0.55)))
      let tf = ''
      if (a.scale) tf = `scale(${0.92 + 0.08 * k})`
      else if (a.dx) tf = `translateX(${(1 - k) * a.dx}px)`
      else if (a.pop) tf = `translateY(${(1 - k) * 22}px) scale(${0.96 + 0.04 * k})`
      else if (a.rise) tf = `translateY(${(1 - k) * 46}px)`
      else tf = `translateY(${(1 - k) * 30}px)`
      a.node.style.opacity = String(k)
      a.node.style.transform = tf
    }
    if (s.kind === 'logo') {
      // Outro holds; intro drifts the wordmark a touch wider while it sits.
      const w = n.querySelector('.logo-wrap')
      w.style.gap = `${34 + Math.min(u, 3) * 4}px`
    }
    if (s.kind === 'proof') {
      const k = easeOut(clamp((u - 0.6) / 1.2))
      n.querySelector('.count').textContent = `${Math.round(5000 * k).toLocaleString('en-US')}+`
    }
    if (s.kind === 'clip') {
      const frames = clips[s.id]
      const ph = n.querySelector('.ph')
      if (frames && frames.length) {
        const i = Math.min(frames.length - 1, Math.floor(u * 30 + 1e-6))
        if (s.img.getAttribute('src') !== frames[i]) s.img.src = frames[i]
        s.img.style.display = 'block'
        ph.style.display = 'none'
        // A slow push-in keeps a still screen alive. A clip that opens a
        // dialog also zooms to it once it is up: zoom = [scale, origin, at s].
        const [z, origin, zAt] = s.zoom ?? [1, '50% 40%', 0]
        const zk = s.zoom ? easeInOut(clamp((u - zAt) / 0.7)) : 0
        s.img.style.transformOrigin = origin
        s.img.style.transform = `scale(${(1 + (z - 1) * zk) * (1 + 0.03 * easeInOut(clamp(u / s.dur)))})`
      } else {
        s.img.style.display = 'none'
        ph.style.display = 'grid'
      }
    }
  }
}

build()
window.__plan = () => plan.map(({ id, kind, start, end, dur }) => ({ id, kind, start, end, dur }))
window.__setClips = (c) => { clips = c }
window.__seek = (t) => seek(t)
window.__ready = () => Promise.all([...document.querySelectorAll('.shot img')]
  .filter((i) => i.offsetParent !== null && i.getAttribute('src'))
  .map((i) => (i.complete ? null : new Promise((r) => { i.onload = r; i.onerror = r }))))
seek(0)
</script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="The grid and edit panel talk to a controller, which calls your ServerDataSource, which reads any backend">
  <rect x="0" y="0" width="860" height="300" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="30" y="40" font-size="17" font-weight="700" fill="#0f172a">One contract: ServerDataSource</text>
  <text x="30" y="61" font-size="12.5" fill="#64748b">Sort, filter, page, and CRUD all flow through the same interface - so the UI is identical over any backend.</text>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Row of stages -->
  <!-- UI -->
  <rect x="30" y="92" width="180" height="86" rx="11" fill="#eff4ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="120" y="120" font-size="13.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">UI</text>
  <text x="120" y="140" font-size="11" fill="#3b5bdb" text-anchor="middle">grid + edit panel</text>
  <text x="120" y="158" font-size="10.5" fill="#64748b" text-anchor="middle">renders its own</text>
  <text x="120" y="171" font-size="10.5" fill="#64748b" text-anchor="middle">server-mode controls</text>

  <!-- controller -->
  <rect x="250" y="92" width="180" height="86" rx="11" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="340" y="118" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">createServerDataSource</text>
  <text x="340" y="138" font-size="10.5" fill="#64748b" text-anchor="middle">controller: state,</text>
  <text x="340" y="152" font-size="10.5" fill="#64748b" text-anchor="middle">lifecycle, optimistic</text>
  <text x="340" y="166" font-size="10.5" fill="#64748b" text-anchor="middle">CRUD, request de-dupe</text>

  <!-- your binding -->
  <rect x="470" y="92" width="180" height="86" rx="11" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="560" y="118" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">ServerDataSource</text>
  <text x="560" y="138" font-size="10.5" fill="#64748b" text-anchor="middle">your binding:</text>
  <text x="560" y="152" font-size="10.5" fill="#64748b" text-anchor="middle">getRows / createRow /</text>
  <text x="560" y="166" font-size="10.5" fill="#64748b" text-anchor="middle">updateRow / deleteRow</text>

  <!-- backends -->
  <rect x="690" y="92" width="140" height="86" rx="11" fill="#0f172a"/>
  <text x="760" y="116" font-size="12.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">Any backend</text>
  <text x="760" y="135" font-size="10" fill="#94a3b8" text-anchor="middle">Postgres · MySQL</text>
  <text x="760" y="149" font-size="10" fill="#94a3b8" text-anchor="middle">SQL Server · SQLite</text>
  <text x="760" y="163" font-size="10" fill="#94a3b8" text-anchor="middle">Supabase · REST · memory</text>

  <!-- arrows -->
  <g stroke="#94a3b8" stroke-width="1.6" fill="none">
    <line x1="210" y1="135" x2="248" y2="135" marker-end="url(#arr)"/>
    <line x1="430" y1="135" x2="468" y2="135" marker-end="url(#arr)"/>
    <line x1="650" y1="135" x2="688" y2="135" marker-end="url(#arr)"/>
  </g>

  <!-- request/response labels -->
  <text x="229" y="126" font-size="9" fill="#64748b" text-anchor="middle">intent</text>
  <text x="449" y="126" font-size="9" fill="#64748b" text-anchor="middle">request</text>
  <text x="669" y="126" font-size="9" fill="#64748b" text-anchor="middle">query</text>

  <text x="430" y="214" font-size="11.5" fill="#475569" text-anchor="middle">Swap the rightmost box - SQL, Supabase, REST, or an in-memory array - and nothing to the left changes.</text>
  <text x="430" y="234" font-size="11" fill="#94a3b8" text-anchor="middle">getRows returns { rows, rowCount } so the pager can show "1 to 25 of 1,240".</text>
</svg>

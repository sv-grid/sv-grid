<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="The visual designer has a top bar, a screens rail, a block palette, a live canvas preview, and a properties inspector">
  <rect x="0" y="0" width="900" height="500" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="28" y="36" font-size="18" font-weight="800" fill="#0f172a">The visual designer at a glance</text>
  <text x="28" y="57" font-size="12.5" fill="#64748b">Everything is point-and-click. Here is where each thing lives.</text>

  <!-- app frame -->
  <g>
    <!-- top bar -->
    <rect x="28" y="76" width="844" height="34" rx="7" fill="#0f172a"/>
    <text x="44" y="98" font-size="12" font-weight="700" fill="#e2e8f0">My Sales App</text>
    <rect x="742" y="82" width="116" height="22" rx="6" fill="#16a34a"/>
    <text x="800" y="97" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Generate app</text>

    <!-- rail (screens) -->
    <rect x="28" y="118" width="118" height="330" rx="7" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text x="42" y="140" font-size="10.5" font-weight="700" fill="#475569">SCREENS</text>
    <rect x="40" y="150" width="94" height="20" rx="4" fill="#dbe4ff"/>
    <text x="50" y="164" font-size="10.5" fill="#1d4ed8">Customers</text>
    <rect x="40" y="176" width="94" height="20" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="50" y="190" font-size="10.5" fill="#475569">Orders</text>
    <rect x="40" y="202" width="94" height="20" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="50" y="216" font-size="10.5" fill="#475569">Dashboard</text>
    <rect x="40" y="418" width="94" height="20" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="3 3"/>
    <text x="87" y="432" font-size="10.5" fill="#64748b" text-anchor="middle">+ Add screen</text>

    <!-- palette -->
    <rect x="154" y="118" width="70" height="330" rx="7" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="189" y="140" font-size="9.5" font-weight="700" fill="#475569" text-anchor="middle">BLOCKS</text>
    <g font-size="9.5" fill="#334155" text-anchor="middle">
      <rect x="164" y="150" width="50" height="34" rx="5" fill="#fff" stroke="#e2e8f0"/><text x="189" y="171">Grid</text>
      <rect x="164" y="190" width="50" height="34" rx="5" fill="#fff" stroke="#e2e8f0"/><text x="189" y="211">Chart</text>
      <rect x="164" y="230" width="50" height="34" rx="5" fill="#fff" stroke="#e2e8f0"/><text x="189" y="251">KPI</text>
      <rect x="164" y="270" width="50" height="34" rx="5" fill="#fff" stroke="#e2e8f0"/><text x="189" y="288">Dash-</text><text x="189" y="299">board</text>
    </g>

    <!-- canvas -->
    <rect x="232" y="118" width="420" height="330" rx="7" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="248" y="140" font-size="10.5" font-weight="700" fill="#4f46e5">LIVE PREVIEW</text>
    <rect x="248" y="150" width="388" height="22" rx="4" fill="#f1f5f9"/>
    <text x="258" y="165" font-size="10" font-weight="600" fill="#64748b">Name        Email             Tier      MRR</text>
    <g font-size="10" fill="#334155">
      <rect x="248" y="172" width="388" height="22" fill="#fff" stroke="#eef2f7"/><text x="258" y="187">Ada Lovelace   ada@x.io       Pro     $1,200</text>
      <rect x="248" y="194" width="388" height="22" fill="#fff" stroke="#eef2f7"/><text x="258" y="209">Alan Turing    alan@x.uk      Free    $240</text>
      <rect x="248" y="216" width="388" height="22" fill="#fff" stroke="#eef2f7"/><text x="258" y="231">Grace Hopper   grace@navy    Pro     $980</text>
    </g>
    <rect x="248" y="248" width="120" height="26" rx="6" fill="#eff4ff" stroke="#2563eb"/>
    <text x="308" y="265" font-size="10.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">+ New customer</text>

    <!-- inspector -->
    <rect x="660" y="118" width="212" height="330" rx="7" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="674" y="140" font-size="10.5" font-weight="700" fill="#475569">PROPERTIES</text>
    <text x="674" y="162" font-size="10" fill="#64748b">Fields</text>
    <g font-size="10" fill="#334155">
      <rect x="672" y="170" width="188" height="20" rx="4" fill="#fff" stroke="#e2e8f0"/><text x="682" y="184">name — text — required</text>
      <rect x="672" y="194" width="188" height="20" rx="4" fill="#fff" stroke="#e2e8f0"/><text x="682" y="208">email — text — email</text>
      <rect x="672" y="218" width="188" height="20" rx="4" fill="#fff" stroke="#e2e8f0"/><text x="682" y="232">tier — choice</text>
      <rect x="672" y="242" width="188" height="20" rx="4" fill="#fff" stroke="#e2e8f0"/><text x="682" y="256">mrr — number</text>
    </g>
    <text x="674" y="286" font-size="10" fill="#64748b">Data source</text>
    <rect x="672" y="294" width="188" height="22" rx="4" fill="#fff" stroke="#e2e8f0"/>
    <text x="682" y="309" font-size="10" fill="#334155">Sample data ▾</text>
  </g>

  <!-- numbered callouts -->
  <g font-size="11" font-weight="700">
    <circle cx="152" cy="466" r="9" fill="#2563eb"/><text x="152" y="470" fill="#fff" text-anchor="middle">1</text>
    <text x="166" y="470" fill="#334155">Screens</text>
    <circle cx="256" cy="466" r="9" fill="#2563eb"/><text x="256" y="470" fill="#fff" text-anchor="middle">2</text>
    <text x="270" y="470" fill="#334155">Blocks to add</text>
    <circle cx="400" cy="466" r="9" fill="#2563eb"/><text x="400" y="470" fill="#fff" text-anchor="middle">3</text>
    <text x="414" y="470" fill="#334155">Live preview</text>
    <circle cx="548" cy="466" r="9" fill="#2563eb"/><text x="548" y="470" fill="#fff" text-anchor="middle">4</text>
    <text x="562" y="470" fill="#334155">Edit fields &amp; data</text>
    <circle cx="726" cy="466" r="9" fill="#16a34a"/><text x="726" y="470" fill="#fff" text-anchor="middle">5</text>
    <text x="740" y="470" fill="#334155">Generate the app</text>
  </g>
</svg>

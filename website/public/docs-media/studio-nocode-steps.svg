<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="Build a data app in four no-code steps: launch the designer, start from a sample or your database, arrange and tune it visually, then generate the app">
  <rect x="0" y="0" width="920" height="280" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="34" y="44" font-size="20" font-weight="800" fill="#0f172a">Build a data app - no code required</text>
  <text x="34" y="67" font-size="13" fill="#64748b">Four steps in your browser. You never write a line of code; the app is generated for you at the end.</text>

  <!-- connecting line -->
  <line x1="120" y1="168" x2="800" y2="168" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Step 1 -->
  <circle cx="120" cy="168" r="26" fill="#2563eb"/>
  <text x="120" y="176" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
  <text x="120" y="222" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle">Open the designer</text>
  <text x="120" y="242" font-size="11" fill="#64748b" text-anchor="middle">One command opens it</text>
  <text x="120" y="256" font-size="11" fill="#64748b" text-anchor="middle">in your browser.</text>

  <!-- Step 2 -->
  <circle cx="347" cy="168" r="26" fill="#2563eb"/>
  <text x="347" y="176" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
  <text x="347" y="222" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle">Start with your data</text>
  <text x="347" y="242" font-size="11" fill="#64748b" text-anchor="middle">Pick a ready-made sample,</text>
  <text x="347" y="256" font-size="11" fill="#64748b" text-anchor="middle">or connect your database.</text>

  <!-- Step 3 -->
  <circle cx="574" cy="168" r="26" fill="#2563eb"/>
  <text x="574" y="176" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>
  <text x="574" y="222" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle">Arrange it visually</text>
  <text x="574" y="242" font-size="11" fill="#64748b" text-anchor="middle">Add screens and charts,</text>
  <text x="574" y="256" font-size="11" fill="#64748b" text-anchor="middle">tune fields - see it live.</text>

  <!-- Step 4 -->
  <circle cx="800" cy="168" r="26" fill="#16a34a"/>
  <text x="800" y="176" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">4</text>
  <text x="800" y="222" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle">Generate the app</text>
  <text x="800" y="242" font-size="11" fill="#64748b" text-anchor="middle">One click writes a real,</text>
  <text x="800" y="256" font-size="11" fill="#64748b" text-anchor="middle">runnable app for you.</text>

  <!-- little glyph badges above each circle -->
  <text x="120" y="112" font-size="26" text-anchor="middle">🖥️</text>
  <text x="347" y="112" font-size="26" text-anchor="middle">🗂️</text>
  <text x="574" y="112" font-size="26" text-anchor="middle">🎨</text>
  <text x="800" y="112" font-size="26" text-anchor="middle">🚀</text>
</svg>

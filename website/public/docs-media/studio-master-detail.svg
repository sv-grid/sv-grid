<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="A master row expands into a full-width detail grid of related child rows">
  <rect x="0" y="0" width="700" height="360" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="28" y="38" font-size="17" font-weight="700" fill="#0f172a">How master / detail renders</text>
  <text x="28" y="59" font-size="12.5" fill="#64748b">Click a master row; a synthetic full-width detail row is woven in after it, hosting a nested grid.</text>

  <!-- master grid -->
  <g>
    <rect x="28" y="82" width="644" height="30" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text x="44" y="102" font-size="12" font-weight="600" fill="#475569">Order</text>
    <text x="300" y="102" font-size="12" font-weight="600" fill="#475569">Customer</text>
    <text x="560" y="102" font-size="12" font-weight="600" fill="#475569">Total</text>

    <rect x="28" y="112" width="644" height="30" fill="#ffffff" stroke="#eef2f7"/>
    <text x="44" y="132" font-size="12" fill="#334155">#1001</text>
    <text x="300" y="132" font-size="12" fill="#334155">Acme Corp</text>
    <text x="560" y="132" font-size="12" fill="#334155">$4,200</text>

    <!-- expanded master row -->
    <rect x="28" y="142" width="644" height="30" fill="#eff4ff" stroke="#dbe4ff"/>
    <text x="44" y="162" font-size="12" font-weight="700" fill="#1d4ed8">▾ #1002</text>
    <text x="300" y="162" font-size="12" font-weight="700" fill="#1d4ed8">Globex</text>
    <text x="560" y="162" font-size="12" font-weight="700" fill="#1d4ed8">$8,750</text>
  </g>

  <!-- detail region (full width) -->
  <rect x="44" y="176" width="612" height="120" rx="8" fill="#fbfcfe" stroke="#c7d2fe"/>
  <text x="60" y="197" font-size="11.5" font-weight="700" fill="#4f46e5">Line items  ·  detailSchema  ·  getChildren(order)</text>
  <g>
    <rect x="60" y="208" width="580" height="24" rx="4" fill="#f1f5f9"/>
    <text x="72" y="224" font-size="10.5" font-weight="600" fill="#64748b">SKU</text>
    <text x="260" y="224" font-size="10.5" font-weight="600" fill="#64748b">Qty</text>
    <text x="420" y="224" font-size="10.5" font-weight="600" fill="#64748b">Price</text>
    <text x="560" y="224" font-size="10.5" font-weight="600" fill="#64748b">Line</text>
    <line x1="60" y1="256" x2="640" y2="256" stroke="#eef2f7"/>
    <text x="72" y="250" font-size="10.5" fill="#334155">WID-9</text>
    <text x="260" y="250" font-size="10.5" fill="#334155">3</text>
    <text x="420" y="250" font-size="10.5" fill="#334155">$1,250</text>
    <text x="560" y="250" font-size="10.5" fill="#334155">$3,750</text>
    <text x="72" y="278" font-size="10.5" fill="#334155">BRK-2</text>
    <text x="260" y="278" font-size="10.5" fill="#334155">5</text>
    <text x="420" y="278" font-size="10.5" fill="#334155">$1,000</text>
    <text x="560" y="278" font-size="10.5" fill="#334155">$5,000</text>
  </g>

  <!-- next master row -->
  <rect x="28" y="300" width="644" height="30" fill="#ffffff" stroke="#eef2f7"/>
  <text x="44" y="320" font-size="12" fill="#334155">#1003</text>
  <text x="300" y="320" font-size="12" fill="#334155">Initech</text>
  <text x="560" y="320" font-size="12" fill="#334155">$1,120</text>
</svg>

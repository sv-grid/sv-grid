<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1224"/>
      <stop offset="1" stop-color="#161f38"/>
    </linearGradient>
    <linearGradient id="markBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e2a45"/>
      <stop offset="1" stop-color="#0c1426"/>
    </linearGradient>
    <linearGradient id="markEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="markAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.7" cy="0.15" r="0.55">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dot" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#9aa6c2" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#page)"/>
  <rect width="1200" height="630" fill="url(#dot)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Logo lockup -->
  <g transform="translate(80, 86)">
    <!-- Mark: 88px scaled-up version of the header mark -->
    <g>
      <rect x="0" y="0" width="88" height="88" rx="16.5" fill="url(#markBg)"/>
      <rect x="0" y="0" width="88" height="44" rx="16.5" fill="url(#markEdge)"/>
      <rect x="0.5" y="0.5" width="87" height="87" rx="16" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
      <g transform="translate(22, 22)">
        <rect width="18" height="18" rx="3.3" fill="#cbd5e1" fill-opacity="0.80"/>
        <rect x="26" width="18" height="18" rx="3.3" fill="url(#markAccent)"/>
        <rect y="26" width="18" height="18" rx="3.3" fill="#cbd5e1" fill-opacity="0.62"/>
        <rect x="26" y="26" width="18" height="18" rx="3.3" fill="#cbd5e1" fill-opacity="0.80"/>
      </g>
    </g>
    <!-- Wordmark beside mark -->
    <text x="112" y="60" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="48" fill="#e8ecf6" letter-spacing="-1">
      <tspan>Sv</tspan><tspan fill-opacity="0.78">Grid</tspan>
    </text>
  </g>

  <!-- Headline -->
  <text x="80" y="280" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="72" fill="#ffffff" letter-spacing="-2">
    The enterprise-grade
  </text>
  <text x="80" y="362" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="72" letter-spacing="-2">
    <tspan fill="#ffffff">Svelte 5 </tspan><tspan fill="url(#markAccent)">data grid.</tspan>
  </text>

  <!-- Sub-headline -->
  <text x="80" y="438" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="26" fill="#9aa6c2">
    Headless engine. Production render component. 92% line coverage.
  </text>
  <text x="80" y="476" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="26" fill="#9aa6c2">
    20 examples. 54 docs. MCP server included.
  </text>

  <!-- Footer strip -->
  <rect x="0" y="566" width="1200" height="64" fill="#0d152a"/>
  <line x1="0" y1="566" x2="1200" y2="566" stroke="rgba(154,166,194,0.18)" stroke-width="1"/>
  <text x="80" y="606" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="22" fill="#9aa6c2" letter-spacing="0.5">
    sv-grid.github.io
  </text>
  <text x="1120" y="606" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="22" fill="#9aa6c2" letter-spacing="0.5">
    Built by jQWidgets
  </text>
</svg>

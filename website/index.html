<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#181d27" />

    <!-- Google tag (gtag.js) - GA4 + Google Ads conversion measurement.
         Placed as high in <head> as possible per Google's recommendation;
         the loader is async so it does not block the SPA shell. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-Z6896B9VX8"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-Z6896B9VX8');
    </script>

    <!-- Inter is the first font in body's font-family stack; load it once
         site-wide so it isn't only fetched when the theme builder mounts.
         Without this, navigating to /theme-builder swapped the nav's
         rendered font from system-ui to Inter mid-session. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />

    <!-- Default meta - JS overrides per route. The defaults below ensure
         crawlers that don't run JS still get full title + description
         + OpenGraph for the homepage. -->
    <title>SvGrid - The Svelte 5 Data Grid with Headless Core + Render Component</title>
    <meta
      name="description"
      content="SvGrid is a modern Svelte 5 data grid. Headless-first engine plus a full render component. Enterprise-grade features: sorting, Excel-style filters, grouping, virtualization, inline editing, server-side data. 100% Svelte runes, MIT-licensed core."
    />
    <meta
      name="keywords"
      content="svelte data grid, svelte 5 grid, svelte table, tanstack table svelte, sv-grid, data grid, headless table, enterprise svelte grid"
    />
    <meta name="author" content="jQWidgets" />
    <link rel="canonical" href="https://svgrid.com/" />

    <!-- Open Graph. PNG is listed first because some scrapers (LinkedIn in
         particular) ignore SVG OG images; the SVG is kept as a secondary
         fallback for clients that prefer it. The PNG is rasterized from
         /og-image.svg at build time (see tools/prerender-site.mjs). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SvGrid" />
    <meta
      property="og:title"
      content="SvGrid - The Svelte 5 Data Grid"
    />
    <meta
      property="og:description"
      content="A modern Svelte 5 data grid. Headless-first engine plus a full render component. Sorting, filtering, grouping, virtualization, inline editing, server-side data."
    />
    <meta property="og:url" content="https://svgrid.com/" />
    <meta property="og:image" content="https://svgrid.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="SvGrid - the enterprise-grade Svelte 5 data grid" />
    <meta property="og:image" content="https://svgrid.com/og-image.svg" />
    <meta property="og:image:type" content="image/svg+xml" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SvGrid - The Svelte 5 Data Grid" />
    <meta
      name="twitter:description"
      content="A modern Svelte 5 data grid. Headless-first engine plus a full render component."
    />
    <meta name="twitter:image" content="https://svgrid.com/og-image.png" />

    <!-- Favicon set: the SvGrid mark - a flat data-table glyph on a solid plate.
         Simplified for small sizes: a header row + 2 body rows (not 3) with the
         right "active/sorted" column solid brand-orange top-to-bottom, so it
         stays legible as a grid down to 16px (the older 3-row + sort-caret
         version muddied into a smudge in the tab). The SVG below is inlined as a
         data URI (modern browsers); the .png / .ico / apple-touch files cover
         Safari/iOS + legacy fallbacks. Regenerate ALL of them via
         tools/render-favicon.mjs. -->

      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20width%3D%2224%22%20height%3D%2224%22%3E%3Crect%20x%3D%22.5%22%20y%3D%22.5%22%20width%3D%2223%22%20height%3D%2223%22%20rx%3D%225%22%20fill%3D%22%23111a2e%22%2F%3E%3Crect%20x%3D%22.5%22%20y%3D%22.5%22%20width%3D%2223%22%20height%3D%2223%22%20rx%3D%225%22%20fill%3D%22none%22%20stroke%3D%22rgba(148%2C163%2C184%2C0.28)%22%20stroke-width%3D%221%22%2F%3E%3Crect%20x%3D%224.5%22%20y%3D%224.5%22%20width%3D%226%22%20height%3D%223.6%22%20rx%3D%221.2%22%20fill%3D%22%23e7edf5%22%20opacity%3D%22.95%22%2F%3E%3Crect%20x%3D%2211.5%22%20y%3D%224.5%22%20width%3D%223.2%22%20height%3D%223.6%22%20rx%3D%221.2%22%20fill%3D%22%23e7edf5%22%20opacity%3D%22.95%22%2F%3E%3Crect%20x%3D%2215.7%22%20y%3D%224.5%22%20width%3D%223.8%22%20height%3D%223.6%22%20rx%3D%221.2%22%20fill%3D%22%23ff5a1f%22%2F%3E%3Crect%20x%3D%224.5%22%20y%3D%2210.2%22%20width%3D%226%22%20height%3D%223.6%22%20rx%3D%221%22%20fill%3D%22%23e7edf5%22%20opacity%3D%22.32%22%2F%3E%3Crect%20x%3D%2211.5%22%20y%3D%2210.2%22%20width%3D%223.2%22%20height%3D%223.6%22%20rx%3D%221%22%20fill%3D%22%23e7edf5%22%20opacity%3D%22.32%22%2F%3E%3Crect%20x%3D%2215.7%22%20y%3D%2210.2%22%20width%3D%223.8%22%20height%3D%223.6%22%20rx%3D%221%22%20fill%3D%22%23ff5a1f%22%2F%3E%3Crect%20x%3D%224.5%22%20y%3D%2215.9%22%20width%3D%226%22%20height%3D%223.6%22%20rx%3D%221%22%20fill%3D%22%23e7edf5%22%20opacity%3D%22.32%22%2F%3E%3Crect%20x%3D%2211.5%22%20y%3D%2215.9%22%20width%3D%223.2%22%20height%3D%223.6%22%20rx%3D%221%22%20fill%3D%22%23e7edf5%22%20opacity%3D%22.32%22%2F%3E%3Crect%20x%3D%2215.7%22%20y%3D%2215.9%22%20width%3D%223.8%22%20height%3D%223.6%22%20rx%3D%221%22%20fill%3D%22%23ff5a1f%22%2F%3E%3C%2Fsvg%3E"
    />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Legacy fallback for browsers that only request /favicon.ico. -->
    <link rel="alternate icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />

    <!-- Prerendered SEO fallback is injected inside #root for crawlers (which
         read the raw HTML regardless of CSS). Hide it from users so it doesn't
         flash before the SPA mounts; main.ts clears #root and Svelte then
         renders the real, styled app. Render-blocking inline style = no flash. -->
    <style>
      [data-prerender] { display: none !important; }
    </style>
  </head>
  <body>
    <!-- Crawler-readable fallback. Hidden once Svelte hydrates - but search
         engines that don't run JS still see the headline + key features and
         can index the page meaningfully. -->
    <noscript>
      <style>
        body { background: #181d27; color: #e2e8f0; font-family: system-ui, sans-serif; padding: 2rem; }
        a { color: #22d3ee; }
        h1 { color: #fff; }
      </style>
      <h1>SvGrid - The Svelte 5 Data Grid</h1>
      <p>
        SvGrid is a modern data grid for Svelte 5. Headless-first engine plus a full-featured
        render component. Built by jQWidgets - the team behind jqwidgets.com and htmlelements.com,
        whose other UI components are used in production by 5,000+ companies (Samsung, Boeing,
        NVIDIA, Microsoft, Nokia, Intel). SvGrid is a new Svelte 5 product from the same team.
      </p>
      <ul>
        <li>Sorting, Excel-style filters, grouping + aggregation</li>
        <li>Row + column virtualization (100k rows smooth)</li>
        <li>Inline editing with cascade formulas</li>
        <li>Server-side data, master/detail, tree</li>
        <li>WAI-ARIA + full keyboard navigation</li>
        <li>150+ production-quality examples and a full documentation site</li>
        <li>MCP server for AI assistants (Claude, Cursor)</li>
      </ul>
      <p>
        This site requires JavaScript to browse the live demos. The full source is on
        <a href="https://github.com/sv-grid/sv-grid">GitHub</a>, and the library is on
        <a href="https://www.npmjs.com/package/@svgrid/grid">npm</a> as
        <code>@svgrid/grid</code>.
      </p>
    </noscript>

    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

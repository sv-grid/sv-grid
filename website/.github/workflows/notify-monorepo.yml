name: Notify monorepo to deploy

# The website is consumed as a git submodule by the public sv-grid/sv-grid repo,
# which owns the GitHub Pages deploy (it also needs the grid/enterprise packages
# + examples demos to build). Website content changes don't land in that repo, so
# push-to-deploy is wired by firing a repository_dispatch at it on every push to
# main. The monorepo's deploy-website.yml listens for `types: [website-updated]`
# and clones this repo's latest main.
#
# Requires a repo secret MONOREPO_DISPATCH_TOKEN: a PAT (fine-grained, scoped to
# sv-grid/sv-grid with Contents: read+write, or classic `repo`) allowed to send
# dispatches to the monorepo. `[skip ci]` commits (the daily blog auto-commits)
# skip this workflow, so scheduled posts still publish via the monorepo's daily
# rebuild rather than an immediate redeploy.

on:
  push:
    branches: [main]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sv-grid/sv-grid deploy-website
        env:
          TOKEN: ${{ secrets.MONOREPO_DISPATCH_TOKEN }}
        run: |
          curl -sSf -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/sv-grid/sv-grid/dispatches \
            -d '{"event_type":"website-updated"}'
